<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eerste Chat — GwnLarss</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        background: transparent;
        overflow: hidden;
        font-family: 'Inter', system-ui, sans-serif;
    }

    /* ---------- "Eerste chat van de stream": knipoog naar klassieke IM-toastjes van vroeger
       (MSN Messenger/AIM/ICQ/Yahoo! Messenger/Windows XP). Losgetrokken uit alerts.html zodat
       je 'm als eigen OBS-bron kan gebruiken, los van de andere alert-types. Deelt dezelfde
       /api/alerts/stream-databron en instellingen, dus alles blijft in sync met wat je in
       alerts-admin.html instelt. Kies het uiterlijk via ?thema=msn|aim|icq|yahoo|xp. ---------- */
    .msn-toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 320px;
        font-family: Tahoma, 'Segoe UI', sans-serif;
        background: #fff;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 10px 40px -8px rgba(0, 0, 0, 0.6);
        transform: translateY(calc(100% + 24px));
        transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    .msn-toast.is-visible { transform: translateY(0); }
    .msn-toast__header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: linear-gradient(180deg, #6ea8fb, #1958c9);
        color: #fff;
        font-weight: bold;
        font-size: 0.85rem;
    }
    .msn-toast__body {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
    }
    .msn-toast__avatar {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 6px;
        background: #eef3fc;
        border: 1px solid #c9d9f2;
        font-size: 1.3rem;
        flex-shrink: 0;
        overflow: hidden;
    }
    .msn-toast__avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .msn-toast__text { min-width: 0; }
    .msn-toast__name {
        margin: 0 0 2px;
        font-weight: bold;
        font-size: 0.9rem;
        color: #1958c9;
    }
    .msn-toast__message {
        margin: 0;
        font-size: 0.85rem;
        color: #333;
    }

    /* ---------- AIM: geel/zwart, Verdana-gevoel, oranjerode naam (klassieke AIM-linkkleur) ---------- */
    .msn-toast.theme-aim { font-family: Verdana, Arial, sans-serif; }
    .msn-toast.theme-aim .msn-toast__header { background: linear-gradient(180deg, #fff35c, #ffce00); color: #4a3b00; }
    .msn-toast.theme-aim .msn-toast__avatar { background: #fffbe0; border-color: #ffce00; }
    .msn-toast.theme-aim .msn-toast__name { color: #cc3300; }

    /* ---------- ICQ: groen, bloem-vibe ---------- */
    .msn-toast.theme-icq .msn-toast__header { background: linear-gradient(180deg, #b2e07a, #4c9a2a); color: #fff; }
    .msn-toast.theme-icq .msn-toast__avatar { background: #eaffe0; border-color: #7cc750; }
    .msn-toast.theme-icq .msn-toast__name { color: #2d6a1e; }

    /* ---------- Yahoo! Messenger: paars ---------- */
    .msn-toast.theme-yahoo .msn-toast__header { background: linear-gradient(180deg, #d9a6f0, #7b1fa2); color: #fff; }
    .msn-toast.theme-yahoo .msn-toast__avatar { background: #f5e6fc; border-color: #b968c7; }
    .msn-toast.theme-yahoo .msn-toast__name { color: #7b1fa2; }

    /* ---------- Windows XP-balloon: systray-tooltip-vibe met een "staartje" rechtsonder ---------- */
    .msn-toast.theme-xp {
        background: linear-gradient(180deg, #eef7ff, #cfe8fb);
        border: 1px solid #3f7fbf;
        border-radius: 6px;
    }
    .msn-toast.theme-xp::after {
        content: '';
        position: absolute;
        right: 28px;
        bottom: -9px;
        width: 18px;
        height: 18px;
        background: #cfe8fb;
        border-right: 1px solid #3f7fbf;
        border-bottom: 1px solid #3f7fbf;
        transform: rotate(45deg);
    }
    .msn-toast.theme-xp .msn-toast__header { background: transparent; color: #003c74; padding-bottom: 0; }
    .msn-toast.theme-xp .msn-toast__avatar { background: #fff; border-color: #3f7fbf; }
    .msn-toast.theme-xp .msn-toast__name { color: #003c74; }
    .msn-toast.theme-xp .msn-toast__message { color: #000; }

    /* ---------- Skype (klassiek): blauw ---------- */
    .msn-toast.theme-skype .msn-toast__header { background: linear-gradient(180deg, #00aff0, #0078d4); color: #fff; }
    .msn-toast.theme-skype .msn-toast__avatar { background: #e6f6ff; border-color: #00aff0; }
    .msn-toast.theme-skype .msn-toast__name { color: #0078d4; }

    /* ---------- Nokia SMS: retro groene LCD-telefoonschermvibe ---------- */
    .msn-toast.theme-nokia { background: #0d1f0d; font-family: 'Courier New', monospace; }
    .msn-toast.theme-nokia .msn-toast__header { background: #08150c; color: #8fce6a; border-bottom: 1px solid #2c4a2c; }
    .msn-toast.theme-nokia .msn-toast__avatar { background: #142814; border-color: #2c4a2c; color: #8fce6a; }
    .msn-toast.theme-nokia .msn-toast__name { color: #8fce6a; }
    .msn-toast.theme-nokia .msn-toast__message { color: #6fae52; }

    /* ---------- BBM (BlackBerry Messenger): zwart/rood ---------- */
    .msn-toast.theme-bbm { background: #1a1a1a; }
    .msn-toast.theme-bbm .msn-toast__header { background: #000; color: #ee2737; border-bottom: 1px solid #ee2737; }
    .msn-toast.theme-bbm .msn-toast__avatar { background: #2a2a2a; border-color: #ee2737; }
    .msn-toast.theme-bbm .msn-toast__name { color: #ee2737; }
    .msn-toast.theme-bbm .msn-toast__message { color: #ddd; }

    /* ---------- Discord zelf: blurple op donker (Discord's eigen dark-thema-kleuren) ---------- */
    .msn-toast.theme-discord { background: #313338; font-family: 'gg sans', 'Inter', system-ui, sans-serif; }
    .msn-toast.theme-discord .msn-toast__header { background: #5865f2; color: #fff; }
    .msn-toast.theme-discord .msn-toast__avatar { background: #404249; border-color: #5865f2; }
    .msn-toast.theme-discord .msn-toast__name { color: #fff; }
    .msn-toast.theme-discord .msn-toast__message { color: #b5bac1; }

    /* ---------- Instagram: het bekende paars-roze-oranje verloop ---------- */
    .msn-toast.theme-instagram .msn-toast__header { background: linear-gradient(90deg, #833ab4, #fd1d1d, #fcb045); color: #fff; }
    .msn-toast.theme-instagram .msn-toast__avatar { background: #fff0f5; border: 2px solid; border-image: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045) 1; }
    .msn-toast.theme-instagram .msn-toast__name { color: #c8228c; }
</style>
</head>
<body>

<div class="msn-toast" id="msn-toast">
    <div class="msn-toast__header">
        <span id="toast-header-icoon">💬</span>
        <span id="toast-header-titel">Nieuw bericht</span>
    </div>
    <div class="msn-toast__body">
        <div class="msn-toast__avatar" id="msn-toast-avatar">
            <img id="msn-toast-avatar-img" alt="" hidden>
            <span id="msn-toast-avatar-fallback">👤</span>
        </div>
        <div class="msn-toast__text">
            <p class="msn-toast__name" id="msn-toast-naam"></p>
            <p class="msn-toast__message" id="msn-toast-bericht"></p>
        </div>
    </div>
</div>
<audio id="msn-audio"></audio>

<script>
    // Leeg = relatief (deze pagina draait dan op de bot's eigen server, api.gwnlarss.nl).
    // De kopie op gwnlarss.nl zelf (Netlify, geen eigen backend) zet dit op de absolute
    // 'https://api.gwnlarss.nl', dat is de enige regel die tussen die twee kopieën verschilt.
    const API_BASE = 'https://api.gwnlarss.nl';

    // Zonder ?kanaal=... in de URL gedraagt dit zich als vanouds: gericht op gwnlarss zelf.
    // Vul je wel ?kanaal=jouwnaam in, dan activeert dit hieronder automatisch dat kanaal bij de
    // bot (die joint het dan zelf, geen handmatige configuratie nodig) en toont alleen nog
    // eerste-chat-meldingen uit dát kanaal.
    const KANAAL = (new URLSearchParams(location.search).get('kanaal') || 'gwnlarss').trim().toLowerCase();

    fetch(`${API_BASE}/api/first-chat/activeer`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kanaal: KANAAL }),
    }).catch(() => {}); // netwerkhikje: de widget blijft gewoon proberen te verbinden hieronder

    let weergaveTijd = 5000;
    let alertVolume = 1;
    let heeftEigenMsnGeluid = false;

    const msnToastEl = document.getElementById('msn-toast');
    const msnNaamEl = document.getElementById('msn-toast-naam');
    const msnBerichtEl = document.getElementById('msn-toast-bericht');
    const msnAudioEl = document.getElementById('msn-audio');
    const msnAvatarImgEl = document.getElementById('msn-toast-avatar-img');
    const msnAvatarFallbackEl = document.getElementById('msn-toast-avatar-fallback');
    const headerIcoonEl = document.getElementById('toast-header-icoon');
    const headerTitelEl = document.getElementById('toast-header-titel');

    // Elk geluidje hieronder is zelf gesynthetiseerd (geen audiobestanden nodig) — gebruikt als
    // fallback zolang er voor 'first_chat' geen eigen geluid geüpload is via alerts-admin.html.
    function speelToon(noten, golfvorm = 'sine', piek = 0.25) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;
            for (const [freq, offset, duur] of noten) {
                const start = now + offset;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = golfvorm;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, start);
                gain.gain.linearRampToValueAtTime(piek * alertVolume, start + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, start + duur);
                osc.connect(gain).connect(ctx.destination);
                osc.start(start);
                osc.stop(start + duur + 0.02);
            }
        } catch { /* Web Audio niet beschikbaar, dan maar geen geluid */ }
    }
    // Klassieke MSN-"ding": opwaarts belletje-arpeggio met een zachte boventoon per noot.
    function speelMsnDing() {
        [1046.50, 1318.51, 1567.98, 2093.00].forEach((freq, i) => {
            speelToon([[freq, i * 0.07, 0.22]], 'sine', 0.28);
            speelToon([[freq * 2, i * 0.07, 0.22]], 'sine', 0.09);
        });
    }
    // AIM: twee korte "bloops" met een blokgolf, wat rauwer/digitaler dan MSN's belletje.
    function speelAimGeluid() {
        speelToon([[600, 0, 0.15], [450, 0.12, 0.15]], 'square', 0.14);
    }
    // ICQ: knipoog naar het beroemde tweetonige "uh-oh"-berichtgeluidje.
    function speelIcqGeluid() {
        speelToon([[880, 0, 0.15], [659.25, 0.18, 0.22]], 'triangle', 0.25);
    }
    // Yahoo! Messenger: helder oplopend drietonig belletje.
    function speelYahooGeluid() {
        speelToon([[523.25, 0, 0.2], [659.25, 0.09, 0.2], [783.99, 0.18, 0.22]], 'sine', 0.22);
    }
    // Windows XP: het klassieke tweetonige systeem-"ding".
    function speelXpGeluid() {
        speelToon([[783.99, 0, 0.4], [1046.50, 0.15, 0.4]], 'sine', 0.2);
    }
    // Skype: een oplopende "swoosh"-achtige tweetoon, iets zachter van timbre dan de rest.
    function speelSkypeGeluid() {
        speelToon([[440, 0, 0.18], [880, 0.1, 0.3]], 'sine', 0.22);
    }
    // Nokia: het bekende korte, hoge "tri-tone"-getik, met een blokgolf voor dat piepBeep-gevoel.
    function speelNokiaGeluid() {
        speelToon([[1500, 0, 0.08], [1500, 0.12, 0.08], [1500, 0.24, 0.08]], 'square', 0.15);
    }
    // BBM: één scherpe, korte "ping".
    function speelBbmGeluid() {
        speelToon([[1800, 0, 0.12]], 'sine', 0.3);
    }
    // Discord: een zachte tweetonige "doot-doot", iets lager en ronder dan de andere geluidjes.
    function speelDiscordGeluid() {
        speelToon([[830.61, 0, 0.15], [622.25, 0.1, 0.2]], 'sine', 0.2);
    }
    // Instagram: een zachte, korte "pop"-bubbel.
    function speelInstagramGeluid() {
        speelToon([[700, 0, 0.1]], 'triangle', 0.2);
    }

    const THEMAS = {
        msn: { klasse: null, icoon: '💬', titel: 'Nieuw bericht', geluid: speelMsnDing },
        aim: { klasse: 'theme-aim', icoon: '🏃', titel: 'IM ontvangen', geluid: speelAimGeluid },
        icq: { klasse: 'theme-icq', icoon: '🌼', titel: 'Nieuw bericht', geluid: speelIcqGeluid },
        yahoo: { klasse: 'theme-yahoo', icoon: '💜', titel: 'Yahoo!-bericht', geluid: speelYahooGeluid },
        xp: { klasse: 'theme-xp', icoon: 'ℹ️', titel: 'Bericht ontvangen', geluid: speelXpGeluid },
        skype: { klasse: 'theme-skype', icoon: '📞', titel: 'Skype-bericht', geluid: speelSkypeGeluid },
        nokia: { klasse: 'theme-nokia', icoon: '📱', titel: 'Nieuw bericht', geluid: speelNokiaGeluid },
        bbm: { klasse: 'theme-bbm', icoon: '📍', titel: 'BBM PING!', geluid: speelBbmGeluid },
        discord: { klasse: 'theme-discord', icoon: '🎮', titel: 'Nieuw bericht', geluid: speelDiscordGeluid },
        instagram: { klasse: 'theme-instagram', icoon: '📸', titel: 'Nieuw DM-bericht', geluid: speelInstagramGeluid },
    };
    const themaKey = (new URLSearchParams(location.search).get('thema') || 'msn').toLowerCase();
    const thema = THEMAS[themaKey] ?? THEMAS.msn;
    if (thema.klasse) msnToastEl.classList.add(thema.klasse);
    headerIcoonEl.textContent = thema.icoon;
    headerTitelEl.textContent = thema.titel;

    // Deze pagina blijft normaal gesproken continu open als OBS browser-source, dus periodiek
    // verversen i.p.v. eenmalig bij laden.
    function ververs() {
        fetch(`${API_BASE}/api/alerts/settings`).then(r => r.json()).then(s => { weergaveTijd = s.first_chat ?? 5000; }).catch(() => {});
        fetch(`${API_BASE}/api/alerts/volume`).then(r => r.json()).then(v => {
            msnAudioEl.volume = v.volume;
            alertVolume = v.volume;
        }).catch(() => {});
        fetch(`${API_BASE}/api/alerts/sounds`).then(r => r.json()).then(s => { heeftEigenMsnGeluid = Boolean(s.first_chat); }).catch(() => {});
    }
    ververs();
    setInterval(ververs, 15000);

    const wachtrij = [];
    let bezig = false;

    function toonVolgende() {
        if (bezig || wachtrij.length === 0) return;
        bezig = true;
        const event = wachtrij.shift();

        msnNaamEl.textContent = event.naam;
        msnBerichtEl.textContent = event.extra?.bericht || '';

        const avatarUrl = event.extra?.avatarUrl;
        if (avatarUrl) {
            msnAvatarImgEl.src = avatarUrl;
            msnAvatarImgEl.hidden = false;
            msnAvatarFallbackEl.hidden = true;
        } else {
            msnAvatarImgEl.hidden = true;
            msnAvatarFallbackEl.hidden = false;
        }

        if (heeftEigenMsnGeluid) {
            msnAudioEl.src = `${API_BASE}/alert-sounds/${event.type}?t=${Date.now()}`;
            msnAudioEl.play().catch(() => thema.geluid());
        } else {
            thema.geluid();
        }

        requestAnimationFrame(() => msnToastEl.classList.add('is-visible'));
        setTimeout(() => {
            msnToastEl.classList.remove('is-visible');
            setTimeout(() => { bezig = false; toonVolgende(); }, 400);
        }, weergaveTijd);
    }

    function verbind() {
        const bron = new EventSource(`${API_BASE}/api/alerts/stream`);
        bron.onmessage = e => {
            const event = JSON.parse(e.data);
            if (event.type !== 'first_chat') return; // andere alert-types negeren, die horen bij alerts.html
            if ((event.extra?.kanaal ?? 'gwnlarss') !== KANAAL) return; // niet voor ons kanaal
            wachtrij.push(event);
            toonVolgende();
        };
        bron.onerror = () => {
            bron.close();
            setTimeout(verbind, 3000);
        };
    }
    verbind();
</script>

</body>
</html>
