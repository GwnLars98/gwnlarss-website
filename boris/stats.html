<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Stream stats · Boris Ferreiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
    /* Stream stats voor Boris Ferreiro (OBS-browserbron, 1920x1080, transparant). Een rustige balk in zijn
       kleuren met zijn logo in het midden: links de laatste volger en sub, rechts de laatste gifter en bits
       (en de laatste donatie zodra StreamElements aan staat). Elke tegel: een klein label en de naam, met
       eventueel een gouden labeltje (x50, 1.000 bits). Werkt live mee met zijn alerts; zet hem in OBS onder
       de alerts-bron. ?plek=boven zet de balk bovenin, ?grootte=0.7 maakt hem kleiner (0.5 t/m 1.2),
       ?voorbeeld toont zijn offline-scherm erachter. */
    :root { --goud: #ffd27a; --label: #f3c48f; --wit: #fff8f2; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: 'Baloo 2', system-ui, sans-serif; }
    #podium { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; }
    body.voorbeeld #podium { background: #222 url('https://static-cdn.jtvnw.net/jtv_user_pictures/81a5a7a9-9ba4-41da-9621-54d3a23eb7bd-channel_offline_image-1920x1080.png') center/cover; }

    /* grootte: de hele balk schaalt vanuit zijn eigen midden onderin (of bovenin bij ?plek=boven) */
    #schaal { position: absolute; inset: 0; transform: scale(var(--schaal, 1)); transform-origin: 50% calc(100% - 36px); }
    body.boven #schaal { transform-origin: 50% 36px; }

    /* drie kolommen: links en rechts even breed, het logo precies in het midden */
    .balk { position: absolute; left: 50%; bottom: 36px; height: 80px; transform: translateX(-50%); display: grid; grid-template-columns: 1fr 120px 1fr; align-items: center;
        padding: 0 6px; box-sizing: border-box; border-radius: 40px; color: var(--wit); white-space: nowrap;
        background: linear-gradient(180deg, rgba(40, 26, 72, 0.96), rgba(70, 34, 94, 0.96));
        box-shadow: 0 12px 34px rgba(16, 4, 26, 0.45);
        animation: binnen 0.8s cubic-bezier(.2, 1.25, .4, 1) both; }
    body.boven .balk { bottom: auto; top: 36px; animation-name: binnenBoven; }
    @keyframes binnen { from { transform: translateX(-50%) translateY(140px); opacity: 0; } }
    @keyframes binnenBoven { from { transform: translateX(-50%) translateY(-140px); opacity: 0; } }
    /* dunne gouden rand */
    .balk::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 2px; pointer-events: none;
        background: linear-gradient(90deg, rgba(201, 112, 42, 0.9), #ffd27a 30%, #f4a54a 50%, #ffd27a 70%, rgba(201, 112, 42, 0.9));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

    .kant { display: flex; align-items: center; height: 100%; }
    .kant.links { justify-content: flex-end; } .kant.rechts { justify-content: flex-start; }

    /* zijn logo in het midden, net boven en onder de balk uit */
    .munt { position: relative; justify-self: center; width: 104px; height: 104px; border-radius: 50%;
        background: url('https://static-cdn.jtvnw.net/jtv_user_pictures/f935070f-68b8-446d-95a4-9885ffbad080-profile_image-300x300.png') center / cover;
        box-shadow: 0 0 0 3px #f4a54a, 0 0 0 5px #ffe3a8, 0 8px 22px rgba(16, 4, 26, 0.5); }
    .munt.puls { animation: puls 0.8s cubic-bezier(.2, 1.6, .4, 1); }
    @keyframes puls { 40% { transform: scale(1.1) rotate(-6deg); } }
    .live { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 800; letter-spacing: 0.12em;
        background: #e0475a; color: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); display: none; }
    .munt.aan .live { display: block; }

    /* tegels: even breed, gecentreerd, twee regels; korte zachte scheidingslijn ertussen */
    .tegel { position: relative; width: 280px; height: 56px; padding: 0 18px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    .tegel[hidden] { display: none; }   /* anders wint display: flex van het hidden-attribuut */
    .tegel:not([hidden]) ~ .tegel::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 1px; background: rgba(255, 220, 170, 0.22); }
    .label { font-size: 11.5px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: var(--label); line-height: 1.4; }
    .regel { display: flex; align-items: center; justify-content: center; gap: 8px; max-width: 100%; min-width: 0; }
    .naam { font-size: 26px; font-weight: 800; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .badge { flex-shrink: 0; font-size: 13px; font-weight: 800; color: #2c1236; background: var(--goud); padding: 1px 8px 0; border-radius: 99px; line-height: 1.5; }
    .badge:empty { display: none; }
    .leeg .naam { color: rgba(255, 248, 242, 0.38); font-size: 20px; font-weight: 600; }
    /* nieuw: naam springt erin, zachte gouden veeg over de tegel */
    .tegel.nieuw .regel { animation: erin 0.6s cubic-bezier(.2, 1.5, .4, 1); }
    .tegel.nieuw .naam { color: var(--goud); transition: color 2.5s 1.5s; }
    .tegel.nieuw::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 25%, rgba(255, 226, 160, 0.35) 50%, transparent 75%); animation: veeg 1.1s ease-out forwards; }
    @keyframes erin { from { transform: translateY(22px); opacity: 0; } }
    @keyframes veeg { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
</style>
</head>
<body>
<div id="podium"><div id="schaal">
    <div class="balk">
        <div class="kant links">
            <div class="tegel leeg" id="t-donatie" hidden><div class="label">Laatste donatie</div><div class="regel"><span class="naam">Nog niemand</span><span class="badge"></span></div></div>
            <div class="tegel leeg" id="t-volger"><div class="label">Laatste volger</div><div class="regel"><span class="naam">Nog niemand</span><span class="badge"></span></div></div>
            <div class="tegel leeg" id="t-sub"><div class="label">Laatste sub</div><div class="regel"><span class="naam">Nog niemand</span><span class="badge"></span></div></div>
        </div>
        <div class="munt" id="munt"><div class="live">LIVE</div></div>
        <div class="kant rechts">
            <div class="tegel leeg" id="t-gift"><div class="label">Laatste gifter</div><div class="regel"><span class="naam">Nog niemand</span><span class="badge"></span></div></div>
            <div class="tegel leeg" id="t-bits"><div class="label">Laatste bits</div><div class="regel"><span class="naam">Nog niemand</span><span class="badge"></span></div></div>
        </div>
    </div>
</div></div>
<script>
    const LOGIN = 'borisferreiro';
    const API = 'https://api.gwnlarss.nl/api/streamer-alerts/' + LOGIN;
    const zoek = new URLSearchParams(location.search);
    if (zoek.has('voorbeeld')) document.body.classList.add('voorbeeld');
    if (zoek.get('plek') === 'boven') document.body.classList.add('boven');
    document.documentElement.style.setProperty('--schaal', Math.min(1.2, Math.max(0.5, Number(zoek.get('grootte')) || 1)));
    const $ = id => document.getElementById(id);
    const getal = n => Number(n ?? 0).toLocaleString('nl-NL');
    const geld = (b, v) => { try { return new Intl.NumberFormat('nl-NL', { style: 'currency', currency: v || 'EUR' }).format(b ?? 0); } catch { return `${b} ${v ?? ''}`; } };

    // podium passend in elk venster (in OBS op 1920x1080 precies 1 op 1)
    function pasPodiumAan() {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        $('podium').style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
    }
    addEventListener('resize', pasPodiumAan); pasPodiumAan();

    function zet(id, naam, badge, nieuw) {
        const t = $(id), n = t.querySelector('.naam'), b = t.querySelector('.badge');
        if (!naam) { t.classList.add('leeg'); n.textContent = 'Nog niemand'; b.textContent = ''; return; }
        if (!nieuw && n.textContent === naam && b.textContent === (badge ?? '')) return;
        t.classList.remove('leeg'); n.textContent = naam; b.textContent = badge ?? '';
        if (nieuw) {
            t.classList.remove('nieuw'); void t.offsetWidth; t.classList.add('nieuw'); setTimeout(() => t.classList.remove('nieuw'), 4500);
            const m = $('munt'); m.classList.remove('puls'); void m.offsetWidth; m.classList.add('puls');
        }
    }
    // het gouden labeltje naast de naam (alleen waar het iets toevoegt)
    const badgeVoor = e => ({
        subscriber: (e.tier ?? 1) > 1 ? `Tier ${e.tier}` : '',
        resub: `${e.maanden ?? 1} mnd`,
        gift: `×${getal(e.aantal ?? 1)}`,
        cheer: getal(e.bits),
        donatie: geld(e.bedrag, e.valuta),
    })[e.soort] ?? '';
    const TEGEL = { follower: 't-volger', subscriber: 't-sub', resub: 't-sub', gift: 't-gift', cheer: 't-bits', donatie: 't-donatie' };

    function toon(s) {
        const L = s.laatste ?? {};
        $('t-donatie').hidden = !s.donaties && !L.donatie;
        zet('t-volger', L.follower?.naam, '', false);
        const sub = ['subscriber', 'resub'].map(k => L[k] && { soort: k, ...L[k] }).filter(Boolean).sort((a, b) => b.op - a.op)[0];
        zet('t-sub', sub?.naam, sub ? badgeVoor(sub) : '', false);
        zet('t-gift', L.gift?.naam, L.gift ? badgeVoor({ soort: 'gift', ...L.gift }) : '', false);
        zet('t-bits', L.cheer?.naam, L.cheer ? badgeVoor({ soort: 'cheer', ...L.cheer }) : '', false);
        zet('t-donatie', L.donatie?.naam, L.donatie ? badgeVoor({ soort: 'donatie', ...L.donatie }) : '', false);
        $('munt').classList.toggle('aan', Boolean(s.live));
    }
    const haal = () => fetch(API + '/stats', { cache: 'no-store' }).then(r => r.json()).then(s => s && toon(s)).catch(() => {});
    haal(); setInterval(haal, 60000);

    // live mee met de alerts (ook testalerts: die laten we even zien, de server bewaart ze niet)
    function verbind() {
        const bron = new EventSource(API + '/stream?bron=' + (zoek.has('voorbeeld') ? 'voorbeeld' : 'stats'));   // bron: voor de status op api.gwnlarss.nl
        bron.onmessage = m => {
            let e; try { e = JSON.parse(m.data); } catch { return; }
            const id = TEGEL[e?.soort];
            if (!id) return;   // raids, instellingen en onbekende soorten staan niet in de balk
            if (id === 't-donatie') $('t-donatie').hidden = false;
            zet(id, e.naam, badgeVoor({ soort: e.soort, ...e.extra }), true);
            if (!e.extra?.test) setTimeout(haal, 3000);   // echte alert: daarna gelijk trekken met de server
        };
        bron.onerror = () => { bron.close(); setTimeout(verbind, 3000); };
    }
    verbind();
</script>
</body>
</html>
