<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Sub-scherm, MrAardappel</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
    /* Fullscreen sub-scherm voor MrAardappel (browserbron 1920x1080, bijvoorbeeld op een scherm achter hem in beeld):
       in rust zijn totaal aantal subs en de laatste sub, groot en met veel contrast; elke nieuwe alert (volger, sub,
       resub, gift, bits, raid, donatie) neemt het hele scherm over. Gegevens via zijn eigen koppeling
       (api.gwnlarss.nl/api/streamer-alerts/mraardappel). Eigen aardappelstijl: goud, aardebruin en loofgroen, plat.
       Kleuren zijn zelf te kiezen op de instelpagina (achtergrond, hoofdkleur, tweede kleur, schaduw), live via de stream.
       ?demo = nep-alerts om te kijken hoe het eruitziet (raakt niets live). */
    :root { --aarde: #1f150c; --goud: #f4c542; --bruin: #8a5a2b; --groen: #4caf50; --donker: #1f150c; --opHoofd: #1f150c; --opTweede: #1f150c; }   /* eigen kleuren overschrijven deze (zetKleuren) */
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--aarde); font-family: 'Inter', system-ui, sans-serif; color: #fff; }
    #podium { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
    /* achtergrond: platte aardappels (ovale vlekken met oogjes) in de hoeken */
    .pieper { position: absolute; background: var(--bruin); border-radius: 50% 46% 52% 48% / 58% 52% 48% 42%; }
    .pieper::before, .pieper::after { content: ''; position: absolute; width: 9%; height: 7%; border-radius: 50%; background: rgba(0,0,0,0.22); }
    .pieper::before { left: 28%; top: 30%; } .pieper::after { left: 62%; top: 58%; }
    /* met zijn emote mraardPOTATO: het plaatje zelf in plaats van de getekende vlek */
    .pieper.emote { background: var(--emote) center / contain no-repeat; border-radius: 0; }
    .pieper.emote::before, .pieper.emote::after { display: none; }
    .p1.emote { width: 520px; height: 520px; left: -150px; top: -170px; } .p2.emote { width: 480px; height: 480px; right: -130px; bottom: -150px; } .p3.emote { width: 230px; height: 230px; filter: none; }
    #aIco img { width: 76%; height: 76%; object-fit: contain; }
    .p1 { width: 620px; height: 440px; left: -220px; top: -150px; transform: rotate(-18deg); }
    .p2 { width: 560px; height: 400px; right: -200px; bottom: -150px; transform: rotate(14deg); }
    .p3 { width: 260px; height: 190px; right: 120px; top: 70px; transform: rotate(30deg); filter: brightness(0.8); }
    .loof { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: var(--groen); }

    /* ---------- in rust: het getal ---------- */
    #rust { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: opacity 0.35s; }
    #rust .label { font: 800 120px/1 'Baloo 2', sans-serif; letter-spacing: 0.2em; margin-right: -0.2em; color: var(--goud); }
    #getal { font: 800 560px/0.86 'Baloo 2', sans-serif; letter-spacing: -0.02em; text-shadow: 18px 18px 0 var(--bruin); display: inline-block; }
    #getal.pop { animation: pop 0.8s cubic-bezier(.2,1.6,.4,1); }
    @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.12); color: var(--goud); } 100% { transform: scale(1); } }
    #laatste { margin-top: 40px; display: flex; align-items: center; gap: 30px; padding: 18px 44px; background: var(--goud); color: var(--opHoofd); border-radius: 28px; box-shadow: 12px 12px 0 var(--groen); max-width: 1600px; }
    #laatste small { font: 800 56px 'Baloo 2', sans-serif; opacity: 0.7; white-space: nowrap; }
    #laatste b { font: 800 100px/1.05 'Baloo 2', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ---------- een alert: neemt het hele scherm over ---------- */
    #alert { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: var(--goud); color: var(--opHoofd);
        clip-path: circle(0% at 50% 50%); transition: clip-path 0.6s cubic-bezier(.6,0,.2,1); }
    #alert.groen { background: var(--groen); color: var(--opTweede); }
    #alert.aan { clip-path: circle(80% at 50% 50%); }
    #aIco { width: 260px; height: 260px; border-radius: 60px; background: #fff; display: grid; place-items: center; font-size: 170px; box-shadow: 14px 14px 0 rgba(0,0,0,0.22); }
    #alert.aan #aIco { animation: stuiter 0.9s 0.25s cubic-bezier(.2,1.8,.4,1) both; }
    @keyframes stuiter { from { transform: scale(0.3) rotate(-12deg); } to { transform: none; } }
    #aSoort { margin-top: 36px; font: 800 130px/1 'Baloo 2', sans-serif; letter-spacing: 0.06em; }
    #aNaam { margin-top: 10px; font: 800 230px/1 'Baloo 2', sans-serif; max-width: 1800px; white-space: nowrap; color: #fff; text-shadow: 14px 14px 0 var(--donker); }
    #aExtra { margin-top: 26px; font: 700 80px 'Inter', sans-serif; max-width: 1800px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="podium">
    <div class="pieper p1"></div><div class="pieper p2"></div><div class="pieper p3"></div><div class="loof"></div>
    <div id="rust">
        <div class="label">SUBS</div>
        <div id="getal">0</div>
        <div id="laatste"><small>LAATSTE SUB</small><b id="laatsteNaam">-</b></div>
    </div>
    <div id="alert"><div id="aIco"></div><div id="aSoort"></div><div id="aNaam"></div><div id="aExtra"></div></div>
</div>
<script>
    const API = 'https://api.gwnlarss.nl/api/streamer-alerts/mraardappel';
    const Q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
    function pasAan() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); $('podium').style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`; }
    addEventListener('resize', pasAan); pasAan();
    // ---------- eigen kleuren (instelpagina, op de server bewaard; komen live binnen) ----------
    const STANDAARD_KLEUREN = { achtergrond: '#1f150c', hoofd: '#f4c542', tweede: '#4caf50', schaduw: '#8a5a2b' };
    const licht = hex => { const n = parseInt(hex.slice(1), 16), [r, g, b] = [n >> 16, (n >> 8) & 255, n & 255]; return (0.299 * r + 0.587 * g + 0.114 * b) > 150; };
    function zetKleuren(k = {}) {
        const c = { ...STANDAARD_KLEUREN, ...k }, st = document.documentElement.style;
        st.setProperty('--aarde', c.achtergrond); st.setProperty('--goud', c.hoofd); st.setProperty('--groen', c.tweede); st.setProperty('--bruin', c.schaduw);
        st.setProperty('--opHoofd', licht(c.hoofd) ? '#1f150c' : '#ffffff'); st.setProperty('--opTweede', licht(c.tweede) ? '#1f150c' : '#ffffff');   // tekst altijd leesbaar
    }
    // het voorbeeld op de instelpagina stuurt kleuren door terwijl je kiest
    addEventListener('message', e => { if (e.origin === location.origin && e.data?.kleuren !== undefined) zetKleuren(e.data.kleuren || {}); });
    // ---------- zijn eigen emotes: mraardPOTATO als aardappels, en per alert een eigen emote als icoon; lukt het niet, dan blijft het tekentje ----------
    const EMOTES = {};
    fetch(API + '/emotes').then(r => r.json()).then(d => {
        for (const e of d.emotes ?? []) EMOTES[e.naam] = e.url;
        if (!EMOTES.mraardPOTATO) return;
        const img = new Image();
        img.onload = () => { document.documentElement.style.setProperty('--emote', `url("${EMOTES.mraardPOTATO}")`); document.querySelectorAll('.pieper').forEach(p => p.classList.add('emote')); };
        img.src = EMOTES.mraardPOTATO;
    }).catch(() => { });
    function pasIn(el, max, breed) { let g = max; el.style.fontSize = g + 'px'; while (el.scrollWidth > breed && g > 60) { g -= 8; el.style.fontSize = g + 'px'; } }   // lange namen kleiner

    // ---------- het getal: telt soepel op naar de nieuwe stand ----------
    let stand = null, getoond = 0, animatie = 0;
    function zetStand(n, pop = false) {
        if (n == null || !Number.isFinite(n)) return;
        const van = getoond, start = performance.now(), mijn = ++animatie;   // een nieuwe stand stopt de vorige animatie
        stand = n;
        if (pop) { $('getal').classList.remove('pop'); void $('getal').offsetWidth; $('getal').classList.add('pop'); }
        (function stap() {
            if (mijn !== animatie) return;
            const f = Math.min(1, (performance.now() - start) / 900), w = Math.round(van + (n - van) * (1 - Math.pow(1 - f, 3)));
            getoond = w; $('getal').textContent = w.toLocaleString('nl-NL');
            if (f < 1) requestAnimationFrame(stap);
        })();
    }
    function zetLaatste(naam) { $('laatsteNaam').textContent = naam; pasIn($('laatsteNaam'), 100, 1150); }
    // totaal en laatste sub uit zijn stream stats (het totaal ververst de server elke minuut bij Twitch)
    async function haalStats() {
        try {
            const d = await (await fetch(API + '/stats', { cache: 'no-store' })).json();
            if (d.totaal?.subs != null && (stand == null || d.totaal.subs >= stand)) zetStand(d.totaal.subs);
            const l = [d.laatste?.subscriber, d.laatste?.resub].filter(Boolean).sort((a, b) => b.op - a.op)[0];
            if (l && $('laatsteNaam').textContent === '-') zetLaatste(l.naam);
        } catch { }
    }

    // ---------- alerts: één tegelijk, in de rij, elk 7 seconden het hele scherm ----------
    const SOORT = {
        follower: e => ({ ico: '🥔', emote: 'mraardPOTATO', soort: 'NIEUWE VOLGER', extra: 'welkom bij de pieperclub!' }),
        subscriber: e => ({ ico: '⭐', emote: 'mraardHYPE', soort: 'NIEUWE SUB', extra: `Tier ${e.extra?.tier ?? 1}`, groen: true, subs: 1, laatste: true }),
        resub: e => ({ ico: '🔁', emote: 'mraardLOVE', soort: 'RESUB', extra: `${e.extra?.maanden ?? '?'} maanden!`, groen: true, laatste: true }),
        gift: e => ({ ico: '🎁', emote: 'mraardGIFT', soort: 'GIFTED SUBS', extra: `${e.extra?.aantal ?? 1}× sub weggegeven!`, groen: true, subs: e.extra?.aantal ?? 1 }),
        cheer: e => ({ ico: '💎', emote: 'mraardBIGWIN', soort: 'BITS', extra: `${e.extra?.bits ?? ''} bits!` }),
        raid: e => ({ ico: '🚀', emote: 'mraardRAVE', soort: 'RAID', extra: `met ${e.extra?.kijkers ?? '?'} kijkers!` }),
        donatie: e => ({ ico: '💶', emote: 'mraardPOG', soort: 'DONATIE', extra: `${e.extra?.bedrag ?? ''} ${e.extra?.valuta ?? ''}`.trim(), groen: true }),
    };
    const rij = [];
    let bezig = false;
    function ontvang(e) {
        const maak = SOORT[e.soort];
        if (!maak) return;   // instellingen e.d. horen hier niet
        rij.push({ ...maak(e), naam: e.naam || 'Iemand', test: e.extra?.test });
        if (!bezig) volgende();
    }
    function volgende() {
        const a = rij.shift();
        if (!a) { bezig = false; return; }
        bezig = true;
        $('aIco').textContent = a.ico; if (a.emote && EMOTES[a.emote]) { const img = new Image(); img.src = EMOTES[a.emote]; img.alt = a.emote; $('aIco').replaceChildren(img); } $('aSoort').textContent = a.soort; $('aNaam').textContent = a.naam; $('aExtra').textContent = a.extra;
        pasIn($('aNaam'), 230, 1780);
        $('alert').className = a.groen ? 'groen' : '';
        void $('alert').offsetWidth; $('alert').classList.add('aan');
        $('rust').style.opacity = 0;
        setTimeout(() => {
            $('alert').classList.remove('aan'); $('rust').style.opacity = 1;
            // een test telt niet mee; echte subs en gifts tellen zichtbaar op als het scherm terugkomt
            if (!a.test || Q.has('demo')) {
                if (a.subs) { zetStand((stand ?? 0) + a.subs, true); setTimeout(haalStats, 65000); }
                if (a.laatste) zetLaatste(a.naam);
            }
            setTimeout(volgende, 1200);
        }, 7000);
    }

    if (Q.has('demo')) {
        zetStand(64); zetLaatste('Friethoofd');
        const voorbeelden = [{ soort: 'subscriber', naam: 'Kroketje', extra: { tier: 1 } }, { soort: 'follower', naam: 'Pieper123' }, { soort: 'cheer', naam: 'BitsBintje', extra: { bits: 500 } },
            { soort: 'gift', naam: 'DeGulleAardappelboer', extra: { aantal: 5 } }, { soort: 'resub', naam: 'Stamppot', extra: { maanden: 12 } }, { soort: 'raid', naam: 'GwnLarss', extra: { kijkers: 42 } }];
        let i = 0; setTimeout(() => ontvang(voorbeelden[i++]), 2500); setInterval(() => ontvang(voorbeelden[i++ % voorbeelden.length]), 11000);
    } else {
        haalStats(); setInterval(haalStats, 60000);
        fetch(API, { cache: 'no-store' }).then(r => r.json()).then(d => zetKleuren(d?.instellingen?.kleuren)).catch(() => { });
        (function verbind() {
            const bron = new EventSource(API + '/stream?bron=alerts');
            bron.onmessage = m => { let e; try { e = JSON.parse(m.data); } catch { return; } if (e.soort === '_instellingen') return zetKleuren(e.instellingen?.kleuren); ontvang(e); };
            bron.onerror = () => { bron.close(); setTimeout(verbind, 3000); };
        })();
    }
    document.fonts.ready.then(() => { if ($('laatsteNaam').textContent !== '-') pasIn($('laatsteNaam'), 100, 1150); });
</script>
</body>
</html>
