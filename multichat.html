<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Multichat</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
    /* Multichat: Twitch, Kick, YouTube en TikTok in één chat. multichat.html?id=<id> is de OBS-overlay (doorzichtig),
       met &pagina=1 een gewone chatpagina met achtergrond en de status per platform. Stijl, grootte en andere keuzes
       komen van de server (opslaan op multichat-setup.html) en worden live overgenomen. ?demo=1 toont voorbeeldberichten.
       Data: api.gwnlarss.nl/api/multichat/<id>/stream (utils/multichat.js). Nog niet openbaar gelinkt. */
    :root { --g: 1; --twitch: #a970ff; --kick: #53fc18; --youtube: #ff3b3b; --tiktok: #ff2f6e; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; color: #fff; }
    body.pagina { background: #0d0b14; }
    #lijst { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: calc(8px * var(--g)); padding: calc(14px * var(--g)); max-height: 100%; }
    body.pagina #lijst { top: 54px; padding: 16px max(16px, calc(50% - 420px)); }
    .bericht { display: flex; align-items: flex-start; gap: calc(10px * var(--g)); font-size: calc(18px * var(--g)); line-height: 1.4; animation: in 0.35s cubic-bezier(.2, .9, .3, 1); overflow-wrap: anywhere; }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } }
    .bericht.weg { animation: uit 0.6s ease forwards; }
    @keyframes uit { to { opacity: 0; transform: translateX(-20px); } }
    .ikoon { flex: 0 0 auto; width: calc(22px * var(--g)); height: calc(22px * var(--g)); margin-top: calc(2px * var(--g)); border-radius: 6px; display: grid; place-items: center; }
    .ikoon svg { width: 72%; height: 72%; }
    body.zonder-bron .ikoon { display: none; }
    .avatar { flex: 0 0 auto; width: calc(26px * var(--g)); height: calc(26px * var(--g)); border-radius: 50%; object-fit: cover; background: #2a2635; }
    body.zonder-avatars .avatar { display: none; }
    .tekst { min-width: 0; }
    .naam { font-weight: 800; margin-right: 6px; }
    /* badges vóór de naam: plaatjes (Twitch, Kick-sub, YouTube-lid) of eigen tekentjes voor moderator, vip, streamer, ... */
    .badge { height: calc(18px * var(--g)); width: auto; vertical-align: middle; margin: -3px 4px 0 0; border-radius: 3px; }
    .badge.eigen { display: inline-grid; place-items: center; width: calc(18px * var(--g)); background: var(--b, #6b6478); }
    .badge.eigen svg { width: 78%; height: 78%; fill: #fff; }
    body.bubbels .badge { margin-right: 3px; }
    .emote { height: calc(28px * var(--g)); vertical-align: middle; margin: -4px 1px 0; }
    /* platformkleur voor het icoon */
    .twitch .ikoon { background: var(--twitch); } .kick .ikoon { background: var(--kick); } .youtube .ikoon { background: var(--youtube); } .tiktok .ikoon { background: #111; box-shadow: inset 0 0 0 2px var(--tiktok); }
    .kick .ikoon svg { fill: #0b0b0b; } .twitch .ikoon svg, .youtube .ikoon svg, .tiktok .ikoon svg { fill: #fff; }

    /* ---------- stijl strak: nette donkere regels ---------- */
    body.strak .bericht { background: rgba(14, 12, 22, 0.82); padding: calc(8px * var(--g)) calc(12px * var(--g)); border-radius: 12px; border-left: 3px solid var(--rand, #888); }
    body.strak .twitch { --rand: var(--twitch); } body.strak .kick { --rand: var(--kick); } body.strak .youtube { --rand: var(--youtube); } body.strak .tiktok { --rand: var(--tiktok); }
    /* ---------- stijl bubbels: chatballonnen met de naam erboven ---------- */
    body.bubbels .tekst { background: rgba(255, 255, 255, 0.94); color: #15121d; padding: calc(7px * var(--g)) calc(13px * var(--g)); border-radius: 4px 18px 18px 18px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3); }
    body.bubbels .naam { font-size: 0.8em; margin: 0 0 2px; }
    body.bubbels .naam::after { content: ''; display: block; }
    body.bubbels .twitch .naam { color: #7c3aed; } body.bubbels .kick .naam { color: #16a34a; } body.bubbels .youtube .naam { color: #dc2626; } body.bubbels .tiktok .naam { color: #db2777; }
    /* ---------- stijl minimaal: alleen tekst met schaduw ---------- */
    body.minimaal .bericht { text-shadow: 0 1px 2px #000, 0 0 8px rgba(0, 0, 0, 0.85); }

    /* statusbalk op de chatpagina */
    .balk { display: none; position: fixed; left: 0; right: 0; top: 0; height: 54px; align-items: center; gap: 10px; padding: 0 16px; background: #15121e; border-bottom: 1px solid #2a2535; font-size: 14px; font-weight: 700; }
    body.pagina .balk { display: flex; }
    .balk b { font-size: 16px; margin-right: auto; }
    .pil { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #221d2e; color: #b9b2c9; }
    .pil i { width: 8px; height: 8px; border-radius: 50%; background: #6b6478; }
    .pil.verbonden i { background: #39d98a; box-shadow: 0 0 8px #39d98a; } .pil.offline i { background: #6b6478; } .pil.verbinden i { background: #ffb02e; }
    .pil.fout i, .pil.onbereikbaar i { background: #ff4d6d; }
    .melding { position: fixed; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); max-width: 560px; margin: 0 auto; padding: 16px 20px; border-radius: 14px; background: rgba(16, 9, 32, 0.92); box-shadow: 0 0 0 2px #9146ff; text-align: center; line-height: 1.5; }
    .melding[hidden] { display: none; }
</style>
</head>
<body class="strak">
<div class="balk" id="balk"><b>Multichat</b></div>
<div id="lijst"></div>
<div class="melding" id="melding" hidden></div>
<script>
(() => {
    const API = 'https://api.gwnlarss.nl/api/multichat/';
    const q = new URLSearchParams(location.search);
    const ID = (q.get('id') || '').replace(/[^\w-]/g, ''), DEMO = q.get('demo') === '1', PAGINA = q.get('pagina') === '1';
    if (PAGINA) document.body.classList.add('pagina');
    const lijst = document.getElementById('lijst'), melding = t => { const m = document.getElementById('melding'); m.hidden = !t; m.textContent = t || ''; };
    const NAMEN = { twitch: 'Twitch', kick: 'Kick', youtube: 'YouTube', tiktok: 'TikTok' };
    // eenvoudige platformtekentjes (herkenbaar, geen officiële logo-bestanden)
    const ICOON = {
        twitch: '<svg viewBox="0 0 24 24"><path d="M5 3 3 7v12h5v3h3l3-3h4l4-4V3H5zm15 11-3 3h-4l-3 3v-3H6V5h14v9zM15 8h2v5h-2V8zm-5 0h2v5h-2V8z"/></svg>',
        kick: '<svg viewBox="0 0 24 24"><path d="M4 3h6v6h2V7h2V5h2V3h6v6h-2v2h-2v2h2v2h2v6h-6v-2h-2v-2h-2v-2h-2v6H4z"/></svg>',
        youtube: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
        tiktok: '<svg viewBox="0 0 24 24"><path d="M14 3h3c.3 2.2 1.6 3.7 4 4v3c-1.5 0-2.9-.4-4-1.2V15a6 6 0 1 1-6-6v3.2A2.8 2.8 0 1 0 14 15V3z"/></svg>',
    };
    // tekentjes voor badges zonder plaatje (Kick en YouTube sturen bij deze alleen de soort mee)
    const BADGE = {
        broadcaster: ['#e91916', '<svg viewBox="0 0 24 24"><path d="M3 18h18l-1.5-10-5 4L12 5l-2.5 7-5-4z"/></svg>'],
        moderator: ['#00ad03', '<svg viewBox="0 0 24 24"><path d="M14.5 3 21 9.5 12 18.5l-1.5-1.5L6 21.5 2.5 18 7 13.5 5.5 12z"/></svg>'],
        vip: ['#e005b9', '<svg viewBox="0 0 24 24"><path d="M3 9 7 4h10l4 5-9 11z"/></svg>'],
        og: ['#b38b00', '<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.4 6-5.5-3.2-5.5 3.2 1.4-6L3.3 9.2l6.1-.6z"/></svg>'],
        founder: ['#2f6bff', '<svg viewBox="0 0 24 24"><path d="M6 3h12v12l-6 6-6-6z"/></svg>'],
        verified: ['#3a9bff', '<svg viewBox="0 0 24 24"><path d="M9.5 16.5 5 12l1.5-1.5 3 3 8-8L19 7z"/></svg>'],
        subscriber: ['#8e5cff', '<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.4 6-5.5-3.2-5.5 3.2 1.4-6L3.3 9.2l6.1-.6z"/></svg>'],
        sub_gifter: ['#ff7a00', '<svg viewBox="0 0 24 24"><path d="M3 8h18v4H3zM5 12h14v9H5zM11 8h2v13h-2z"/></svg>'],
    };
    let instellingen = { stijl: 'strak', bron: true, avatars: true, verdwijnen: 0, grootte: 1 };
    function pasToe(i) {
        instellingen = { ...instellingen, ...i };
        // ?stijl= en ?grootte= in de link gaan voor (voorbeelden op de instelpagina)
        const stijl = q.get('stijl') || instellingen.stijl;
        document.body.classList.remove('strak', 'bubbels', 'minimaal'); document.body.classList.add(['strak', 'bubbels', 'minimaal'].includes(stijl) ? stijl : 'strak');
        document.body.classList.toggle('zonder-bron', !instellingen.bron);
        document.body.classList.toggle('zonder-avatars', !instellingen.avatars);
        document.documentElement.style.setProperty('--g', +(q.get('grootte') || instellingen.grootte) || 1);
    }
    pasToe({});
    function toon(b) {
        const el = document.createElement('div');
        el.className = 'bericht ' + b.platform;
        const ik = document.createElement('span'); ik.className = 'ikoon'; ik.title = NAMEN[b.platform] || ''; ik.innerHTML = ICOON[b.platform] || '';
        el.append(ik);
        if (b.avatar) { const a = document.createElement('img'); a.className = 'avatar'; a.src = b.avatar; a.alt = ''; a.referrerPolicy = 'no-referrer'; el.append(a); }
        const t = document.createElement('div'); t.className = 'tekst';
        for (const bd of b.badges || []) {
            if (typeof bd === 'string') { const img = document.createElement('img'); img.className = 'badge'; img.src = bd; img.alt = ''; img.referrerPolicy = 'no-referrer'; t.append(img); }
            else if (BADGE[bd.soort]) { const sp = document.createElement('span'); sp.className = 'badge eigen'; sp.title = bd.tekst || bd.soort; sp.style.setProperty('--b', BADGE[bd.soort][0]); sp.innerHTML = BADGE[bd.soort][1]; t.append(sp); }
        }
        const n = document.createElement('span'); n.className = 'naam'; n.textContent = b.naam;
        if (b.kleur && document.body.classList.contains('bubbels') === false) n.style.color = b.kleur;
        t.append(n);
        for (const d of b.delen || []) {
            if (d.emote) { const img = document.createElement('img'); img.className = 'emote'; img.src = d.emote; img.alt = d.naam || ''; img.title = d.naam || ''; img.referrerPolicy = 'no-referrer'; t.append(img); }
            else t.append(document.createTextNode(d.tekst));
        }
        el.append(t);
        lijst.append(el);
        // niet eindeloos laten groeien: wat boven uit beeld valt, weghalen
        while (lijst.children.length > 60) lijst.firstChild.remove();
        while (lijst.children.length > 1 && lijst.firstChild.getBoundingClientRect().bottom < 0) lijst.firstChild.remove();
        if (instellingen.verdwijnen > 0 && !PAGINA) setTimeout(() => { el.classList.add('weg'); setTimeout(() => el.remove(), 650); }, instellingen.verdwijnen * 1000);
    }
    function status(s) {
        const balk = document.getElementById('balk');
        balk.querySelectorAll('.pil').forEach(p => p.remove());
        const tekst = { verbonden: 'live', offline: 'offline', verbinden: 'verbinden…', fout: 'kanaal niet gevonden', onbereikbaar: 'niet bereikbaar' };
        for (const [p, st] of Object.entries(s || {})) {
            const pil = document.createElement('span'); pil.className = 'pil ' + st;
            pil.innerHTML = '<i></i>'; pil.append(`${NAMEN[p]}: ${tekst[st] || st}`);
            balk.append(pil);
        }
    }
    window.addEventListener('message', m => { if (m.data?.mcInstellingen) pasToe(m.data.mcInstellingen); if (m.data?.mcBericht) toon(m.data.mcBericht); });

    if (DEMO) {
        const voorbeelden = [
            ['twitch', 'Pixelpiet', '#a970ff', [{ tekst: 'Goeieavond allemaal! ' }, { emote: 'https://static-cdn.jtvnw.net/emoticons/v2/25/default/dark/2.0', naam: 'Kappa' }], [{ soort: 'moderator' }, { soort: 'subscriber' }]],
            ['kick', 'Kickfan_92', '#53fc18', [{ tekst: 'Ik kijk mee via Kick 💚' }], [{ soort: 'og' }]],
            ['youtube', 'Sanne', null, [{ tekst: 'Hoi vanaf YouTube! Leuke stream' }], [{ soort: 'verified' }]],
            ['tiktok', 'tiktok.timo', null, [{ tekst: 'net binnen via TikTok 🔥' }]],
            ['twitch', 'Bramble', '#ff7ac4', [{ tekst: 'wat speel je straks?' }]],
            ['youtube', 'Mo', null, [{ tekst: 'gg!!' }]],
        ];
        let i = 0;
        const volgende = () => { const [platform, naam, kleur, delen, badges] = voorbeelden[i++ % voorbeelden.length]; toon({ platform, naam, kleur, delen, badges }); };
        for (let k = 0; k < 5; k++) volgende();
        setInterval(volgende, 2200);
        status({ twitch: 'verbonden', kick: 'verbonden', youtube: 'verbonden', tiktok: 'offline' });
    } else if (!ID) {
        melding('Geen multichat in de link. Maak er een op gwnlarss.nl/multichat-setup.html.');
    } else {
        fetch(API + ID, { cache: 'no-store' }).then(r => r.json()).then(d => { if (!d.bestaat) melding('Deze multichat bestaat (niet meer).'); else pasToe(d.instellingen); }).catch(() => { });
        (function verbind() {
            const bron = new EventSource(API + ID + '/stream');
            bron.onmessage = m => {
                try {
                    const d = JSON.parse(m.data);
                    if (d.soort === 'bericht') toon(d);
                    else if (d.soort === 'status') status(d.status);
                    else if (d.soort === 'instellingen') { pasToe(d.instellingen); status(d.status); }
                    else if (d.soort === 'weg') melding('Deze multichat is verwijderd.');
                } catch { }
            };
            bron.onerror = () => { bron.close(); setTimeout(verbind, 5000); };
        })();
    }
    document.fonts.ready.then(() => { document.body.dataset.klaar = '1'; });
})();
</script>
</body>
</html>
