<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Now Playing, GwnLarss</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
    /* Spotify "now playing" voor OBS in tien stijlen (waarvan één volledig scherm). Eén vaste link: de stijl en kant komen van de server (opslaan op
       nowplaying-setup.html), ?stijl= in de link gaat daar alleen voor voorbeelden overheen.
       Elke stijl heeft een eigen basismaat en schaalt mee met de browserbron. Schuift in beeld zodra er muziek
       speelt en weer weg bij pauze. ?demo=1 toont een voorbeeldnummer, ?voorbeeld=1 het echte nummer (of het
       voorbeeldnummer als er niets speelt) en blijft altijd in beeld.
       Data: /api/spotify/nu (utils/spotify.js), elke 3 seconden; de voortgang loopt tussendoor lokaal door. */
    /* --paars/--roze zijn de accentkleuren: standaard het GwnLarss-merk, met kleur=hoes die van de albumhoes (vloeiende overgang) */
    @property --paars { syntax: '<color>'; inherits: true; initial-value: #9146ff; }
    @property --roze { syntax: '<color>'; inherits: true; initial-value: #ff3ea5; }
    :root { --paars: #9146ff; --roze: #ff3ea5; --kaart: rgba(18, 9, 38, 0.86); --p: 0; }
    body { transition: --paars 1.2s ease, --roze 1.2s ease; }
    /* wazige gloed van de albumhoes achter de overlay */
    .gloed { position: absolute; background: linear-gradient(135deg, var(--paars), var(--roze)) center / cover no-repeat; filter: blur(34px) saturate(1.5); opacity: 0.55; pointer-events: none; transition: opacity 0.6s; }
    .kaart .gloed { left: 50px; top: 34px; width: 700px; height: 150px; border-radius: 40px; }
    .pil .gloed { left: 30px; top: 24px; width: 560px; height: 62px; border-radius: 999px; opacity: 0.45; }
    .drie .gloed { left: 40px; top: 40px; width: 240px; height: 240px; border-radius: 50%; opacity: 0.6; }
    /* "Hierna": het volgende nummer uit de wachtrij */
    .hierna { font-size: 14px; font-weight: 600; color: #cbb8ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hierna b { color: var(--roze); font-weight: 700; letter-spacing: 1px; margin-right: 6px; transition: color 1.2s; }
    body.geenvolgende .hierna { display: none; }
    .kaart .boven .hierna { margin-left: auto; max-width: 300px; letter-spacing: 0; font-size: 13px; }
    .drie .hierna { margin-top: 10px; width: 440px; font-size: 16px; text-shadow: 0 2px 3px rgba(0, 0, 0, 0.55); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; color: #fff; }
    #podium { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    .blok { display: none; position: relative; width: 100%; height: 100%; }
    body[data-stijl="kaart"] .blok.kaart, body[data-stijl="pil"] .blok.pil,
    body[data-stijl="3d"] .blok.drie, body[data-stijl="aurora"] .blok.aurora,
    body[data-stijl="split"] .blok.split, body[data-stijl="transparant"] .blok.transparant,
    body[data-stijl="schuin"] .blok.schuin, body[data-stijl="volledig"] .blok.volledig,
    body[data-stijl="polaroid"] .blok.polaroid { display: block; }
    /* in- en uitschuiven */
    .schuif { transform: translateX(-120%); opacity: 0; transition: transform 0.75s cubic-bezier(.2, 1.2, .3, 1), opacity 0.5s; }
    body.rechts .schuif { transform: translateX(120%); }
    body.aan .schuif { transform: none; opacity: 1; }
    /* gedeelde stukjes */
    .eq { display: inline-flex; align-items: flex-end; gap: 3px; height: 16px; }
    .eq i { width: 4px; height: 30%; border-radius: 2px; background: linear-gradient(var(--roze), var(--paars)); }
    body.speelt .eq i { animation: eq 0.9s ease-in-out infinite alternate; }
    .eq i:nth-child(2) { animation-delay: -0.3s !important; } .eq i:nth-child(3) { animation-delay: -0.6s !important; } .eq i:nth-child(4) { animation-delay: -0.15s !important; }
    @keyframes eq { 0% { height: 20%; } 100% { height: 100%; } }
    .titelvak { overflow: hidden; white-space: nowrap; -webkit-mask: linear-gradient(90deg, #000 90%, transparent); mask: linear-gradient(90deg, #000 90%, transparent); }
    .titel { display: inline-block; padding-right: 50px; }
    .titel.loopt { animation: loop var(--duur, 12s) linear infinite; }
    @keyframes loop { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(var(--afstand)); } }
    .hoes { background: linear-gradient(135deg, var(--paars), var(--roze)) center / cover no-repeat; }
    .balk { height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
    .vul { height: 100%; width: calc(var(--p) * 100%); border-radius: inherit; background: linear-gradient(90deg, var(--paars), var(--roze)); transition: width 0.3s linear; }
    .draait { animation: draai 2.4s linear infinite; animation-play-state: paused; }
    body.speelt .draait { animation-play-state: running; }
    @keyframes draai { to { transform: rotate(360deg); } }
    /* wazige hoes als achtergrond in de kaart (instelling 'waas'): achter de inhoud, boven de donkere kaartkleur */
    .waas { display: none; position: absolute; inset: -40px; z-index: -1; background: center / cover no-repeat; filter: blur(26px) brightness(0.42) saturate(1.35); pointer-events: none; }
    body.met-waas .waas { display: block; }
    .kaart .doos, .pil .doos, .aurora .doos, .split .doos, .schuin .doos { isolation: isolate; overflow: hidden; }
    /* bewegende hoes (instelling 'beweging'): rustig inzoomen en verschuiven, zoals in een filmpje */
    body.beweeg [data-hoes] { background-size: 135%; animation: kenburns 16s ease-in-out infinite alternate; }
    body.beweeg .draait[data-hoes] { animation: draai 2.4s linear infinite, kenburns 16s ease-in-out infinite alternate; }
    @keyframes kenburns { 0% { background-position: 20% 30%; } 50% { background-position: 70% 45%; } 100% { background-position: 40% 80%; } }

    /* ---------- 1. kaart (800 x 220): hoes, titel, artiest en voortgang ---------- */
    .kaart .doos { z-index: 1; position: absolute; left: 24px; top: 30px; width: 752px; height: 160px; display: flex; align-items: center; gap: 22px;
        padding: 0 26px 0 20px; border-radius: 26px; background: var(--kaart); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45), 0 0 34px rgba(145, 70, 255, 0.35); }
    .kaart .doos::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 3px; pointer-events: none;
        background: linear-gradient(120deg, var(--paars), var(--roze), var(--paars));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
    .kaart .hoesvak { position: relative; flex: 0 0 120px; height: 120px; }
    .kaart .hoes { position: absolute; inset: 0; border-radius: 18px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); }
    .kaart .info { flex: 1; min-width: 0; padding-left: 4px; }
    .kaart .boven { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #d9c8ff; }
    .kaart .titel { font: 800 34px/1.2 'Baloo 2', sans-serif; margin-top: 4px; }
    .kaart .artiest { font-size: 19px; font-weight: 600; color: #cbb8ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kaart .tijden { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; font-weight: 600; color: #b9a6e8; font-variant-numeric: tabular-nums; }
    .kaart .balk { flex: 1; }

    /* ---------- 2. pil (640 x 110) ---------- */
    .pil .doos { z-index: 1; position: absolute; left: 16px; top: 18px; width: 608px; height: 74px; border-radius: 999px; display: flex; align-items: center; gap: 14px;
        padding: 0 26px 0 8px; background: var(--kaart); box-shadow: 0 0 0 2px rgba(145, 70, 255, 0.7), 0 10px 26px rgba(0, 0, 0, 0.45); overflow: hidden; }
    .pil .rond { flex: 0 0 58px; height: 58px; border-radius: 50%; box-shadow: 0 0 0 3px #1a1030, 0 0 0 5px var(--roze); position: relative; }
    .pil .rond::after { content: ''; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: #120a26; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.4); }
    .pil .titelvak { flex: 1; font: 800 24px/1 'Baloo 2', sans-serif; padding-top: 3px; }
    .pil .titel .wie { color: #cbb8ff; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 19px; }
    .pil .lijn { position: absolute; left: 0; bottom: 0; height: 4px; width: calc(var(--p) * 100%); background: linear-gradient(90deg, var(--paars), var(--roze)); }

    /* ---------- 5. 3d (900 x 320) ---------- */
    .drie canvas { position: absolute; left: 0; top: 0; width: 340px; height: 320px; }
    .drie .info { position: absolute; left: 350px; top: 76px; width: 530px; }
    .drie .boven { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: 3px; color: #e3d6ff; }
    .drie .titel { font: 800 48px/1.15 'Baloo 2', sans-serif; margin-top: 2px;
        background: linear-gradient(180deg, #ffffff, #f3e6ff 55%, #c9a2ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    /* schaduw op het vak eromheen: op de tekst zelf tekent Chrome hem rond het hele vak (grijze rechthoek) */
    .drie .titelvak { filter: drop-shadow(0 3px 0 #2a0d52) drop-shadow(0 6px 8px rgba(0, 0, 0, 0.45)); }
    .drie .artiest { font-size: 22px; font-weight: 700; color: #ffb3dc; text-shadow: 0 2px 3px rgba(0, 0, 0, 0.55); }
    .drie .balk { margin-top: 14px; width: 440px; height: 8px; box-shadow: 0 0 14px rgba(255, 62, 165, 0.45); }

    /* ---------- 6. aurora (820 x 200): donkere kaart met bewegend noorderlicht in de kleuren van de hoes ---------- */
    .aurora .doos { position: absolute; left: 20px; top: 20px; width: 780px; height: 160px; border-radius: 24px; overflow: hidden; display: flex; align-items: center; gap: 22px; padding: 0 28px 0 20px;
        background: rgba(6, 8, 18, 0.88); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 18px 40px rgba(0, 0, 0, 0.5); }
    .aurora .licht { position: absolute; width: 360px; height: 360px; border-radius: 50%; filter: blur(70px); opacity: 0.32; pointer-events: none; }
    .aurora .licht.a { background: var(--paars); left: -60px; top: -180px; animation: aurora1 11s ease-in-out infinite alternate; }
    .aurora .licht.b { background: var(--roze); right: -40px; top: -60px; animation: aurora2 13s ease-in-out infinite alternate; }
    .aurora .licht.c { background: color-mix(in srgb, var(--paars) 50%, #22e3d0); left: 260px; top: 60px; width: 300px; height: 220px; opacity: 0.2; animation: aurora1 9s ease-in-out infinite alternate-reverse; }
    @keyframes aurora1 { to { transform: translate(180px, 60px) scale(1.2); } }
    @keyframes aurora2 { to { transform: translate(-220px, -40px) scale(0.85); } }
    .aurora .hoes { position: relative; flex: 0 0 120px; height: 120px; border-radius: 16px; box-shadow: 0 0 30px color-mix(in srgb, var(--paars) 60%, transparent), 0 8px 20px rgba(0, 0, 0, 0.5); }
    .aurora .info { position: relative; flex: 1; min-width: 0; }
    .aurora .boven { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: 3px; color: rgba(255, 255, 255, 0.7); }
    .aurora .titel { font: 800 34px/1.2 'Baloo 2', sans-serif; }
    .aurora .artiest { font-size: 19px; font-weight: 600; color: rgba(255, 255, 255, 0.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .aurora .tijden { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, 0.6); font-variant-numeric: tabular-nums; }
    .aurora .balk { flex: 1; height: 4px; }
    .aurora .vul { box-shadow: 0 0 12px var(--roze); }

    /* ---------- 7. split (760 x 140): hoesje, een gekleurde streep, dan artiest en titel in hoofdletters ---------- */
    .split .doos { position: absolute; left: 20px; top: 20px; width: 720px; height: 100px; display: flex; align-items: stretch; border-radius: 6px; overflow: hidden;
        background: rgba(14, 12, 26, 0.9); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45); }
    .split .blokje { flex: 0 0 100px; box-shadow: 4px 0 0 0 var(--roze); transition: box-shadow 1.2s; }   /* hoesje met een gekleurde streep */
    .split .rechts { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 24px; }
    .split .artiest { font-size: 15px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: rgba(255, 255, 255, 0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .split .titel { font: 800 30px/1.2 'Baloo 2', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; }
    .split .lijn { position: absolute; left: 0; bottom: 0; height: 4px; width: calc(var(--p) * 100%); background: linear-gradient(90deg, var(--paars), var(--roze)); }

    /* ---------- 8. transparant (760 x 160): geen kader, alleen hoes en tekst met schaduw ---------- */
    .transparant .hoes { position: absolute; left: 20px; top: 20px; width: 120px; height: 120px; border-radius: 14px; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55); }
    .transparant .info { position: absolute; left: 162px; top: 30px; width: 580px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 18px rgba(0, 0, 0, 0.5); }
    .transparant .titel { font: 800 38px/1.15 'Baloo 2', sans-serif; }
    .transparant .artiest { font-size: 20px; font-weight: 700; color: var(--roze); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 1.2s; }
    .transparant .balk { margin-top: 12px; width: 360px; height: 4px; background: rgba(255, 255, 255, 0.25); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); }

    /* ---------- 10. schuin (960 x 240) ---------- */
    /* retro poster: de kaart staat een tikje scheef, de hoes is een sticker met omgekrulde hoek die er de andere kant op
       overheen plakt, titel met een verschoven schaduw in de hoeskleur, artiest op een labeltje, strepen in de hoeskleuren */
    .schuin .doos { position: absolute; left: 110px; top: 34px; width: 820px; height: 176px; border-radius: 18px; background: rgba(12, 9, 20, 0.94);
        transform: rotate(-2deg); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); }
    .schuin .tape { position: absolute; right: -30px; top: 18px; width: 230px; height: 26px; transform: rotate(32deg); opacity: 0.9;
        background: repeating-linear-gradient(135deg, var(--roze) 0 14px, var(--paars) 14px 28px); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); }
    .schuin .sticker { position: absolute; left: 22px; top: 16px; width: 208px; height: 208px; padding: 9px; background: #fbf8f2; border-radius: 10px; transform: rotate(5deg); z-index: 2;
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.5), 0 2px 4px rgba(0, 0, 0, 0.3);
        clip-path: polygon(0 0, 100% 0, 100% 84%, 84% 100%, 0 100%); }
    .schuin .sticker .hoes { width: 100%; height: 100%; border-radius: 4px; }
    /* omgekrulde hoek: de achterkant van de sticker */
    .schuin .krul { position: absolute; left: 22px; top: 16px; width: 208px; height: 208px; transform: rotate(5deg); z-index: 3; pointer-events: none; }
    .schuin .krul::after { content: ''; position: absolute; right: 0; bottom: 0; width: 34px; height: 34px; border-radius: 0 0 6px 0;
        background: linear-gradient(135deg, #d9d3c8 0 50%, transparent 50%); box-shadow: -3px -3px 6px rgba(0, 0, 0, 0.25); }
    .schuin .info { position: absolute; left: 150px; top: 18px; right: 70px; }
    .schuin .titel { font: 800 54px/1.12 'Baloo 2', sans-serif; text-transform: uppercase; letter-spacing: 1px; color: #fff; text-shadow: 4px 4px 0 var(--roze); transition: text-shadow 1.2s; }
    .schuin .titelvak { padding: 0 8px 6px 0; }
    .schuin .label { display: inline-block; max-width: 100%; margin-top: 4px; padding: 3px 14px; border-radius: 6px; transform: rotate(-1.5deg);
        background: var(--paars); color: #fff; font-size: 20px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 1.2s; }
    .schuin .tijden { display: flex; align-items: center; gap: 16px; margin-top: 14px; font-size: 16px; font-weight: 800; color: rgba(255, 255, 255, 0.7); font-variant-numeric: tabular-nums; }
    .schuin .balk { flex: 1; height: 10px; border-radius: 3px; }
    .schuin .vul { border-radius: 3px; background: repeating-linear-gradient(135deg, var(--roze) 0 8px, color-mix(in srgb, var(--roze) 70%, #fff) 8px 16px); background-size: 22.6px 22.6px; animation: paal 0.8s linear infinite; animation-play-state: paused; }
    body.speelt .schuin .vul { animation-play-state: running; }
    @keyframes paal { to { background-position: 22.6px 0; } }

    /* ---------- 12. volledig scherm (1920 x 1080): wazige hoes over het hele beeld, grote hoes links, grote tekst rechts ---------- */
    .volledig .vlak { position: absolute; inset: 0; overflow: hidden; background: #08060f; }
    /* klein wazig plaatje (een kwart van het beeld) dat 4x vergroot wordt: zelfde waas als blur(60px) over het hele scherm,
       maar de browser hoeft maar een fractie uit te rekenen */
    .volledig .achter { position: absolute; left: -80px; top: -80px; width: 520px; height: 310px; transform-origin: 0 0; transform: scale(4);
        background: center / cover no-repeat; filter: blur(15px) brightness(0.45) saturate(1.4); will-change: opacity; }
    .volledig .vlak::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 50%, transparent 30%, rgba(0, 0, 0, 0.55) 100%); }
    .volledig .schuif { transform: scale(0.96); }
    body.rechts .volledig .schuif { transform: scale(0.96); }
    body.aan .volledig .schuif { transform: none; }
    .volledig .hoesgroot { position: absolute; left: 190px; top: 240px; width: 600px; height: 600px; border-radius: 34px; z-index: 1;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12), 0 40px 90px rgba(0, 0, 0, 0.6), 0 0 120px color-mix(in srgb, var(--paars) 55%, transparent); transition: box-shadow 1.2s; }
    .volledig .info { position: absolute; left: 880px; top: 330px; width: 880px; z-index: 1; }
    .volledig .eq { height: 34px; gap: 6px; } .volledig .eq i { width: 8px; border-radius: 4px; }
    .volledig .titel { font: 800 104px/1.08 'Baloo 2', sans-serif; margin-top: 14px; text-shadow: 0 6px 24px rgba(0, 0, 0, 0.45); }
    .volledig .artiest { font-size: 44px; font-weight: 700; color: color-mix(in srgb, var(--roze) 55%, #fff); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 1.2s; }
    .volledig .tijden { display: flex; align-items: center; gap: 26px; margin-top: 44px; font-size: 28px; font-weight: 700; color: rgba(255, 255, 255, 0.75); font-variant-numeric: tabular-nums; }
    .volledig .balk { flex: 1; height: 12px; } .volledig .vul { box-shadow: 0 0 18px var(--roze); }
    .volledig .hierna { margin-top: 40px; font-size: 26px; color: rgba(255, 255, 255, 0.72); }
    .volledig .hierna b { font-size: 22px; letter-spacing: 3px; }

    /* ---------- 14. polaroid (760 x 300): hoes als scheve polaroid met plakband, titel in handschrift ---------- */
    .polaroid .foto { position: absolute; left: 34px; top: 28px; width: 210px; height: 244px; padding: 12px 12px 0; background: #f7f4ee; transform: rotate(-5deg);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45), 0 2px 4px rgba(0, 0, 0, 0.3); }
    .polaroid .foto .hoes { width: 186px; height: 186px; }
    .polaroid .foto::after { content: ''; position: absolute; left: 70px; top: -14px; width: 80px; height: 28px; background: rgba(255, 245, 210, 0.75); transform: rotate(4deg);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); }
    .polaroid .krabbel { position: absolute; left: 8px; right: 8px; bottom: 6px; font: 700 22px 'Caveat', cursive; color: #2b2b33; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .polaroid .info { position: absolute; left: 280px; top: 70px; right: 20px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75), 0 0 16px rgba(0, 0, 0, 0.45); }
    .polaroid .titel { font: 700 62px/1.05 'Caveat', cursive; color: #fff; }
    .polaroid .artiest { font: 700 34px 'Caveat', cursive; color: color-mix(in srgb, var(--roze) 60%, #fff); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 1.2s; }
    .polaroid .streep { margin-top: 10px; width: 300px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.25); transform: rotate(-1deg); overflow: hidden; }
    .polaroid .streep .vul { background: color-mix(in srgb, var(--roze) 70%, #fff); }

    /* melding als Spotify nog niet gekoppeld is (ook in OBS, zodat je weet dat er iets moet gebeuren) */
    .hint { position: fixed; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); max-width: 720px; padding: 16px 20px; border-radius: 16px;
        background: var(--kaart); font-size: 16px; line-height: 1.45; box-shadow: 0 0 0 2px var(--paars); }
    .hint[hidden] { display: none; }
    .hint a { color: #ff9bd2; font-weight: 700; }
</style>
</head>
<body data-stijl="kaart">
<div id="podium">

<div class="hint" id="hint" hidden></div>
<script>
(() => {
    const q = new URLSearchParams(location.search);
    const STIJLEN = { kaart: [800, 220], pil: [640, 110], '3d': [900, 320], aurora: [820, 200], split: [760, 140], transparant: [760, 160], schuin: [960, 240], volledig: [1920, 1080], polaroid: [760, 300] };
    const DEMO = q.get('demo') === '1';
    // ?voorbeeld=1 (instelpagina): het echte nummer als er iets speelt, anders het voorbeeldnummer, en altijd in beeld
    const VOORBEELD = q.get('voorbeeld') === '1';
    // kopie op gwnlarss.nl voor andere streamers (?id= uit nowplaying-setup.html); het origineel staat in de bot-repo (public/nowplaying.html)
    const API_BASE = 'https://api.gwnlarss.nl', ID = q.get('id') || '';
    const KOPPEL = ID ? 'https://gwnlarss.nl/nowplaying-setup.html' : API_BASE + '/api/spotify/verbind';
    const VOORBEELDNUMMER = { geconfigureerd: true, gekoppeld: true, speelt: true, id: 'demo', titel: 'Een heel lang nummer met een titel die niet past', artiest: 'GwnLarss, Vrienden', hoes: new URL('nowplaying/demo-hoes.webp', location.href).href, duur: 213000, positie: 64000, volgende: { titel: 'Het volgende nummer', artiest: 'Een andere artiest' } };

    // Stijl en kant: vast uit de link (?stijl=, voor voorbeelden), anders de opgeslagen keuze van de server.
    // Zo blijft de OBS-link altijd hetzelfde; na opslaan op de instelpagina laadt de overlay zichzelf opnieuw.
    const podium = document.getElementById('podium');
    let STIJL = null, PLEK = null, blok = null, BW = 0, BH = 0, stijlKlaar;
    window.npStijlKlaar = new Promise(r => (stijlKlaar = r));
    function pas() {
        if (!STIJL) return;
        const s = Math.min(innerWidth / BW, innerHeight / BH);
        const x = PLEK === 'rechts' ? innerWidth - BW * s : 0;
        podium.style.transform = `translate(${x}px, ${(innerHeight - BH * s) / 2}px) scale(${s})`;
    }
    addEventListener('resize', pas);
    function startStijl(stijl, plek) {
        STIJL = STIJLEN[stijl] ? stijl : 'kaart'; PLEK = plek === 'rechts' ? 'rechts' : 'links';
        document.body.dataset.stijl = STIJL;
        document.body.classList.toggle('rechts', PLEK === 'rechts');
        [BW, BH] = STIJLEN[STIJL];
        podium.style.width = BW + 'px'; podium.style.height = BH + 'px';
        pas();
        blok = document.querySelector(`.blok.${STIJL === '3d' ? 'drie' : STIJL}`);
        stijlKlaar(STIJL);
    }
    const vast = STIJLEN[q.get('stijl')] ? q.get('stijl') : null;
    if (vast || DEMO) startStijl(vast || 'kaart', q.get('plek'));

    const alle = sel => (blok ? blok.querySelectorAll(sel) : []);
    const hint = document.getElementById('hint');
    const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
    if (q.get('gekoppeld') === '1') { hint.hidden = false; hint.innerHTML = '✅ Spotify is gekoppeld! Zet een nummer aan, dan schuift de overlay in beeld. Deze melding verdwijnt vanzelf.'; setTimeout(() => (hint.hidden = true), 6000); }
    if (q.get('fout')) { hint.hidden = false; hint.innerHTML = '❌ ' + q.get('fout').replace(/[<>&]/g, '') + ' <a href="' + KOPPEL + '">Opnieuw koppelen</a>'; }

    function lopendeTitel() {
        for (const t of alle('.titel')) {
            t.classList.remove('loopt');
            const vak = t.parentElement.clientWidth, breed = t.scrollWidth - 50;
            if (breed > vak) {   // te lang: rustig heen en weer laten lopen
                t.style.setProperty('--afstand', (vak - breed - 20) + 'px');
                t.style.setProperty('--duur', Math.max(8, (breed - vak) / 30 + 6) + 's');
                t.classList.add('loopt');
            }
        }
    }
    // twee accentkleuren uit de albumhoes: de meest voorkomende levendige tint en een tweede die er genoeg van verschilt
    function hsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
        if (!d) return [0, 0, l];
        const s = d / (1 - Math.abs(2 * l - 1));
        const h = max === r ? ((g - b) / d + 6) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
        return [h * 60, s, l];
    }
    const kleurCache = new Map();
    function haalKleuren(url) {
        if (kleurCache.has(url)) return Promise.resolve(kleurCache.get(url));
        return new Promise(klaar => {
            const img = new Image(); img.crossOrigin = 'anonymous';
            img.onload = () => {
                try {
                    const c = document.createElement('canvas'); c.width = c.height = 36;
                    const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0, 36, 36);
                    const px = g.getImageData(0, 0, 36, 36).data, bakken = Array.from({ length: 18 }, () => ({ w: 0, h: 0, s: 0 }));
                    for (let i = 0; i < px.length; i += 4) {
                        const [h, sat, l] = hsl(px[i], px[i + 1], px[i + 2]);
                        if (sat < 0.25 || l < 0.15 || l > 0.85) continue;   // grijs, zwart en wit tellen niet mee
                        const b = bakken[Math.floor(h / 20) % 18], w = sat * (1 - Math.abs(l - 0.5));
                        b.w += w; b.h += h * w; b.s += sat * w;
                    }
                    const top = bakken.map((b, i) => ({ ...b, i })).filter(b => b.w > 0).sort((a, b) => b.w - a.w);
                    if (!top.length) { kleurCache.set(url, null); return klaar(null); }
                    const tint = b => b.h / b.w;
                    const h1 = tint(top[0]);
                    const tweede = top.find(b => Math.min(Math.abs(tint(b) - h1), 360 - Math.abs(tint(b) - h1)) > 40);
                    const h2 = tweede ? tint(tweede) : (h1 + 50) % 360;
                    const uit = [`hsl(${h1.toFixed(0)} 85% 62%)`, `hsl(${h2.toFixed(0)} 85% 64%)`];
                    kleurCache.set(url, uit); klaar(uit);
                } catch { klaar(null); }   // geen toegang tot de pixels: merk-kleuren houden
            };
            img.onerror = () => klaar(null);
            img.src = url;
        });
    }
    let kleurVoor = null;
    async function zetKleur(d) {
        // kleur: 'hoes' (uit de albumhoes), 'merk' (paars/roze) of 'eigen' (twee zelf gekozen kleuren); ?kleur=/?k1=/?k2= alleen voor voorbeelden
        const soort = q.get('kleur') || d.instellingen?.kleur || 'hoes';
        const hex = v => (/^#[0-9a-f]{6}$/i.test(v || '') ? v : null);
        const eigen = soort === 'eigen' ? [hex(q.get('k1') && '#' + q.get('k1')) || hex(d.instellingen?.kleuren?.[0]), hex(q.get('k2') && '#' + q.get('k2')) || hex(d.instellingen?.kleuren?.[1])] : null;
        const wil = eigen && eigen[0] && eigen[1] ? 'eigen:' + eigen.join(',') : soort === 'hoes' && d.hoes ? d.hoes : null;
        if (wil === kleurVoor) return;
        kleurVoor = wil;
        const k = !wil ? null : wil.startsWith('eigen:') ? eigen : await haalKleuren(wil);
        if (kleurVoor !== wil) return;
        if (k) { document.body.style.setProperty('--paars', k[0]); document.body.style.setProperty('--roze', k[1]); }
        else { document.body.style.removeProperty('--paars'); document.body.style.removeProperty('--roze'); }
        window.npLaatsteKleur = k ?? ['#9146ff', '#ff3ea5']; window.npKleur?.(window.npLaatsteKleur);
    }
    // overvloeien: een kopie van de laag met de nieuwe hoes komt er doorzichtig bovenop en wordt in 1,2 s zichtbaar;
    // daarna krijgt de laag zelf de nieuwe hoes en verdwijnt de kopie. De bewegende hoes loopt in de kopie gelijk mee.
    const isAchter = h => h.matches('.waas, .gloed, .achter');
    // tekst zacht wisselen: eerst omhoog wegvervagen, dan de nieuwe tekst van onder laten binnenkomen
    function wisselTekst(zet) {
        const delen = [...alle('.titelvak, [data-artiest], [data-volgende], .tijden')];
        const uit = delen.map(e => e.animate([{ opacity: 1, transform: 'translateY(0)', filter: 'blur(0)' }, { opacity: 0, transform: 'translateY(-8px)', filter: 'blur(3px)' }], { duration: 260, easing: 'ease-in', fill: 'forwards' }));
        Promise.all(uit.map(a => a.finished)).catch(() => { }).then(() => {
            zet();
            delen.forEach((e, i) => e.animate([{ opacity: 0, transform: 'translateY(10px)', filter: 'blur(3px)' }, { opacity: 1, transform: 'translateY(0)', filter: 'blur(0)' }], { duration: 480, delay: i * 50, easing: 'cubic-bezier(.2, .8, .3, 1)', fill: 'backwards' }));
            uit.forEach(a => a.cancel());
        });
    }
    function vervaag(el, url, voor) {
        el.npKopie?.remove();   // alleen de eigen vorige overgang opruimen (achtergrond en hoes kunnen in hetzelfde vak zitten)
        const beeld = url ? `url("${url}")` : '';
        const kopie = el.cloneNode(false);
        kopie.dataset.laag = '1';
        kopie.style.backgroundImage = beeld; kopie.style.opacity = '0';
        el.after(kopie); el.npKopie = kopie;
        const doel = getComputedStyle(el).opacity;
        const loop = el.getAnimations().find(a => a.animationName === 'kenburns');
        if (loop) kopie.getAnimations().forEach(a => (a.currentTime = loop.currentTime));
        const klaar = () => { el.style.backgroundImage = beeld; requestAnimationFrame(() => { kopie.remove(); if (el.npKopie === kopie) el.npKopie = null; }); };
        const img = new Image();
        // hoes: vervagen met een lichte zoom; wazige achtergrond: alleen vervagen. Inzoomen op een wazig vlak laat de browser
        // de waas elk beeldje opnieuw uitrekenen (haperen en dan ineens omspringen); zo wordt de laag één keer getekend.
        const sporen = voor ? [{ opacity: 0, scale: '1.06' }, { opacity: doel, scale: '1' }] : [{ opacity: 0 }, { opacity: doel }];
        if (!voor) kopie.style.willChange = 'opacity';
        img.onload = img.onerror = () => kopie.animate(sporen, { duration: 1100, easing: 'cubic-bezier(.4, 0, .2, 1)', fill: 'forwards' }).finished.then(klaar);
        if (url) img.src = url; else img.onload();
    }
    let nu = null, vorigeId = null, uitTimer = null;
    function verwerk(d) {
        // opgeslagen stijl/kant: de eerste keer toepassen, bij een wijziging opnieuw laden
        const inst = d.instellingen;
        if (!vast && inst) {
            if (!STIJL) startStijl(inst.stijl, inst.plek);
            else if (inst.stijl !== STIJL || inst.plek !== PLEK) { location.reload(); return; }
        }
        if (!STIJL) startStijl('kaart', 'links');
        if (!d.geconfigureerd && !DEMO) { hint.hidden = false; hint.textContent = 'Spotify is nog niet ingesteld op de server (SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET).'; return; }
        if (!d.gekoppeld && !DEMO) { if (!q.get('fout')) { hint.hidden = false; hint.innerHTML = 'Spotify is nog niet gekoppeld. <a href="' + KOPPEL + '">Koppel je Spotify</a>' + (ID ? '.' : ' (alleen met je beheer-login).'); } return; }
        if (!q.get('gekoppeld') && !q.get('fout')) hint.hidden = true;
        nu = d;
        zetKleur(d);
        document.body.classList.toggle('met-waas', q.has('waas') ? q.get('waas') !== '0' : (d.instellingen?.waas ?? true));
        document.body.classList.toggle('beweeg', q.has('beweging') ? q.get('beweging') === '1' : Boolean(d.instellingen?.beweging));
        const volg = d.volgende && (q.has('volgende') ? q.get('volgende') !== '0' : (d.instellingen?.volgende ?? true));
        document.body.classList.toggle('geenvolgende', !volg);
        if (volg) alle('[data-volgende]').forEach(e => (e.textContent = d.volgende.titel + (d.volgende.artiest ? ' · ' + d.volgende.artiest : '')));
        if (d.id && d.id !== vorigeId) {
            const eerste = vorigeId === null;
            vorigeId = d.id;
            // achtergrondlagen (wazige hoes, gloed, achtergrond van volledig scherm) vloeien over naar de nieuwe hoes; alleen de hoes zelf draait om
            // alle hoezen (ook de wazige achtergrond) vloeien over naar de nieuwe hoes; de tekst vervaagt weg en komt zacht terug
            const hoezen = [...alle('[data-hoes]:not([data-laag])')];
            if (eerste) hoezen.forEach(h => (h.style.backgroundImage = d.hoes ? `url("${d.hoes}")` : ''));
            else hoezen.forEach(h => vervaag(h, d.hoes, !isAchter(h)));
            const zetTekst = () => {
                alle('[data-titel]').forEach(e => (e.textContent = d.titel || ''));
                alle('[data-artiest]').forEach(e => (e.textContent = d.artiest || ''));
                alle('[data-lengte]').forEach(e => (e.textContent = mmss(d.duur)));
                lopendeTitel();
            };
            window.npLaatsteHoes = d.hoes; window.npHoes?.(d.hoes);   // de 3D-scène pakt deze op als hij later klaar is
            if (eerste) zetTekst();
            else wisselTekst(zetTekst);
        }
        document.body.classList.toggle('speelt', d.speelt);
        // in beeld zolang er muziek speelt; bij pauze of stilte na 4 s weg. De klok alleen starten als hij nog niet loopt,
        // anders zet elke nieuwe meting (elke 3 s) hem opnieuw op nul en verdwijnt de overlay nooit.
        if (d.speelt) { clearTimeout(uitTimer); uitTimer = null; document.body.classList.add('aan'); }
        else if (!uitTimer) uitTimer = setTimeout(() => { uitTimer = null; document.body.classList.remove('aan'); }, 4000);
    }
    // voortgang tussen de metingen door lokaal laten doorlopen
    setInterval(() => {
        if (!nu || !nu.duur || !blok) return;
        const pos = Math.min(nu.duur, nu.positie + (nu.speelt ? Date.now() - nu.op : 0)), p = pos / nu.duur;
        blok.style.setProperty('--p', p.toFixed(4));
        alle('[data-tijd]').forEach(e => (e.textContent = mmss(pos)));
    }, 250);

    let voorbeeldOp = 0;
    async function haal() {
        if (DEMO) return verwerk({ ...VOORBEELDNUMMER, op: Date.now() });
        try {
            const d = await (await fetch(API_BASE + '/api/spotify/nu' + (ID ? '?id=' + encodeURIComponent(ID) : ''), { cache: 'no-store' })).json();
            // voorbeeld: niets aan het spelen of niet gekoppeld, dan het voorbeeldnummer (met een vaste starttijd zodat de balk doorloopt)
            if (VOORBEELD && !(d.gekoppeld && d.speelt && d.id)) { voorbeeldOp ||= Date.now(); return verwerk({ ...VOORBEELDNUMMER, instellingen: d.instellingen, op: voorbeeldOp }); }
            verwerk(d);
        } catch { if (VOORBEELD) verwerk({ ...VOORBEELDNUMMER, op: voorbeeldOp ||= Date.now() }); }
    }
    haal(); setInterval(haal, 3000);
    document.fonts.ready.then(() => { lopendeTitel(); document.body.dataset.klaar = '1'; });
})();
</script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
// 3d-stijl: een platenhoes met de albumhoes erop, de plaat half eruit geschoven en draaiend, met een zachte schaduw.
// Bij een nieuw nummer schuift de plaat de hoes in en weer uit. Eigen klein canvas, rendert alleen als de overlay in beeld is.
if (await window.npStijlKlaar === '3d') {
    const THREE = await import('three');
    const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');
    const r = new THREE.WebGLRenderer({ canvas: document.getElementById('drie'), alpha: true, antialias: true });
    r.setPixelRatio(Math.min(2, devicePixelRatio)); r.setSize(340, 320, false);
    r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
    const cam = new THREE.PerspectiveCamera(30, 340 / 320, 1, 100); cam.position.set(0.35, 0.25, 9); cam.lookAt(0.35, 0, 0);
    const doek = (w, h, teken) => { const c = document.createElement('canvas'); c.width = w; c.height = h; teken(c.getContext('2d')); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };

    // standaardhoes (paars/roze) tot de echte hoes geladen is
    const standaard = doek(256, 256, g => { const v = g.createLinearGradient(0, 0, 256, 256); v.addColorStop(0, '#9146ff'); v.addColorStop(1, '#ff3ea5'); g.fillStyle = v; g.fillRect(0, 0, 256, 256); });
    // platenhoes: karton met de albumhoes aan de voorkant
    const hoesMat = new THREE.MeshStandardMaterial({ map: standaard, roughness: 0.6, metalness: 0, envMapIntensity: 0.35 });
    const karton = new THREE.MeshStandardMaterial({ color: 0x1b1822, roughness: 0.8 });
    const hoes = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.5, 0.07), [karton, karton, karton, karton, hoesMat, karton]);
    // plaat met groeven, glimmende rand en een label met dezelfde hoes
    const groeven = doek(512, 512, g => {
        g.fillStyle = '#0b0b0f'; g.fillRect(0, 0, 512, 512);
        for (let rr = 254; rr > 92; rr -= 2.4) { g.strokeStyle = (rr | 0) % 3 ? '#16151c' : '#0d0c11'; g.lineWidth = 1.6; g.beginPath(); g.arc(256, 256, rr, 0, 6.29); g.stroke(); }
        g.strokeStyle = '#26242e'; g.lineWidth = 3; [200, 150].forEach(rr => { g.beginPath(); g.arc(256, 256, rr, 0, 6.29); g.stroke(); });   // tussenruimtes tussen nummers
    });
    const vinyl = new THREE.MeshPhysicalMaterial({ map: groeven, metalness: 0.35, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.12 });
    const schijf = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 0.03, 128), [new THREE.MeshPhysicalMaterial({ color: 0x0e0e12, roughness: 0.3, clearcoat: 1 }), vinyl, vinyl]);
    const labelMat = new THREE.MeshStandardMaterial({ map: standaard, roughness: 0.5, envMapIntensity: 0.35 });
    const label = new THREE.Mesh(new THREE.CircleGeometry(0.42, 64), labelMat); label.position.y = 0.017; label.rotation.x = -Math.PI / 2;
    const gat = new THREE.Mesh(new THREE.CircleGeometry(0.035, 24), new THREE.MeshBasicMaterial({ color: 0x050505 })); gat.position.y = 0.018; gat.rotation.x = -Math.PI / 2;
    const draaier = new THREE.Group(); draaier.add(schijf, label, gat);
    const plaat = new THREE.Group(); plaat.add(draaier); plaat.rotation.x = Math.PI / 2;   // rechtop, voorkant naar de kijker
    // samen in een groep die iets schuin staat; de plaat zit achter de hoes en schuift naar rechts uit
    const set = new THREE.Group(); set.add(plaat, hoes); plaat.position.z = -0.06;
    set.rotation.set(-0.12, -0.42, 0.03); set.position.x = -0.35;
    scene.add(set);
    // zachte schaduw eronder
    const schaduw = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 1.4), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false,
        map: doek(256, 64, g => { const v = g.createRadialGradient(128, 32, 4, 128, 32, 120); v.addColorStop(0, 'rgba(0,0,0,0.55)'); v.addColorStop(1, 'rgba(0,0,0,0)'); g.setTransform(1, 0, 0, 0.27, 0, 23); g.fillStyle = v; g.fillRect(0, 0, 256, 256); }) }));
    schaduw.rotation.x = -Math.PI / 2; schaduw.position.set(0.2, -1.55, 0); scene.add(schaduw);
    // lampen in de accentkleuren plus een wit strijklicht
    const paars = new THREE.PointLight(0x9146ff, 14, 0, 1.6), roze = new THREE.PointLight(0xff3ea5, 14, 0, 1.6);
    const zon = new THREE.DirectionalLight(0xffffff, 1.3); zon.position.set(-3, 4, 5);
    scene.add(paars, roze, zon);

    const laad = new THREE.TextureLoader(); laad.setCrossOrigin('anonymous');
    let wissel = 0;   // 1 -> 0: plaat schuift de hoes in en weer uit
    window.npKleur = ([a, b]) => { paars.color.set(new THREE.Color().setStyle(a)); roze.color.set(new THREE.Color().setStyle(b)); };
    window.npHoes = url => {
        wissel = 1;
        const zet = t => { hoesMat.map = t; labelMat.map = t; hoesMat.needsUpdate = labelMat.needsUpdate = true; };
        if (!url) return zet(standaard);
        laad.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; zet(t); });
    };
    // het eerste nummer kwam misschien al binnen voordat deze scène klaar was
    if (window.npLaatsteHoes !== undefined) { window.npHoes(window.npLaatsteHoes); wissel = 0; }
    if (window.npLaatsteKleur) window.npKleur(window.npLaatsteKleur);
    let hoek = 0, vorige = 0;
    r.setAnimationLoop(nu => {
        if (!document.body.classList.contains('aan')) { vorige = nu; return; }   // uit beeld: niet rekenen
        const dt = vorige ? Math.min(0.05, (nu - vorige) / 1000) : 0; vorige = nu;
        const t = nu / 1000;
        if (document.body.classList.contains('speelt')) hoek -= dt * 3.2;
        draaier.rotation.y = hoek;
        wissel = Math.max(0, wissel - dt * 0.9);
        const inUit = wissel > 0 ? Math.abs(Math.cos(wissel * Math.PI)) : 1;   // 1 = uitgeschoven, 0 = helemaal in de hoes
        plaat.position.x = 1.15 * inUit;
        set.rotation.y = -0.42 + Math.sin(t * 0.6) * 0.06; set.position.y = Math.sin(t * 1.1) * 0.05;
        paars.position.set(Math.sin(t * 0.8) * 3.2, 2.2, 3); roze.position.set(-Math.sin(t * 0.8) * 3.2, -1.2, 3);
        r.render(scene, cam);
    });
}
</script>
