<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay, Demitje01</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Lilita+One&family=Russo+One&display=swap" rel="stylesheet">
<style>
    /* Overlay voor Demitje01 (1920x1080): blauw-turquoise rand met glinsters rond de game, onderaan
       laatste sub, zijn naam en laatste volger, rechtsboven zijn Twitch-profielfoto (of eigen logo: ?logo=<https-link>,
       of ?foto=0 voor een leeg rondje waar hij in OBS zijn eigen afbeelding in zet) met LIVE en
       optioneel een volgdoel (?doel=1200). Gegevens via zijn koppeling op gwnlarss.nl/demitje.
       Het midden blijft doorzichtig. In OBS als browserbron van 1920x1080 boven de game-opname. */
    :root {
        --paars: #1e6bff;
        --roze: #22e3d0;
        --diep: #062347;
        --live: #ff2e4d;
        --rand: 26px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; overflow: hidden; }
    body { font-family: 'Baloo 2', system-ui, sans-serif; }

    #podium { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }

    /* De rand: een verloop dat met een SVG-masker tot een band met ronde binnenhoeken wordt uitgesneden.
       De glans is een losse streep die alleen met transform beweegt, zodat er niets opnieuw getekend wordt. */
    .rand {
        position: absolute; inset: 0; overflow: hidden;
        background: linear-gradient(120deg, var(--paars) 0%, #1aa8ff 35%, var(--roze) 65%, var(--paars) 100%);
        -webkit-mask: var(--masker) 0 0 / 100% 100% no-repeat;
        mask: var(--masker) 0 0 / 100% 100% no-repeat;
    }
    .rand::after {
        content: ''; position: absolute; top: -50%; left: 0; width: 360px; height: 200%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
        transform: translateX(-500px) rotate(18deg);
        animation: glans 7s ease-in-out infinite;
    }
    @keyframes glans {
        0%, 55% { transform: translateX(-500px) rotate(18deg); }
        100% { transform: translateX(2400px) rotate(18deg); }
    }
    /* dunne lichte binnenrand langs het gat, geeft diepte zoals een lijst */
    .binnenlijn {
        position: absolute; inset: var(--rand); border-radius: 22px;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.45), 0 0 24px 4px rgba(30, 140, 255, 0.55);
        pointer-events: none;
    }
    #glinsters { position: absolute; inset: 0; width: 1920px; height: 1080px; }

    /* Onderbalk-plaatjes: laatste sub links, laatste volger rechts, half over de onderrand */
    .plaat {
        position: absolute; bottom: 26px; min-width: 300px; max-width: 520px;
        padding: 10px 30px 8px; border-radius: 18px;
        background: linear-gradient(180deg, rgba(8, 44, 92, 0.92), rgba(4, 22, 52, 0.94));
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.85), 0 0 0 7px var(--paars), 0 10px 26px rgba(0, 0, 0, 0.5);
        transform: skewX(-7deg);
        text-align: center;
    }
    .plaat > * { transform: skewX(7deg); }
    .plaat.links { left: 70px; }
    .plaat.rechts { right: 70px; }
    .plaat .label {
        font-size: 24px; font-weight: 800; letter-spacing: 3px; line-height: 1;
        background: linear-gradient(90deg, #c9fff8, var(--roze));
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .plaat .wie {
        font-size: 40px; font-weight: 800; line-height: 1.1; color: #fff;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
    }
    .plaat.nieuw { animation: pop 0.9s cubic-bezier(.2, 1.6, .4, 1); }
    @keyframes pop {
        0% { transform: skewX(-7deg) scale(1); }
        30% { transform: skewX(-7deg) scale(1.16); box-shadow: 0 0 0 3px #fff, 0 0 0 7px var(--roze), 0 0 60px 10px var(--roze); }
        100% { transform: skewX(-7deg) scale(1); }
    }

    /* Naam onderaan in het midden: dikke speelse letters met een donkere omlijning, over de rand heen */
    .naam, .plaat .label, .doel .label {
        font-family: 'Lilita One', 'Baloo 2', sans-serif; font-weight: 400 !important;
    }
    .naam {
        position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%) rotate(-2deg);
        font-size: 104px; font-weight: 800; line-height: 1; letter-spacing: 1px; white-space: nowrap;
    }
    .naam .l { position: relative; display: inline-block; }
    .naam .l > span { display: block; }
    .naam > .voor, .naam > .achter { display: block; }
    .naam .achter {
        position: absolute; inset: 0; color: var(--diep);
        -webkit-text-stroke: 18px var(--diep); paint-order: stroke fill;
        text-shadow: 0 8px 0 var(--diep), 0 14px 26px rgba(0, 0, 0, 0.55);
    }
    .naam .voor {
        position: relative;
        background: linear-gradient(180deg, #ffffff 0%, #dffcff 45%, #7ff0ff 70%, #39a6ff 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    /* Avatar rechtsboven, over de hoek heen, met LIVE-pil eronder */
    .avatar {
        position: absolute; right: 8px; top: 8px; width: 200px; height: 200px; border-radius: 50%;
        padding: 9px; background: conic-gradient(from 200deg, var(--paars), var(--roze), #c9fff8, var(--paars));
        box-shadow: 0 0 0 5px #fff, 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 40px rgba(34, 227, 208, 0.45);
    }
    .avatar img { width: 100%; height: 100%; border-radius: 50%; display: block; object-fit: cover; background: var(--diep); }
    .avatar.leeg img { visibility: hidden; }   /* alleen de ring: de eigen afbeelding komt uit OBS */
    .live {
        position: absolute; left: 50%; bottom: -16px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 8px;
        padding: 3px 18px 1px; border-radius: 999px; background: var(--live); color: #fff;
        font-size: 26px; font-weight: 800; letter-spacing: 2px; line-height: 1.2;
        box-shadow: 0 0 0 4px #fff, 0 6px 16px rgba(0, 0, 0, 0.45);
        transition: opacity 0.4s, transform 0.4s;
    }
    .live i { width: 12px; height: 12px; border-radius: 50%; background: #fff; animation: adem 1.4s ease-in-out infinite; }
    @keyframes adem { 50% { opacity: 0.25; } }
    .doel {
        position: absolute; right: 22px; top: 248px; width: 300px; padding: 10px 18px 14px; border-radius: 16px;
        background: linear-gradient(180deg, rgba(8, 44, 92, 0.92), rgba(4, 22, 52, 0.94));
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.85), 0 0 0 6px var(--paars), 0 10px 26px rgba(0, 0, 0, 0.5);
        color: #fff; text-align: center;
    }
    .doel[hidden] { display: none; }
    .doel .label { font-size: 22px; letter-spacing: 2px; color: var(--roze); line-height: 1.1; }
    .doel .tal { font-size: 30px; font-weight: 800; line-height: 1.15; }
    .doel .balk { height: 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.15); overflow: hidden; margin-top: 4px; }
    /* feest bij een alert: de rand licht op en pulseert even */
    body.feest .rand { animation: randFeest 2.4s ease-out; }
    body.feest .binnenlijn { animation: lijnFeest 2.4s ease-out; }
    @keyframes randFeest { 0% { filter: none; } 8% { filter: brightness(1.9) saturate(1.4); } 25% { filter: brightness(1.2); } 40% { filter: brightness(1.6) saturate(1.3); } 100% { filter: none; } }
    @keyframes lijnFeest { 10%, 40% { box-shadow: 0 0 0 3px #fff, 0 0 40px 12px var(--roze), 0 0 90px 20px var(--paars); } }
    .doel.gehaald { animation: doelGehaald 1.2s ease-in-out infinite alternate; }
    .doel.gehaald .vul { background: linear-gradient(90deg, #ffd84a, #fff3b0, #ffd84a); box-shadow: 0 0 14px #ffd84a; }
    @keyframes doelGehaald { to { box-shadow: 0 0 0 3px #fff, 0 0 0 6px #ffd84a, 0 0 40px 10px rgba(255, 216, 74, 0.6); } }
    .doel .vul { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--paars), var(--roze)); transition: width 1.2s ease; }
    .live[hidden] { display: flex; opacity: 0; transform: translateX(-50%) scale(0.6); }
    /* leeg rondje: alleen de ring, binnenin doorzichtig voor een eigen afbeelding uit OBS */
    .avatar.leeg { background: transparent; box-shadow: inset 0 0 0 9px var(--paars), 0 0 0 5px #fff, 0 0 40px rgba(34, 227, 208, 0.45); }
    .avatar.leeg img { visibility: hidden; }

    /* stickers op de plaatjes: hartje bij de sub, sterretje bij de volger */
    .plaat .ikoon { position: absolute; top: -30px; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center;
        background: #fff; box-shadow: 0 0 0 4px var(--paars), 0 6px 14px rgba(0, 0, 0, 0.4); }
    .plaat.links .ikoon { left: -26px; transform: skewX(7deg) rotate(-14deg); }
    .plaat.rechts .ikoon { right: -26px; transform: skewX(7deg) rotate(14deg); }
    .plaat .ikoon svg { width: 36px; height: 36px; fill: var(--roze); }
    .plaat.links .ikoon svg { fill: #ff4f8b; }
    .plaat.nieuw .ikoon { animation: sticker 0.9s ease; }
    @keyframes sticker { 30% { transform: skewX(7deg) rotate(0) scale(1.35); } }
    .speels .plaat.links { rotate: -2deg; }
    .speels .plaat.rechts { rotate: 2deg; }
    /* speels: de letters van de naam maken om de paar seconden een golfje */
    .speels .naam .l { animation: hup 7s ease-in-out infinite; animation-delay: calc(var(--i) * 0.07s); }
    @keyframes hup { 0%, 13%, 100% { transform: none; } 5% { transform: translateY(-24px) rotate(-5deg); } 9% { transform: translateY(4px) rotate(2deg); } }
    .hoek { display: none; }

    /* ---------- stijl 2: neon (?stijl=neon) ---------- */
    body.neon .rand { background: linear-gradient(120deg, #040b1c, #071a3a 50%, #040b1c); }
    body.neon .rand::after { background: linear-gradient(90deg, transparent, rgba(34, 227, 208, 0.35), transparent); }
    body.neon .binnenlijn { box-shadow: 0 0 0 3px #5ff6ff, 0 0 18px 4px rgba(34, 227, 208, 0.9), 0 0 50px 10px rgba(30, 107, 255, 0.6), inset 0 0 20px rgba(34, 227, 208, 0.35); }
    body.neon .plaat { transform: none; border-radius: 12px; background: rgba(3, 10, 26, 0.9);
        box-shadow: 0 0 0 3px #5ff6ff, 0 0 22px 3px rgba(34, 227, 208, 0.8), inset 0 0 18px rgba(34, 227, 208, 0.25); }
    body.neon .plaat > * { transform: none; }
    body.neon .plaat .label, body.neon .doel .label { font-family: 'Russo One', sans-serif; background: none; color: #5ff6ff; text-shadow: 0 0 10px rgba(34, 227, 208, 0.9); }
    body.neon .plaat .wie, body.neon .doel .tal { font-family: 'Russo One', sans-serif; font-weight: 400; text-shadow: 0 0 12px rgba(255, 255, 255, 0.6); }
    body.neon .plaat.nieuw { animation: popNeon 0.9s ease; }
    @keyframes popNeon { 30% { transform: scale(1.12); box-shadow: 0 0 0 3px #fff, 0 0 60px 14px #22e3d0; } }
    body.neon .naam { font-family: 'Russo One', sans-serif; transform: translateX(-50%); font-size: 96px; letter-spacing: 4px; }
    body.neon .naam .achter { display: none; }
    body.neon .naam .voor { background: none; color: #fff;
        text-shadow: 0 0 6px #fff, 0 0 18px #5ff6ff, 0 0 40px #22e3d0, 0 0 80px #1e6bff; animation: zoem 6s infinite; }
    @keyframes zoem { 0%, 92%, 100% { opacity: 1; } 93% { opacity: 0.55; } 94% { opacity: 1; } 96% { opacity: 0.7; } }
    body.neon .avatar { background: #040b1c; padding: 7px; box-shadow: 0 0 0 4px #5ff6ff, 0 0 26px 6px rgba(34, 227, 208, 0.9), 0 0 60px 10px rgba(30, 107, 255, 0.5); }
    body.neon .avatar.leeg { background: transparent; box-shadow: inset 0 0 0 7px #040b1c, 0 0 0 4px #5ff6ff, 0 0 26px 6px rgba(34, 227, 208, 0.9); }
    body.neon .doel { background: rgba(3, 10, 26, 0.9); box-shadow: 0 0 0 3px #5ff6ff, 0 0 22px 3px rgba(34, 227, 208, 0.8); }
    /* neon: HUD-hoeken binnen in het beeld, losse letters die haperen, iconen als neonbuis */
    body.neon .hoek { display: block; position: absolute; width: 70px; height: 70px; border: 0 solid #5ff6ff;
        filter: drop-shadow(0 0 6px #22e3d0); opacity: 0.9; animation: hoekAdem 3s ease-in-out infinite; }
    @keyframes hoekAdem { 50% { opacity: 0.45; } }
    body.neon .hoek.lb { left: calc(var(--rand) + 16px); top: calc(var(--rand) + 16px); border-width: 4px 0 0 4px; }
    body.neon .hoek.rb { right: calc(var(--rand) + 230px); top: calc(var(--rand) + 16px); border-width: 4px 4px 0 0; }
    body.neon .hoek.lo { left: calc(var(--rand) + 16px); bottom: calc(var(--rand) + 110px); border-width: 0 0 4px 4px; }
    body.neon .hoek.ro { right: calc(var(--rand) + 16px); bottom: calc(var(--rand) + 110px); border-width: 0 4px 4px 0; }
    body.neon .naam .l.uit .voor { opacity: 0.18; text-shadow: none; }
    body.neon .plaat .ikoon { background: #030a1a; box-shadow: 0 0 0 3px #5ff6ff, 0 0 16px 3px rgba(34, 227, 208, 0.8); transform: rotate(0); }
    body.neon .plaat .ikoon svg { fill: none; stroke: #5ff6ff; stroke-width: 2; filter: drop-shadow(0 0 4px #5ff6ff); }
    body.neon .plaat .wie { background: repeating-linear-gradient(0deg, rgba(95, 246, 255, 0.07) 0 2px, transparent 2px 5px); }
    body.neon .doel .vul { background: linear-gradient(90deg, #1e6bff, #5ff6ff); box-shadow: 0 0 12px #5ff6ff; }

    /* ---------- stijl 3: 3D (?stijl=3d) ---------- */
    /* metalen rand met afgeschuinde kanten */
    body.drie .rand { background: linear-gradient(180deg, #c9f6ff 0%, #4fb6ff 14%, #1e6bff 42%, #0a3a99 58%, #1aa8ff 80%, #22e3d0 100%);
        box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.7), inset 0 0 0 6px rgba(6, 35, 71, 0.55); }
    body.drie .binnenlijn { box-shadow: 0 0 0 3px #062347, 0 0 0 6px rgba(255, 255, 255, 0.75), 0 0 34px 8px rgba(0, 0, 0, 0.45); }
    /* zwevende 3D-bordjes met dikte, licht naar de kijker gedraaid */
    body.drie .plaat { bottom: 38px; --ry: 16deg; animation: zweef 6s ease-in-out infinite;
        box-shadow: 0 0 0 3px #fff, 0 0 0 7px var(--paars), 0 12px 0 6px #082a66, 0 30px 40px rgba(0, 0, 0, 0.5); }
    body.drie .plaat.rechts { --ry: -16deg; animation-delay: -3s; }
    body.drie .plaat > * { transform: none; }
    @keyframes zweef {
        0%, 100% { transform: perspective(900px) rotateY(var(--ry)) rotateX(12deg) translateY(0); }
        50% { transform: perspective(900px) rotateY(calc(var(--ry) * 0.4)) rotateX(6deg) translateY(-8px); }
    }
    body.drie .plaat.nieuw { animation: popDrie 0.9s cubic-bezier(.2, 1.6, .4, 1), zweef 6s ease-in-out 0.9s infinite; }
    @keyframes popDrie { 0% { transform: perspective(900px) rotateY(var(--ry)) rotateX(12deg); } 35% { transform: perspective(900px) rotateY(calc(var(--ry) * -1)) rotateX(-10deg) scale(1.15); } 100% { transform: perspective(900px) rotateY(var(--ry)) rotateX(12deg); } }
    /* stickers als draaiende munten */
    body.drie .plaat .ikoon { animation: muntDraai 5s ease-in-out infinite; box-shadow: 0 0 0 4px var(--paars), 0 6px 0 3px #082a66, 0 12px 18px rgba(0, 0, 0, 0.4); }
    @keyframes muntDraai { 0%, 70% { transform: perspective(400px) rotateY(0); } 85%, 100% { transform: perspective(400px) rotateY(360deg); } }
    /* avatar: een munt die af en toe omdraait */
    body.drie .avatar { animation: avatarMunt 12s ease-in-out infinite; box-shadow: 0 0 0 5px #fff, 0 10px 0 4px #082a66, 0 24px 34px rgba(0, 0, 0, 0.5), 0 0 40px rgba(34, 227, 208, 0.45); }
    @keyframes avatarMunt { 0%, 88% { transform: perspective(900px) rotateY(0); } 100% { transform: perspective(900px) rotateY(360deg); } }
    body.drie .doel { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--paars), 0 10px 0 5px #082a66, 0 24px 30px rgba(0, 0, 0, 0.5); transform: perspective(900px) rotateY(-12deg); }
    /* de naam als echte 3D-letters (three.js); de platte naam blijft als terugval als WebGL niet lukt */
    #naam3d { position: absolute; left: 50%; bottom: -78px; width: 1200px; height: 300px; transform: translateX(-50%); display: none; }
    body.drie #naam3d { display: block; }
    body.drie-ok .naam { visibility: hidden; }
</style></style>
</head>
<body>
<div id="podium">
    <div class="rand" id="rand"></div>
    <canvas id="glinsters" width="1920" height="1080"></canvas>
    <div class="binnenlijn"></div>

    <div class="plaat links" id="p-sub"><div class="ikoon"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.3 8.3 2.4 4 6.4 4c2.3 0 4 1.3 5.6 3.3C13.6 5.3 15.3 4 17.6 4c4 0 6.1 4.3 4.4 7.7C19.5 16.4 12 21 12 21z"/></svg></div><div class="label">LAATSTE SUB</div><div class="wie" id="w-sub">-</div></div>
    <div class="plaat rechts" id="p-volger"><div class="ikoon"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg></div><div class="label">LAATSTE VOLGER</div><div class="wie" id="w-volger">-</div></div>

    <div class="naam" id="naam"></div>

    <div class="hoek lb"></div><div class="hoek rb"></div><div class="hoek lo"></div><div class="hoek ro"></div>
    <canvas id="naam3d" width="1200" height="300"></canvas>

    <div class="avatar">
        <img id="foto" alt="">
        <div class="live" id="live" hidden><i></i>LIVE</div>
    </div>
    <div class="doel" id="doel" hidden><div class="label" id="doel-label">VOLGDOEL</div><div class="tal" id="doel-tal">-</div><div class="balk"><div class="vul" id="doel-vul"></div></div></div>
</div>
<script>
(() => {
    const W = 1920, H = 1080;
    const q = new URLSearchParams(location.search);
    const isDemo = q.get('demo') === '1';
    const RAND = Math.max(10, Math.min(60, +q.get('rand') || 26));
    const R = 22;
    // drie stijlen: speels (standaard), neon, 3d (oude links met ?stijl=weg worden ook 3d)
    const STIJL = q.get('stijl') === 'neon' ? 'neon' : ['3d', 'weg'].includes(q.get('stijl')) ? 'drie' : 'speels';
    document.body.classList.add(STIJL);
    document.documentElement.style.setProperty('--rand', RAND + 'px');

    // Podium op elke venstermaat passend schalen (in OBS is dat gewoon 1920x1080 = schaal 1)
    const podium = document.getElementById('podium');
    function pas() {
        const s = Math.min(innerWidth / W, innerHeight / H);
        podium.style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - H * s) / 2}px) scale(${s})`;
    }
    addEventListener('resize', pas); pas();

    // Masker: volle rechthoek min een afgeronde binnenrechthoek (evenodd), zo blijft het gat echt leeg
    const x0 = RAND, y0 = RAND, x1 = W - RAND, y1 = H - RAND;
    const gat = `M${x0 + R} ${y0}H${x1 - R}A${R} ${R} 0 0 1 ${x1} ${y0 + R}V${y1 - R}A${R} ${R} 0 0 1 ${x1 - R} ${y1}H${x0 + R}A${R} ${R} 0 0 1 ${x0} ${y1 - R}V${y0 + R}A${R} ${R} 0 0 1 ${x0 + R} ${y0}Z`;
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${W} ${H}'><path fill-rule='evenodd' d='M0 0H${W}V${H}H0Z ${gat}'/></svg>`;
    document.getElementById('rand').style.setProperty('--masker', `url("data:image/svg+xml,${encodeURIComponent(svg)}")`);

    // Naam: losse letters (golfje bij speels, haperende neonbuis bij neon); bij 3d tekent three.js hem eroverheen
    const NAAM = 'Demitje01', naamEl = document.getElementById('naam');
    naamEl.innerHTML = [...NAAM].map((c, i) => `<span class="l" style="--i:${i}"><span class="achter">${c}</span><span class="voor">${c}</span></span>`).join('');
    if (STIJL === 'neon') {
        const letters = naamEl.querySelectorAll('.l');
        setInterval(() => {
            if (Math.random() < 0.5) return;
            const l = letters[Math.floor(Math.random() * letters.length)];
            l.classList.add('uit'); setTimeout(() => l.classList.remove('uit'), 90);
            setTimeout(() => { l.classList.add('uit'); setTimeout(() => l.classList.remove('uit'), 140); }, 200);
        }, 2200);
    }

    // Glinsters: kleine twinkelende puntjes alleen in de rand, 30 fps, plus een uitbarsting bij een nieuwe naam
    const cv = document.getElementById('glinsters'), cx = cv.getContext('2d');
    const bandPad = new Path2D(`M0 0H${W}V${H}H0Z ${gat}`);
    function inBand() {
        // willekeurig punt op de band: kies een zijde naar verhouding van lengte
        const lang = Math.random() * (2 * W + 2 * H);
        const d = Math.random() * RAND;
        if (lang < W) return [lang, d];
        if (lang < 2 * W) return [lang - W, H - d];
        if (lang < 2 * W + H) return [d, lang - 2 * W];
        return [W - d, lang - 2 * W - H];
    }
    const puntjes = Array.from({ length: 90 }, () => {
        const [x, y] = inBand();
        return { x, y, fase: Math.random() * 6.28, snel: 1 + Math.random() * 2.5, r: 1 + Math.random() * 2.2 };
    });
    // punt op de middenlijn van de band (met de klok mee: boven, rechts, onder, links), voor de neonkometen
    const m = RAND / 2;
    const BW = W - 2 * m, BH = H - 2 * m, OMTREK = 2 * BW + 2 * BH;
    function opLijn(a) {
        a = ((a % OMTREK) + OMTREK) % OMTREK;
        if (a < BW) return [m + a, m, 0];
        if ((a -= BW) < BH) return [W - m, m + a, Math.PI / 2];
        if ((a -= BH) < BW) return [W - m - a, H - m, Math.PI];
        a -= BW; return [m, H - m - a, -Math.PI / 2];
    }
    const vonken = [];
    // zijn kanaal-emotes: bij een alert springen er een paar uit de rand het beeld in
    const EMOTES = [];
    fetch('https://api.gwnlarss.nl/api/streamer-alerts/demitje01/emotes').then(r => r.json()).then(d => (d.emotes || []).forEach(e => { const i = new Image(); i.src = e.url; EMOTES.push(i); })).catch(() => { });
    function emoteSprong(x, y) {
        const klaar = EMOTES.filter(i => i.complete && i.naturalWidth);
        if (!klaar.length) return;
        // richting het midden van het beeld, met een boogje
        const dx = W / 2 - x, dy = H / 2 - y, l = Math.hypot(dx, dy) || 1, v = 7 + Math.random() * 5;
        vonken.push({ img: klaar[Math.floor(Math.random() * klaar.length)], x, y, vx: dx / l * v, vy: dy / l * v - 3, leven: 1.6, draai: (Math.random() - 0.5) * 0.5 });
        if (!loopt) start();
    }
    function barst(x, y) {
        for (let i = 0; i < 46; i++) {
            const h = Math.random() * 6.28, v = 3 + Math.random() * 9;
            vonken.push({ x, y, vx: Math.cos(h) * v, vy: Math.sin(h) * v - 4, leven: 1, kleur: STIJL === 'neon' ? (Math.random() < 0.5 ? '#5ff6ff' : '#1e6bff') : (Math.random() < 0.5 ? '#c9fff8' : '#ffffff') });
        }
        if (!loopt) start();
    }
    let loopt = false, vorige = 0;
    function teken(nu) {
        if (nu - vorige < 32) { requestAnimationFrame(teken); return; }
        vorige = nu;
        cx.clearRect(0, 0, W, H);
        const t = nu / 1000;
        cx.save(); cx.clip(bandPad, 'evenodd');
        cx.fillStyle = STIJL === 'neon' ? '#7ff8ff' : '#fff';
        for (const p of puntjes) {
            const a = Math.max(0, Math.sin(t * p.snel + p.fase));
            if (a < 0.05) continue;
            cx.globalAlpha = a * 0.9;
            cx.beginPath(); cx.arc(p.x, p.y, p.r * (0.6 + a * 0.6), 0, 6.28); cx.fill();
            if (a > 0.92 && p.r > 2) { // kruisje bij de felste puntjes
                cx.fillRect(p.x - 7 * a, p.y - 0.75, 14 * a, 1.5); cx.fillRect(p.x - 0.75, p.y - 7 * a, 1.5, 14 * a);
            }
        }
        if (STIJL === 'neon') {
            // twee lichtkometen die rond het beeld racen
            for (const start of [0, OMTREK / 2]) {
                for (let k = 0; k < 36; k++) {
                    const [x, y] = opLijn(start + t * 520 - k * 7), f = 1 - k / 36;
                    cx.globalAlpha = f * 0.9; cx.fillStyle = k < 3 ? '#ffffff' : '#5ff6ff';
                    cx.beginPath(); cx.arc(x, y, 1 + f * (RAND * 0.22), 0, 6.28); cx.fill();
                }
            }
        }
        cx.restore();
        for (let i = vonken.length - 1; i >= 0; i--) {
            const v = vonken[i];
            if (v.img) { v.x += v.vx; v.y += v.vy; v.vx *= 0.975; v.vy = v.vy * 0.975 + 0.04; v.leven -= 0.011; }
            else { v.x += v.vx; v.y += v.vy; v.vy += 0.35; v.vx *= 0.97; v.leven -= 0.022; }
            if (v.leven <= 0) { vonken.splice(i, 1); continue; }
            cx.globalAlpha = v.leven; cx.fillStyle = v.kleur;
            if (v.img) {   // emote: groeit even aan, zweeft verder en vervaagt
                const b = 96 * Math.min(1, (1.6 - v.leven) * 5 + 0.3);
                cx.globalAlpha = Math.min(1, v.leven);
                cx.save(); cx.translate(v.x, v.y); cx.rotate(v.draai); cx.drawImage(v.img, -b / 2, -b / 2, b, b); cx.restore();
                continue;
            }
            cx.beginPath(); cx.arc(v.x, v.y, 2.5 + v.leven * 2, 0, 6.28); cx.fill();
        }
        cx.globalAlpha = 1;
        requestAnimationFrame(teken);
    }
    function start() { loopt = true; requestAnimationFrame(teken); }
    start();

    // Gegevens: laatste sub/volger en volgers uit zijn koppeling (api.gwnlarss.nl), foto, live en volgers via decapi
    const LOGIN = 'demitje01', API = 'https://api.gwnlarss.nl/api/streamer-alerts/' + LOGIN;
    const DOEL = Math.max(0, +q.get('doel') || 0);
    const DEMO = { laatste: { subscriber: { naam: 'GezelligeKijker', op: 2 }, follower: { naam: 'NieuweVolger123', op: 1 } }, totaal: { volgers: 1056 } };
    const eigenLogo = (q.get('logo') || '').trim();
    if (q.get('foto') === '0') document.querySelector('.avatar').classList.add('leeg');
    else if (eigenLogo.startsWith('https://')) document.getElementById('foto').src = eigenLogo;
    else fetch('https://decapi.me/twitch/avatar/' + LOGIN).then(r => r.text()).then(u => { if (u.trim().startsWith('https://')) document.getElementById('foto').src = u.trim(); }).catch(() => { });
    const vorigeNaam = {};
    function zet(sleutel, plaatId, wieId, naam) {
        naam = naam || '-';
        const el = document.getElementById(wieId);
        if (vorigeNaam[sleutel] === naam) return;
        const eersteKeer = !(sleutel in vorigeNaam);
        vorigeNaam[sleutel] = naam;
        el.textContent = naam;
        if (eersteKeer) return;
        const p = document.getElementById(plaatId);
        p.classList.remove('nieuw'); void p.offsetWidth; p.classList.add('nieuw');
        const b = p.getBoundingClientRect(), s = podium.getBoundingClientRect().width / W;
        barst((b.left + b.width / 2 - podium.getBoundingClientRect().left) / s, (b.top - podium.getBoundingClientRect().top) / s + 10);
    }
    // laatste sub: de nieuwste van gewone sub, resub en gifted subs (dan de gever)
    function laatsteSub(l) {
        return ['subscriber', 'resub', 'gift'].map(k => l[k]).filter(Boolean).sort((x, y) => (y.op || 0) - (x.op || 0))[0];
    }
    let volgers = null;
    let doelWasGehaald = null;
    function toonDoel() {
        if (!DOEL || volgers == null) return;
        const gehaald = volgers >= DOEL;
        document.getElementById('doel').classList.toggle('gehaald', gehaald);
        document.getElementById('doel-label').textContent = gehaald ? 'DOEL GEHAALD!' : 'VOLGDOEL';
        if (gehaald && doelWasGehaald === false) feest(3);   // net gehaald terwijl de overlay openstaat
        doelWasGehaald = gehaald;
        document.getElementById('doel').hidden = false;
        document.getElementById('doel-tal').textContent = volgers.toLocaleString('nl-NL') + ' / ' + DOEL.toLocaleString('nl-NL');
        document.getElementById('doel-vul').style.width = Math.min(100, volgers / DOEL * 100) + '%';
    }
    async function haalStats() {
        try {
            const d = isDemo ? DEMO : await (await fetch(API + '/stats', { cache: 'no-store' })).json();
            const l = d.laatste || {};
            zet('sub', 'p-sub', 'w-sub', laatsteSub(l) && laatsteSub(l).naam);
            zet('volger', 'p-volger', 'w-volger', l.follower && l.follower.naam);
            if (d.totaal && d.totaal.volgers != null) { volgers = d.totaal.volgers; toonDoel(); }
        } catch { }
    }
    async function haalLive() {
        let live = q.get('live') === '1' || isDemo;
        if (!isDemo) {
            try {
                const tekst = await (await fetch('https://decapi.me/twitch/uptime/' + LOGIN, { cache: 'no-store' })).text();
                live = live || (!/offline/i.test(tekst) && /second|minute|hour|day/i.test(tekst));
            } catch { }
            // zolang hij nog niet gekoppeld is: volgers voor het doel via decapi
            if (DOEL && volgers == null) {
                try { const n = parseInt(await (await fetch('https://decapi.me/twitch/followcount/' + LOGIN)).text(), 10); if (n >= 0) { volgers = n; toonDoel(); volgers = null; } } catch { }
            }
        }
        document.getElementById('live').hidden = !live;
    }
    // Feest: de rand licht op en er spatten vonken van rondom het beeld (meer bij grotere alerts)
    function feest(niveau = 0) {
        document.body.classList.remove('feest'); void document.body.offsetWidth; document.body.classList.add('feest');
        clearTimeout(feest.t); feest.t = setTimeout(() => document.body.classList.remove('feest'), 2500);
        const plekken = 6 + niveau * 3;
        for (let i = 0; i < plekken; i++) setTimeout(() => { const [x, y] = inBand(); barst(x, y); if (i % 2 === 0) emoteSprong(x, y); }, i * 120);
    }
    const NIVEAU = e => { const x = e.extra || {}, t = (w, g) => g.filter(v => w >= v).length;
        return e.soort === 'gift' ? t(+x.aantal, [5, 10, 20, 50, 100]) : e.soort === 'cheer' ? t(+x.bits, [500, 1000, 5000, 10000, 25000]) : e.soort === 'raid' ? t(+x.kijkers, [10, 25, 50, 100, 250]) : 0; };
    // Live-verbinding: namen meteen bijwerken bij een echte alert (niet bij tests), en altijd feest
    function opAlert(e) {
        if (!e || !e.soort || e.soort[0] === '_') return;
        if (!e.extra?.test) {
            if (e.soort === 'follower') { zet('volger', 'p-volger', 'w-volger', e.naam); if (volgers != null) { volgers++; toonDoel(); } }
            if (['subscriber', 'resub', 'gift'].includes(e.soort)) zet('sub', 'p-sub', 'w-sub', e.naam);
        }
        feest(NIVEAU(e));
    }
    if (!isDemo) {
        (function verbind() {
            const bron = new EventSource(API + '/stream?bron=stats');
            bron.onmessage = m => { try { opAlert(JSON.parse(m.data)); } catch { } };
            bron.onerror = () => { bron.close(); setTimeout(verbind, 5000); };
        })();
    }
    // testknoppen op de instelpagina (voorbeeld)
    addEventListener('message', m => { const d = m.data || {}; if (d.test) opAlert({ soort: d.test, naam: 'Test', extra: { ...(d.extra || {}), test: true } }); });

    haalStats(); haalLive();
    setInterval(haalStats, 10000);
    setInterval(haalLive, 60000);
    document.fonts.ready.then(() => { document.body.dataset.klaar = '1'; });
})();
</script>

<script type="module">
// 3D-naam onderaan voor ?stijl=3d: geëxtrudeerde letters met afgeschuinde randen, zacht wiegend, om de 12 s een salto.
// Eigen klein canvas (1200x300) op 30 fps, zodat het licht blijft op een mindere pc.
if (document.body.classList.contains('drie')) {
    try {
        const THREE = await import('three');
        const { FontLoader } = await import('three/addons/loaders/FontLoader.js');
        const { TextGeometry } = await import('three/addons/geometries/TextGeometry.js');
        const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');
        const cv = document.getElementById('naam3d');
        const r = new THREE.WebGLRenderer({ canvas: cv, alpha: true, antialias: true });
        r.setPixelRatio(1); r.setSize(1200, 300, false);
        r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
        const scene = new THREE.Scene();
        scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
        const cam = new THREE.PerspectiveCamera(30, 1200 / 300, 10, 3000); cam.position.set(0, 0, 640);
        const font = await new FontLoader().loadAsync('lilita.typeface.json');
        const geo = new TextGeometry('Demitje01', { font, size: 118, height: 36, depth: 36, curveSegments: 6, bevelEnabled: true, bevelThickness: 8, bevelSize: 4.5, bevelSegments: 4 });
        geo.center();
        const voor = new THREE.MeshPhysicalMaterial({ color: 0xeafeff, metalness: 0.15, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.15 });
        const zij = new THREE.MeshStandardMaterial({ color: 0x1e6bff, metalness: 0.55, roughness: 0.3 });
        const naam = new THREE.Mesh(geo, [voor, zij]);
        scene.add(naam);
        const zon = new THREE.DirectionalLight(0xffffff, 1.6); zon.position.set(-300, 400, 500); scene.add(zon);
        const glans = new THREE.PointLight(0x22e3d0, 4, 0, 0); scene.add(glans);
        document.body.classList.add('drie-ok');
        let vorige = 0;
        r.setAnimationLoop(nu => {
            if (nu - vorige < 32) return;
            vorige = nu;
            const t = nu / 1000, salto = t % 12;
            naam.rotation.y = Math.sin(t * 0.7) * 0.22;
            naam.rotation.x = Math.sin(t * 0.5) * 0.08 + (salto < 1.4 ? (1 - Math.cos(salto / 1.4 * Math.PI)) * Math.PI : 0);
            glans.position.set(Math.sin(t * 0.9) * 600, 80, 300);
            r.render(scene, cam);
        });
    } catch (err) { console.warn('3D-naam niet beschikbaar, platte naam blijft staan', err); document.body.classList.remove('drie-ok'); }
}
