<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alerts, Demitje01</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Lilita+One&family=Russo+One&display=swap" rel="stylesheet">
<style>
    /* Alerts voor Demitje01 in dezelfde drie stijlen als zijn overlay (?stijl=speels|neon|3d):
       speels = stuiterend kaartje met confetti, neon = oplichtende neonbuis met lichtstralen,
       3d = cartoon-3D: letters vallen één voor één naar binnen en stuiteren, met een omlijnd icoon en confetti.
       Live via api.gwnlarss.nl/api/streamer-alerts/demitje01/stream. 1920x1080, doorzichtig.
       ?voorbeeld=1 is voor de instelpagina (testknoppen via postMessage). */
    :root { --blauw: #1e6bff; --turq: #22e3d0; --diep: #062347; --grootte: 1; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; overflow: hidden; }
    body { font-family: 'Baloo 2', system-ui, sans-serif; }
    #podium { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
    #confetti { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    .plek { position: absolute; left: 50%; top: 110px; transform: translateX(-50%) scale(var(--grootte)); transform-origin: 50% 0; }

    /* ---------- speels ---------- */
    .kaart { position: relative; min-width: 760px; max-width: 1300px; padding: 30px 70px 34px; text-align: center; color: #fff; border-radius: 38px;
        background: linear-gradient(160deg, #1e6bff, #1aa8ff 50%, #22e3d0);
        box-shadow: 0 0 0 7px #fff, 0 0 0 13px #062347, 0 26px 50px rgba(0, 0, 0, 0.45); }
    .kaart .kop { font: 400 46px 'Lilita One', sans-serif; letter-spacing: 3px; color: #062347; line-height: 1; }
    .kaart .naam { font: 400 124px 'Lilita One', sans-serif; line-height: 1.05; white-space: nowrap; }
    .kaart .naam .l { display: inline-block; text-shadow: 0 6px 0 #062347, 0 0 2px #062347; -webkit-text-stroke: 3px #062347; paint-order: stroke fill; }
    .kaart .regel { font-size: 34px; font-weight: 800; line-height: 1.2; max-width: 1100px; margin: 4px auto 0; color: #eafffd; text-shadow: 0 2px 0 rgba(6, 35, 71, 0.6); }
    .kaart .ikoon { position: absolute; left: -46px; top: -46px; width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center;
        background: #fff; box-shadow: 0 0 0 7px #062347, 0 10px 20px rgba(0, 0, 0, 0.35); transform: rotate(-14deg); }
    .kaart .ikoon svg { width: 70px; height: 70px; fill: #ff4f8b; }
    .speels .kaart.in { animation: valIn 0.9s cubic-bezier(.2, 1.5, .4, 1) both; }
    .speels .kaart.in .l { animation: letterIn 0.6s cubic-bezier(.2, 1.8, .4, 1) both, golf 2.4s ease-in-out 1.2s infinite; animation-delay: calc(0.35s + var(--i) * 0.05s), calc(1.2s + var(--i) * 0.08s); }
    .speels .kaart.in .ikoon { animation: draai 1.2s ease 0.5s both; }
    .speels .kaart.uit { animation: valUit 0.55s cubic-bezier(.5, 0, .9, .4) both; }
    @keyframes valIn { from { transform: translateY(-900px) rotate(-6deg); } to { transform: none; } }
    @keyframes valUit { to { transform: translateY(-900px) rotate(5deg) scale(0.8); } }
    @keyframes letterIn { from { transform: translateY(60px) scale(0.2); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes golf { 0%, 100% { transform: none; } 30% { transform: translateY(-12px) rotate(-3deg); } }
    @keyframes draai { from { transform: rotate(-200deg) scale(0); } to { transform: rotate(-14deg) scale(1); } }

    /* ---------- neon ---------- */
    .neon .kaart { background: rgba(3, 10, 26, 0.92); border-radius: 18px;
        box-shadow: 0 0 0 3px #5ff6ff, 0 0 30px 6px rgba(34, 227, 208, 0.85), 0 0 90px 20px rgba(30, 107, 255, 0.45), inset 0 0 40px rgba(34, 227, 208, 0.3); }
    .neon .kaart .kop { font-family: 'Russo One', sans-serif; color: #5ff6ff; text-shadow: 0 0 12px #22e3d0; }
    .neon .kaart .naam { font-family: 'Russo One', sans-serif; font-size: 112px; letter-spacing: 3px; }
    .neon .kaart .naam .l { -webkit-text-stroke: 0; color: #fff; text-shadow: 0 0 6px #fff, 0 0 20px #5ff6ff, 0 0 50px #22e3d0, 0 0 90px #1e6bff; }
    .neon .kaart .regel { color: #bff9ff; text-shadow: 0 0 10px rgba(95, 246, 255, 0.6); font-family: 'Russo One', sans-serif; font-weight: 400; font-size: 30px; }
    .neon .kaart .ikoon { background: #030a1a; box-shadow: 0 0 0 4px #5ff6ff, 0 0 26px 6px rgba(34, 227, 208, 0.85); transform: none; }
    .neon .kaart .ikoon svg { fill: none; stroke: #5ff6ff; stroke-width: 1.6; filter: drop-shadow(0 0 6px #5ff6ff); }
    .neon .kaart.in { animation: buisAan 0.8s ease-out both; }
    .neon .kaart.in .kop, .neon .kaart.in .regel { animation: flikker 0.9s steps(1) 0.6s both; }
    .neon .kaart.in .naam { animation: glitch 0.7s steps(2) 0.7s both; }
    .neon .kaart.uit { animation: buisUit 0.5s ease-in both; }
    @keyframes buisAan { 0% { clip-path: inset(48% 50% 48% 50%); opacity: 0; } 35% { clip-path: inset(48% 0 48% 0); opacity: 1; } 100% { clip-path: inset(-60px -60px -60px -60px); } }
    @keyframes buisUit { 0% { clip-path: inset(-60px -60px -60px -60px); } 60% { clip-path: inset(48% 0 48% 0); opacity: 1; } 100% { clip-path: inset(48% 50% 48% 50%); opacity: 0; } }
    @keyframes flikker { 0% { opacity: 0; } 20% { opacity: 1; } 30% { opacity: 0.2; } 45% { opacity: 1; } 55% { opacity: 0.4; } 70%, 100% { opacity: 1; } }
    @keyframes glitch { 0% { opacity: 0; transform: translateX(-30px) skewX(20deg); filter: hue-rotate(90deg); } 40% { opacity: 1; transform: translateX(18px) skewX(-12deg); }
        70% { transform: translateX(-6px); filter: none; } 100% { transform: none; opacity: 1; } }

    /* ---------- 3d: three.js tekent naam, kop, icoon en confetti; de regel (bericht) blijft gewone tekst ---------- */
    #drie { position: absolute; inset: 0; width: 1920px; height: 1080px; display: none; }
    .drie #drie { display: block; }
    .regel3d { position: absolute; left: 50%; top: 610px; transform: translateX(-50%); max-width: 1200px; text-align: center; white-space: normal;
        font: 800 38px 'Baloo 2', sans-serif; color: #fff; padding: 6px 30px; border-radius: 999px;
        background: #1e6bff; box-shadow: 0 0 0 5px #062347, 8px 8px 0 5px #062347;
        opacity: 0; transition: opacity 0.4s, transform 0.4s; }
    .regel3d.aan { opacity: 1; transform: translateX(-50%) translateY(-8px); }
</style></style>
</head>
<body>
<div id="podium">
    <canvas id="drie" width="1920" height="1080"></canvas>
    <canvas id="confetti" width="1920" height="1080"></canvas>
    <div id="toneel"></div>
</div>
<script>
(() => {
    const W = 1920, H = 1080;
    const q = new URLSearchParams(location.search);
    const LOGIN = 'demitje01', API = 'https://api.gwnlarss.nl/api/streamer-alerts/' + LOGIN;
    const VOORBEELD = q.get('voorbeeld') === '1';
    const STIJL = q.get('stijl') === 'neon' ? 'neon' : ['3d', 'weg'].includes(q.get('stijl')) ? 'drie' : 'speels';   // oude ?stijl=weg wordt 3d
    document.body.classList.add(STIJL);

    const podium = document.getElementById('podium');
    function pas() {
        const s = Math.min(innerWidth / W, innerHeight / H);
        podium.style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - H * s) / 2}px) scale(${s})`;
    }
    addEventListener('resize', pas); pas();

    // ---------- teksten en niveau (meer confetti bij grotere alerts) ----------
    const geld = (b, v) => { try { return new Intl.NumberFormat('nl-NL', { style: 'currency', currency: v || 'EUR', maximumFractionDigits: 2 }).format(+b); } catch { return '€' + b; } };
    const getal = n => (+n || 0).toLocaleString('nl-NL');
    function tekst(e) {
        const x = e.extra || {};
        switch (e.soort) {
            case 'follower': return ['NIEUWE VOLGER', 'Welkom bij de stream!'];
            case 'subscriber': return [x.tier > 1 ? 'NIEUWE SUB · TIER ' + x.tier : 'NIEUWE SUB', 'Bedankt voor je steun!'];
            case 'resub': return [getal(x.maanden) + ' MAANDEN SUB', x.bericht || 'Nog steeds aan boord!'];
            case 'gift': return [getal(x.aantal) + (x.aantal == 1 ? ' SUB' : ' SUBS') + ' CADEAU', 'Wat een held!'];
            case 'cheer': return [getal(x.bits) + ' BITS', x.bericht || ''];
            case 'raid': return ['RAID · ' + getal(x.kijkers) + ' KIJKERS', 'Welkom allemaal!'];
            case 'donatie': return ['DONATIE · ' + geld(x.bedrag, x.valuta), x.bericht || ''];
        }
        return ['BEDANKT', ''];
    }
    const trap = (w, grenzen) => grenzen.filter(g => w >= g).length;
    function niveau(e) {
        const x = e.extra || {};
        if (e.soort === 'gift') return trap(+x.aantal, [5, 10, 20, 50, 100]);
        if (e.soort === 'cheer') return trap(+x.bits, [500, 1000, 5000, 10000, 25000]);
        if (e.soort === 'raid') return trap(+x.kijkers, [10, 25, 50, 100, 250]);
        if (e.soort === 'donatie') return trap(+x.bedrag, [5, 10, 25, 50, 100]);
        if (e.soort === 'resub') return trap(+x.maanden, [6, 12, 24, 36, 60]);
        if (e.soort === 'subscriber') return (+x.tier || 1) - 1;
        return 0;
    }
    const HART = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.3 8.3 2.4 4 6.4 4c2.3 0 4 1.3 5.6 3.3C13.6 5.3 15.3 4 17.6 4c4 0 6.1 4.3 4.4 7.7C19.5 16.4 12 21 12 21z"/></svg>';
    const STER = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
    const DIAMANT = '<svg viewBox="0 0 24 24"><path d="M12 2l7 7-7 13L5 9z"/></svg>';
    const PIJL = '<svg viewBox="0 0 24 24"><path d="M3 10h11V5l7 7-7 7v-5H3z"/></svg>';
    const MUNT = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>';
    const IKOON = { follower: STER, subscriber: HART, resub: HART, gift: HART, cheer: DIAMANT, raid: PIJL, donatie: MUNT };
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ---------- confetti / stralen ----------
    const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
    const deeltjes = [];
    const KLEUREN = { speels: ['#ffffff', '#22e3d0', '#1e6bff', '#ff4f8b', '#ffd84a'], neon: ['#5ff6ff', '#ffffff', '#1e6bff'], drie: ['#ffffff', '#22e3d0', '#1e6bff'] };
    // zijn eigen kanaal-emotes (via api.gwnlarss.nl, plaatjes rechtstreeks van Twitch)
    const EMOTES = [];
    fetch(API + '/emotes').then(r => r.json()).then(d => (d.emotes || []).forEach(e => { const i = new Image(); i.src = e.url; EMOTES.push(i); })).catch(() => { });
    function emoteRegen(n, x0, y0) {
        const klaar = EMOTES.filter(i => i.complete && i.naturalWidth);
        if (!klaar.length) { if (!emoteRegen.opnieuw) { emoteRegen.opnieuw = 1; setTimeout(() => emoteRegen(n, x0, y0), 900); } return; }
        for (let i = 0; i < n; i++) {
            const img = klaar[Math.floor(Math.random() * klaar.length)], b = 90 + Math.random() * 70;
            if (STIJL === 'neon') {
                const h = Math.random() * 6.28, v = 4 + Math.random() * 9;
                deeltjes.push({ emote: img, neon: 1, x: x0, y: y0, vx: Math.cos(h) * v, vy: Math.sin(h) * v * 0.7, leven: 1.4, b, draai: 0, vd: (Math.random() - 0.5) * 0.06 });
            } else {
                deeltjes.push({ emote: img, x: 80 + Math.random() * (W - 160), y: -120 - Math.random() * 1500, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 2.5, b, leven: 1, draai: (Math.random() - 0.5) * 0.6, vd: (Math.random() - 0.5) * 0.04, valt: 1 });
            }
        }
        if (!loopt) { loopt = true; vorigeT = 0; requestAnimationFrame(teken); }
    }
    function strooi(n, x0, y0) {
        const k = KLEUREN[STIJL];
        for (let i = 0; i < n; i++) {
            if (STIJL === 'neon') {
                const h = Math.random() * 6.28, v = 10 + Math.random() * 22;
                deeltjes.push({ neon: 1, x: x0, y: y0, vx: Math.cos(h) * v, vy: Math.sin(h) * v * 0.7, leven: 1, kleur: k[i % k.length] });
            } else {
                deeltjes.push({ x: x0 + (Math.random() - 0.5) * 900, y: y0 - Math.random() * 300, vx: (Math.random() - 0.5) * 8, vy: -4 - Math.random() * 10,
                    draai: Math.random() * 6.28, vd: (Math.random() - 0.5) * 0.4, b: 10 + Math.random() * 12, leven: 1, kleur: k[i % k.length] });
            }
        }
        if (!loopt) { loopt = true; vorigeT = 0; requestAnimationFrame(teken); }
    }
    let loopt = false;
    const gloed = (() => {
        const c = document.createElement('canvas'); c.width = c.height = 128;
        const g = c.getContext('2d'), rg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
        rg.addColorStop(0, 'rgba(95,246,255,0.75)'); rg.addColorStop(0.5, 'rgba(34,227,208,0.25)'); rg.addColorStop(1, 'rgba(34,227,208,0)');
        g.fillStyle = rg; g.fillRect(0, 0, 128, 128); return c;
    })();
    let vorigeT = 0;
    function teken(nu) {
        const k = vorigeT && nu ? Math.min(3, (nu - vorigeT) / 16.7) : 1;   // 1 = één stap van 60 fps
        vorigeT = nu || 0;
        cx.clearRect(0, 0, W, H);
        for (let i = deeltjes.length - 1; i >= 0; i--) {
            const d = deeltjes[i];
            if (d.emote) {
                if (d.valt) { d.vy = Math.min(d.vy + 0.05 * k, 5); d.y += d.vy * k; d.x += d.vx * k; if (d.y > H + 200) d.leven = 0; }
                else { d.x += d.vx * k; d.y += d.vy * k; d.vx *= Math.pow(0.985, k); d.vy *= Math.pow(0.985, k); d.leven -= 0.008 * k; }
                d.draai += d.vd * k;
                cx.globalAlpha = Math.min(1, Math.max(0, d.leven));
                if (d.neon) cx.drawImage(gloed, d.x - d.b, d.y - d.b, d.b * 2, d.b * 2);
                cx.save(); cx.translate(d.x, d.y); cx.rotate(d.draai); cx.drawImage(d.emote, -d.b / 2, -d.b / 2, d.b, d.b); cx.restore();
                if (d.leven <= 0) deeltjes.splice(i, 1);
                continue;
            }
            if (d.neon) {
                const ox = d.x, oy = d.y;
                d.x += d.vx * k; d.y += d.vy * k; d.vx *= Math.pow(0.95, k); d.vy *= Math.pow(0.95, k); d.leven -= 0.018 * k;
                // gloed zonder shadowBlur: een brede doorzichtige streep onder een dunne felle
                cx.strokeStyle = d.kleur; cx.beginPath(); cx.moveTo(ox - d.vx * 2, oy - d.vy * 2); cx.lineTo(d.x, d.y);
                cx.globalAlpha = Math.max(0, d.leven) * 0.25; cx.lineWidth = 12; cx.stroke();
                cx.globalAlpha = Math.max(0, d.leven); cx.lineWidth = 3; cx.stroke();
            } else {
                d.vy = Math.min(d.vy + 0.16 * k, 3.2); d.vx = d.vx * Math.pow(0.98, k) + Math.sin(d.draai * 2) * 0.12 * k; d.x += d.vx * k; d.y += d.vy * k; d.draai += d.vd * k;   // dwarrelen
                if (d.y > H + 40) d.leven = 0;
                cx.globalAlpha = 1; cx.fillStyle = d.kleur;
                cx.save(); cx.translate(d.x, d.y); cx.rotate(d.draai); cx.fillRect(-d.b / 2, -d.b / 4, d.b, d.b / 2); cx.restore();
            }
            if (d.leven <= 0) deeltjes.splice(i, 1);
        }
        cx.globalAlpha = 1;
        if (deeltjes.length) requestAnimationFrame(teken); else { loopt = false; cx.clearRect(0, 0, W, H); }
    }

    // ---------- geluid: eigen geluid van de server, anders een korte klank per stijl ----------
    let instellingen = { volume: 0.7, duur: 7000, grootte: 1 }, geluiden = {};
    let ac = null;
    function klank(volume) {
        try {
            ac = ac || new (window.AudioContext || window.webkitAudioContext)();
            const nu = ac.currentTime, uit = ac.createGain(); uit.gain.value = volume * 0.5; uit.connect(ac.destination);
            const toon = (f, start, lengte, type = 'triangle', piek = 0.6) => {
                const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f;
                g.gain.setValueAtTime(0, nu + start); g.gain.linearRampToValueAtTime(piek, nu + start + 0.02); g.gain.exponentialRampToValueAtTime(0.001, nu + start + lengte);
                o.connect(g); g.connect(uit); o.start(nu + start); o.stop(nu + start + lengte + 0.05); return o;
            };
            if (STIJL === 'speels') [523, 659, 784, 1047, 1319].forEach((f, i) => toon(f, i * 0.08, 0.35));
            else if (STIJL === 'neon') { const o = toon(180, 0, 0.7, 'sawtooth', 0.25); o.frequency.exponentialRampToValueAtTime(1400, nu + 0.5); [659, 988, 1319].forEach(f => toon(f, 0.45, 0.8, 'sine', 0.35)); }
            else {   // 3d: aanzwellende zoef naar een klokkend akkoord
                const o = toon(220, 0, 0.6, 'sine', 0.3); o.frequency.exponentialRampToValueAtTime(880, nu + 0.55);
                [784, 988, 1175, 1568].forEach((f, i) => toon(f, 0.55 + i * 0.05, 1.2, 'sine', 0.3));
            }
        } catch { }
    }
    function geluid(soort) {
        const v = instellingen.volume ?? 0.7;
        if (geluiden[soort]) { const a = new Audio(`${API}/geluid/${soort}?v=${geluiden[soort]}`); a.volume = v; a.play().catch(() => klank(v)); }
        else klank(v);
    }
    const haalInstellingen = () => fetch(API, { cache: 'no-store' }).then(r => r.json()).then(d => {
        if (d?.instellingen) instellingen = d.instellingen; geluiden = d?.geluiden ?? {};
        document.documentElement.style.setProperty('--grootte', Math.min(1.3, instellingen.grootte ?? 1));
    }).catch(() => { });

    // ---------- tonen ----------
    const toneel = document.getElementById('toneel');
    const wachtrij = []; let bezig = false;
    const wacht = ms => new Promise(r => setTimeout(r, ms));
    function letters(naam) { return [...naam].map((c, i) => `<span class="l" style="--i:${i}">${c === ' ' ? '&nbsp;' : esc(c)}</span>`).join(''); }
    async function volgende() {
        if (bezig || !wachtrij.length) return;
        bezig = true;
        const e = wachtrij.shift(), [kop, regel] = tekst(e), n = niveau(e), duur = Math.max(4000, instellingen.duur ?? 7000);
        const aantal = Math.min(420, 90 * (1 + n * 0.8));
        if (STIJL === 'drie' && window.drie3D) {
            const regelEl = document.createElement('div'); regelEl.className = 'regel3d'; regelEl.textContent = regel; toneel.append(regelEl);
            geluid(e.soort);
            await window.drie3D.toon(e.soort, kop, e.naam, n, duur, () => { if (regel) regelEl.classList.add('aan'); }, () => regelEl.classList.remove('aan'));
        } else {
            toneel.innerHTML = `<div class="plek"><div class="kaart in"><div class="ikoon">${IKOON[e.soort] || STER}</div><div class="kop">${esc(kop)}</div>
                <div class="naam">${letters(e.naam)}</div>${regel ? `<div class="regel">${esc(regel)}</div>` : ''}</div></div>`;
            const k = toneel.querySelector('.kaart');
            geluid(e.soort);
            await wacht(STIJL === 'neon' ? 500 : 450);
            strooi(STIJL === 'neon' ? Math.min(160, 40 + n * 24) : aantal, W / 2, STIJL === 'neon' ? 260 : 120);
            emoteRegen(Math.min(60, 8 + n * 9), W / 2, 260);
            if (n >= 3) { await wacht(900); strooi(STIJL === 'neon' ? 80 : aantal / 2, W / 2, STIJL === 'neon' ? 260 : 80); }
            await wacht(duur - (n >= 3 ? 1900 : 1000));
            k.classList.remove('in'); k.classList.add('uit');
            await wacht(600);
        }
        toneel.innerHTML = '';
        bezig = false;
        setTimeout(volgende, 400);
    }
    function nieuw(e) { wachtrij.push(e); volgende(); }

    // testknoppen van de instelpagina (voorbeeld), zonder server
    const TEST = { follower: ['TestVolger', {}], subscriber: ['TestSub', { tier: 1 }], resub: ['TestResub', { maanden: 12, bericht: 'Al een jaar fan!' }],
        gift: ['TestGifter', { aantal: 5 }], cheer: ['TestBits', { bits: 1000, bericht: 'Lets gooo!' }], raid: ['TestRaider', { kijkers: 42 }],
        donatie: ['TestDonateur', { bedrag: 5, valuta: 'EUR', bericht: 'Voor de stream!' }] };
    addEventListener('message', m => {
        const d = m.data || {};
        if (d.test && TEST[d.test]) nieuw({ soort: d.test, naam: TEST[d.test][0], extra: { ...TEST[d.test][1], ...(d.extra || {}) } });
        if (d.volume != null) instellingen.volume = +d.volume;
    });

    haalInstellingen();
    function verbind() {
        const bron = new EventSource(API + '/stream?bron=' + (VOORBEELD ? 'voorbeeld' : 'alerts'));
        bron.onmessage = m => {
            try {
                const d = JSON.parse(m.data);
                if (d.soort === '_instellingen') { instellingen = d.instellingen ?? instellingen; geluiden = d.geluiden ?? {}; document.documentElement.style.setProperty('--grootte', Math.min(1.3, instellingen.grootte ?? 1)); return; }
                if (VOORBEELD && !d.extra?.test) return;   // op de instelpagina alleen tests laten zien
                nieuw(d);
            } catch { }
        };
        bron.onerror = () => { bron.close(); setTimeout(verbind, 5000); };
    }
    verbind();
    document.fonts.ready.then(() => { document.body.dataset.klaar = '1'; });
    window.drieKlaar = () => volgende();
    window.toonTest = s => nieuw({ soort: s, naam: TEST[s][0], extra: TEST[s][1] });   // voor screenshots
})();

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
// 3D-alerts in cartoon-3D: de letters van kop en naam vallen één voor één naar binnen en stuiteren, een
// omlijnd icoon ploft erboven, cartoonconfetti en zijn emotes spatten eruit. Rendert alleen tijdens een alert.
if (document.body.classList.contains('drie')) {
    try {
        const THREE = await import('three');
        const { FontLoader } = await import('three/addons/loaders/FontLoader.js');
        const { TextGeometry } = await import('three/addons/geometries/TextGeometry.js');
        const font = await new FontLoader().loadAsync('lilita.typeface.json');
        // ---- cartoon-3D (cel-shading): matte kleurvlakken met harde overgangen en een donkere omlijning ----
        const { mergeVertices } = await import('three/addons/utils/BufferGeometryUtils.js');
        const verloop = new THREE.DataTexture(new Uint8Array([110, 190, 255]), 3, 1, THREE.RedFormat);
        verloop.minFilter = verloop.magFilter = THREE.NearestFilter; verloop.needsUpdate = true;
        const toon = c => new THREE.MeshToonMaterial({ color: c, gradientMap: verloop });
        // omlijning: dezelfde vorm iets opgeblazen langs gladde normalen, alleen de achterkant, donkerblauw
        const lijnMat = d => new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: { d: { value: d } },
            vertexShader: 'uniform float d; void main() { gl_Position = projectionMatrix * modelViewMatrix * vec4(position + normal * d, 1.0); }',
            fragmentShader: 'void main() { gl_FragColor = vec4(0.024, 0.137, 0.278, 1.0); }' });
        function metLijn(geo, mat, d) {
            const g = new THREE.Group();
            const glad = mergeVertices(geo.clone().deleteAttribute('normal').deleteAttribute('uv'), 0.5); glad.computeVertexNormals();
            g.add(new THREE.Mesh(glad, lijnMat(d)), new THREE.Mesh(geo, mat));
            return g;
        }
        // tekst als losse letters (elk met eigen draaipunt onderaan het midden), zodat ze kunnen springen en indeuken;
        // de tussenruimte wordt aan de letter zelf gemeten (de advance-breedtes in het lettertypebestand kloppen niet)
        function letters(tekst, size, voorKleur, zijKleur) {
            const groep = new THREE.Group(), mats = [toon(voorKleur), toon(zijKleur)];
            let x = 0; const lijst = [];
            for (const c of [...tekst]) {
                if (!c.trim()) { x += size * 0.3; continue; }
                {
                    const geo = new TextGeometry(c, { font, size, height: size * 0.32, depth: size * 0.32, curveSegments: 5, bevelEnabled: true, bevelThickness: size * 0.05, bevelSize: size * 0.03, bevelSegments: 2 });
                    geo.computeBoundingBox();
                    const { min, max } = geo.boundingBox, breed = max.x - min.x;
                    // letters met een haakje naar links (zoals de j) schuiven onder de vorige door; de afschuining telt niet mee
                    x += Math.min(0, min.x + size * 0.03);
                    geo.translate(-(min.x + max.x) / 2, 0, -max.z / 2);
                    const l = metLijn(geo, mats, size * 0.045);
                    l.position.x = x + breed / 2;
                    groep.add(l); lijst.push(l);
                    x += breed + size * 0.05;   // breedte van de letter zelf plus een kleine tussenruimte
                }
            }
            x -= size * 0.05;
            for (const l of lijst) l.position.x -= x / 2;
            groep.userData.letters = lijst; groep.userData.breedte = x;
            return groep;
        }
        // spring + indeuken: p loopt van 0 tot 1
        function hop(l, p, hoogte) {
            if (p <= 0 || p >= 1) { l.position.y = 0; l.scale.set(1, 1, 1); l.rotation.z = 0; return; }
            const sprong = Math.sin(p * Math.PI);
            l.position.y = sprong * hoogte;
            const deuk = p < 0.12 ? (0.12 - p) / 0.12 : p > 0.88 ? (p - 0.88) / 0.12 : 0;   // indeuken bij afzet en landing
            l.scale.set(1 + deuk * 0.22, 1 - deuk * 0.28 + sprong * 0.08, 1 + deuk * 0.22);
            l.rotation.z = Math.sin(p * Math.PI * 2) * 0.12;
        }

        const r = new THREE.WebGLRenderer({ canvas: document.getElementById('drie'), alpha: true, antialias: true });
        r.setPixelRatio(Math.min(1, devicePixelRatio)); r.setSize(1920, 1080, false); r.outputColorSpace = THREE.SRGBColorSpace;
        const scene = new THREE.Scene();
        const cam = new THREE.PerspectiveCamera(35, 1920 / 1080, 10, 8000); cam.position.set(0, 120, 1400); cam.lookAt(0, 60, 0);
        scene.add(new THREE.AmbientLight(0xffffff, 1.1));
        const zon = new THREE.DirectionalLight(0xffffff, 2.2); zon.position.set(-0.6, 1, 0.9); scene.add(zon);

        // iconen als platte cartoonvormen met dikte en omlijning
        function vorm(soort) {
            const s = new THREE.Shape();
            if (soort === 'follower') { for (let i = 0; i < 10; i++) { const a = Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 28 : 64; s[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr); } }
            else if (soort === 'cheer') { s.moveTo(0, 62); s.lineTo(46, 12); s.lineTo(0, -62); s.lineTo(-46, 12); }
            else if (soort === 'raid') { s.moveTo(-60, 16); s.lineTo(10, 16); s.lineTo(10, 46); s.lineTo(62, 0); s.lineTo(10, -46); s.lineTo(10, -16); s.lineTo(-60, -16); }
            else if (soort === 'donatie') { s.absarc(0, 0, 56, 0, Math.PI * 2, false); }
            else { s.moveTo(0, -50); s.bezierCurveTo(-30, -26, -62, -6, -62, 22); s.bezierCurveTo(-62, 46, -40, 58, -22, 58); s.bezierCurveTo(-10, 58, -2, 50, 0, 40);
                   s.bezierCurveTo(2, 50, 10, 58, 22, 58); s.bezierCurveTo(40, 58, 62, 46, 62, 22); s.bezierCurveTo(62, -6, 30, -26, 0, -50); }
            const g = new THREE.ExtrudeGeometry(s, { depth: 30, bevelEnabled: true, bevelThickness: 6, bevelSize: 4, bevelSegments: 2, curveSegments: 16 });
            g.center();
            const kleur = { follower: 0xffd84a, cheer: 0xb06bff, raid: 0x22e3d0, donatie: 0xffd84a }[soort] ?? 0xff4f8b;
            return metLijn(g, toon(kleur), 6);
        }
        // cartoonconfetti
        const MAX = 500, conf = new THREE.InstancedMesh(new THREE.BoxGeometry(16, 9, 3), toon(0xffffff), MAX);
        conf.instanceMatrix.setUsage(THREE.DynamicDrawUsage); conf.count = 0; conf.frustumCulled = false; scene.add(conf);
        const KL = [0xffffff, 0x22e3d0, 0x1e6bff, 0xff4f8b, 0xffd84a].map(c => new THREE.Color(c));
        let stukjes = [];
        const hulp = new THREE.Object3D();
        function strooi3d(n, y) {
            for (let i = 0; i < n && stukjes.length < MAX; i++) {
                const a = Math.random() * Math.PI * 2, v = 8 + Math.random() * 18;
                stukjes.push({ p: new THREE.Vector3(0, y, 0), v: new THREE.Vector3(Math.cos(a) * v, Math.sin(a) * v * 0.8 + 10, (Math.random() - 0.5) * 20), r: new THREE.Euler(Math.random() * 6, Math.random() * 6, 0), vr: Math.random() * 0.3, k: KL[i % KL.length] });
            }
            start();
        }
        // zijn emotes als plaatjes die mee wegspatten (achter de letters)
        const emoteMat = [], sprites = [];
        fetch('https://api.gwnlarss.nl/api/streamer-alerts/demitje01/emotes').then(r => r.json()).then(d => {
            const tl = new THREE.TextureLoader(); tl.setCrossOrigin('anonymous');
            (d.emotes || []).forEach(e => tl.load(e.url, tex => { tex.colorSpace = THREE.SRGBColorSpace; emoteMat.push(new THREE.SpriteMaterial({ map: tex, transparent: true })); }));
        }).catch(() => { });
        function emotes3d(n, y) {
            for (let i = 0; i < n && emoteMat.length; i++) {
                const sp = new THREE.Sprite(emoteMat[Math.floor(Math.random() * emoteMat.length)]);
                const a = Math.random() * Math.PI * 2, v = 6 + Math.random() * 14, b = 110 + Math.random() * 70;
                sp.scale.set(b, b, 1); sp.position.set(0, y, -160);
                sp.userData.v = new THREE.Vector3(Math.cos(a) * v, Math.sin(a) * v * 0.7 + 12, -4 - Math.random() * 14);
                scene.add(sp); sprites.push(sp);
            }
            start();
        }

        let groep = null, anim = null, loopt = false, vorige = 0;
        function stap(nu) {
            const k = vorige ? Math.min(3, (nu - vorige) / 16.7) : 1;   // beweging gelijk bij elke beeldsnelheid
            vorige = nu;
            if (groep && anim) {
                const a = (nu - anim.start) / 1000, eind = anim.duur / 1000, { kop, naam, icoon } = groep.userData;
                const alle = [...kop.userData.letters, ...naam.userData.letters];
                if (a < eind - 0.9) {
                    // binnenvallen: elke letter valt van boven, landt met een deuk en stuitert nog even na
                    alle.forEach((l, i) => {
                        const s = a - 0.05 * i;
                        if (s < 0) { l.visible = false; return; }
                        l.visible = true;
                        if (s < 0.4) { const p = s / 0.4; l.position.y = (1 - p * p) * 800; l.scale.set(0.85, 1.25, 0.85); l.rotation.z = 0; }
                        else hop(l, (s - 0.4) / 0.45, 70 * Math.max(0, 1 - (s - 0.4) * 1.6));
                        if (s > 1.4) hop(l, ((a + i * 0.09) % 3.2) / 0.5, 30);   // daarna af en toe een golfje
                    });
                    // icoon ploft erin en wiebelt
                    const ip = Math.min(1, Math.max(0, (a - 0.3) / 0.35));
                    icoon.scale.setScalar(ip < 1 ? ip * 1.25 : 1 + Math.sin(a * 6) * 0.05);
                    icoon.rotation.z = Math.sin(a * 3.2) * 0.22; icoon.rotation.y = Math.sin(a * 1.7) * 0.5;
                    if (a > 1.2 && !anim.regelAan) { anim.regelAan = true; anim.bijAan(); }
                } else {
                    // weg: elke letter springt nog één keer op en valt dan uit beeld
                    if (!anim.regelUit) { anim.regelUit = true; anim.bijUit(); }
                    const w = a - (eind - 0.9);
                    alle.forEach((l, i) => { const s = Math.max(0, w - 0.03 * i); l.position.y = s * 900 - s * s * 2600; l.rotation.z = s * 2 * (i % 2 ? 1 : -1); });
                    icoon.scale.setScalar(Math.max(0, 1 - w * 2));
                }
                if (a >= eind) { scene.remove(groep); groep.traverse(o => o.geometry?.dispose()); groep = null; const k = anim.klaar; anim = null; k(); }
            }
            for (const d of stukjes) { d.v.y -= 0.45 * k; d.v.multiplyScalar(Math.pow(0.985, k)); d.p.addScaledVector(d.v, k); d.r.x += d.vr * k; d.r.y += d.vr * 0.7 * k; }
            stukjes = stukjes.filter(d => d.p.y > -700);
            stukjes.forEach((d, i) => { hulp.position.copy(d.p); hulp.rotation.copy(d.r); hulp.updateMatrix(); conf.setMatrixAt(i, hulp.matrix); conf.setColorAt(i, d.k); });
            conf.count = stukjes.length; conf.instanceMatrix.needsUpdate = true; if (conf.instanceColor) conf.instanceColor.needsUpdate = true;
            for (let i = sprites.length - 1; i >= 0; i--) {
                const sp = sprites[i]; sp.userData.v.y -= 0.35 * k; sp.userData.v.multiplyScalar(Math.pow(0.99, k)); sp.position.addScaledVector(sp.userData.v, k);
                if (sp.position.y < -900) { scene.remove(sp); sprites.splice(i, 1); }
            }
            r.render(scene, cam);
            if (!groep && !stukjes.length && !sprites.length) { r.setAnimationLoop(null); loopt = false; r.clear(); }
        }
        function start() { if (!loopt) { loopt = true; vorige = 0; r.setAnimationLoop(stap); } }

        window.drie3D = {
            toon(soort, kop, naam, niveau, duur, bijAan, bijUit) {
                return new Promise(klaar => {
                    groep = new THREE.Group(); groep.position.y = 0;
                    const n = letters(naam, 136, 0xffffff, 0x1e6bff);
                    if (n.userData.breedte > 1500) n.scale.setScalar(1500 / n.userData.breedte);
                    const k = letters(kop, 58, 0xffe66b, 0x062347); k.position.y = 175;
                    const ic = vorm(soort); ic.position.set(0, 300, 0); ic.scale.setScalar(0);
                    groep.add(n, k, ic); groep.userData = { kop: k, naam: n, icoon: ic };
                    [...k.userData.letters, ...n.userData.letters].forEach(l => (l.visible = false));
                    scene.add(groep);
                    anim = { start: performance.now(), duur, klaar, bijAan, bijUit };
                    start();
                    setTimeout(() => { strooi3d(Math.min(MAX, 120 + niveau * 70), 80); emotes3d(Math.min(50, 8 + niveau * 8), 80); }, 900);
                    if (niveau >= 3) setTimeout(() => strooi3d(160, 80), 1800);
                });
            },
        };
        window.drieKlaar?.();
    } catch (err) { console.warn('3D-alerts niet beschikbaar, terug naar het platte kaartje', err); document.body.classList.add('speels'); }
}
