<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scène, Demitje01</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Lilita+One&family=Russo+One&display=swap" rel="stylesheet">
<style>
    /* Volledige scènes voor Demitje01 (1920x1080, met achtergrond): ?scene=start|pauze|einde,
       ?stijl=speels|neon|3d, ?min=5 voor een aftelklok bij start, ?logo= / ?foto=0 zoals de overlay.
       Toont ook zijn laatste volger en sub. */
    :root { --blauw: #1e6bff; --turq: #22e3d0; --diep: #041634; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: var(--diep); }
    body { font-family: 'Baloo 2', system-ui, sans-serif; color: #fff; }
    #podium { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
    #achter, #drie { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #drie { display: none; }
    .inhoud { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .foto { width: 250px; height: 250px; border-radius: 50%; padding: 10px; margin-bottom: 26px;
        background: conic-gradient(from 200deg, var(--blauw), var(--turq), #c9fff8, var(--blauw));
        box-shadow: 0 0 0 6px #fff, 0 20px 40px rgba(0, 0, 0, 0.45), 0 0 60px rgba(34, 227, 208, 0.5); animation: zweef 5s ease-in-out infinite; }
    .foto img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background: var(--diep); }
    .foto.leeg { background: transparent; box-shadow: inset 0 0 0 10px var(--blauw), 0 0 0 6px #fff; }
    .foto.leeg img { visibility: hidden; }
    @keyframes zweef { 50% { transform: translateY(-14px); } }
    .titel { font: 400 132px 'Lilita One', sans-serif; line-height: 1; letter-spacing: 2px; }
    .titel .l { display: inline-block; animation: hup 4s ease-in-out infinite; animation-delay: calc(var(--i) * 0.06s); }
    @keyframes hup { 0%, 20%, 100% { transform: none; } 8% { transform: translateY(-26px) rotate(-4deg); } 14% { transform: translateY(4px); } }
    .sub { font-size: 44px; font-weight: 800; margin-top: 14px; opacity: 0.95; min-height: 60px; }
    .klok { font: 400 120px 'Lilita One', sans-serif; margin-top: 8px; letter-spacing: 4px; font-variant-numeric: tabular-nums; }
    .klok[hidden] { display: none; }
    .naam { position: absolute; left: 60px; top: 46px; font: 400 54px 'Lilita One', sans-serif; letter-spacing: 1px; }
    .chips { position: absolute; bottom: 54px; left: 0; right: 0; display: flex; justify-content: center; gap: 30px; }
    .chip { padding: 12px 34px 10px; border-radius: 20px; text-align: center; min-width: 320px;
        background: rgba(4, 22, 52, 0.75); box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.85), 0 0 0 7px var(--blauw), 0 14px 30px rgba(0, 0, 0, 0.4); }
    .chip .label { font: 400 24px 'Lilita One', sans-serif; letter-spacing: 3px; color: var(--turq); }
    .chip .wie { font-size: 40px; font-weight: 800; line-height: 1.1; }

    /* speels */
    body.speels { background: linear-gradient(135deg, #1e6bff, #1aa8ff 45%, #22e3d0); }
    body.speels .titel, body.speels .klok, body.speels .naam { color: #fff; -webkit-text-stroke: 10px #062347; paint-order: stroke fill; text-shadow: 0 10px 0 #062347; }
    body.speels .sub { color: #fff; text-shadow: 0 3px 0 rgba(6, 35, 71, 0.6); }

    /* neon */
    body.neon { background: radial-gradient(1400px 600px at 50% 70%, #0b2a6a, #020611 70%); }
    body.neon .titel, body.neon .klok, body.neon .naam { font-family: 'Russo One', sans-serif; color: #fff; text-shadow: 0 0 8px #fff, 0 0 26px #5ff6ff, 0 0 60px #22e3d0, 0 0 110px #1e6bff; }
    body.neon .titel .l { animation: none; }
    body.neon .titel { animation: zoem 5s infinite; }
    @keyframes zoem { 0%, 90%, 100% { opacity: 1; } 91% { opacity: 0.5; } 93% { opacity: 1; } 95% { opacity: 0.7; } }
    body.neon .sub { font-family: 'Russo One', sans-serif; font-weight: 400; color: #bff9ff; text-shadow: 0 0 12px #22e3d0; }
    body.neon .foto { background: #020611; box-shadow: 0 0 0 4px #5ff6ff, 0 0 30px 8px rgba(34, 227, 208, 0.9), 0 0 80px 14px rgba(30, 107, 255, 0.5); }
    body.neon .chip { background: rgba(2, 6, 17, 0.85); box-shadow: 0 0 0 3px #5ff6ff, 0 0 24px 4px rgba(34, 227, 208, 0.8); }
    body.neon .chip .label { font-family: 'Russo One', sans-serif; color: #5ff6ff; }

    /* 3d */
    body.drie { background: radial-gradient(circle at 50% 45%, #4fc3ff 0 18%, #1aa8ff 18% 34%, #1e8bff 34% 52%, #1e6bff 52% 72%, #1757d6 72%); }
    body.drie #drie { display: block; }
    body.drie-ok .titel { visibility: hidden; height: 132px; }
    body.drie .sub, body.drie .klok, body.drie .naam { -webkit-text-stroke: 8px #062347; paint-order: stroke fill; text-shadow: 0 8px 0 #062347; }
    body.drie .chip { transform: perspective(900px) rotateX(14deg); background: #1e6bff; box-shadow: 0 0 0 5px #062347, 10px 10px 0 5px #062347; }
    body.drie .chip .label { color: #ffe66b; }
    body.drie .foto { background: #22e3d0; box-shadow: 0 0 0 6px #062347, 12px 12px 0 6px #062347; }
</style>
</head>
<body>
<div id="podium">
    <canvas id="achter" width="1920" height="1080"></canvas>
    <canvas id="drie" width="1920" height="1080"></canvas>
    <div class="naam">Demitje01</div>
    <div class="inhoud">
        <div class="foto" id="foto"><img id="fotoImg" alt=""></div>
        <div class="titel" id="titel"></div>
        <div class="klok" id="klok" hidden>05:00</div>
        <div class="sub" id="sub"></div>
    </div>
    <div class="chips">
        <div class="chip"><div class="label">LAATSTE VOLGER</div><div class="wie" id="w-volger">-</div></div>
        <div class="chip"><div class="label">LAATSTE SUB</div><div class="wie" id="w-sub">-</div></div>
    </div>
</div>
<script>
(() => {
    const W = 1920, H = 1080;
    const q = new URLSearchParams(location.search);
    const LOGIN = 'demitje01', API = 'https://api.gwnlarss.nl/api/streamer-alerts/' + LOGIN;
    const STIJL = q.get('stijl') === 'neon' ? 'neon' : ['3d', 'weg'].includes(q.get('stijl')) ? 'drie' : 'speels';
    const SCENE = ['pauze', 'einde'].includes(q.get('scene')) ? q.get('scene') : 'start';
    document.body.classList.add(STIJL);

    const podium = document.getElementById('podium');
    function pas() {
        const s = Math.max(innerWidth / W, innerHeight / H);   // scène vult altijd het hele beeld
        podium.style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - H * s) / 2}px) scale(${s})`;
    }
    addEventListener('resize', pas); pas();

    // teksten
    const TEKST = {
        start: ['WE BEGINNEN ZO', 'Pak wat te drinken, we gaan zo los!'],
        pauze: ['EVEN PAUZE', 'Ik ben zo terug, niet weggaan!'],
        einde: ['BEDANKT!', 'Tot de volgende stream!'],
    }[SCENE];
    window.sceneTitel = TEKST[0];
    document.getElementById('titel').innerHTML = [...TEKST[0]].map((c, i) => `<span class="l" style="--i:${i}">${c === ' ' ? '&nbsp;' : c}</span>`).join('');
    document.getElementById('sub').textContent = TEKST[1];

    // aftelklok bij start (?min=5)
    const MIN = +q.get('min') || 0;
    if (SCENE === 'start' && MIN > 0) {
        const eind = Date.now() + MIN * 60000, klok = document.getElementById('klok');
        klok.hidden = false;
        const tik = () => {
            const s = Math.max(0, Math.round((eind - Date.now()) / 1000));
            klok.textContent = s ? String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0') : 'NU!';
            if (!s) document.getElementById('sub').textContent = 'We beginnen!';
        };
        tik(); setInterval(tik, 1000);
    }

    // foto of eigen logo
    const eigenLogo = (q.get('logo') || '').trim(), img = document.getElementById('fotoImg');
    if (q.get('foto') === '0') document.getElementById('foto').classList.add('leeg');
    else if (eigenLogo.startsWith('https://')) img.src = eigenLogo;
    else fetch('https://decapi.me/twitch/avatar/' + LOGIN).then(r => r.text()).then(u => { if (u.trim().startsWith('https://')) img.src = u.trim(); }).catch(() => { });

    // laatste volger en sub
    async function haal() {
        try {
            const l = (q.get('demo') === '1' ? { laatste: { follower: { naam: 'NieuweVolger123' }, subscriber: { naam: 'GezelligeKijker' } } } : await (await fetch(API + '/stats', { cache: 'no-store' })).json()).laatste || {};
            const sub = ['subscriber', 'resub', 'gift'].map(k => l[k]).filter(Boolean).sort((a, b) => (b.op || 0) - (a.op || 0))[0];
            document.getElementById('w-volger').textContent = l.follower?.naam || '-';
            document.getElementById('w-sub').textContent = sub?.naam || '-';
        } catch { }
    }
    haal(); setInterval(haal, 15000);

    // achtergrond: speels = opstijgende bubbels, neon = rijdend lichtgrid; 3d tekent three.js hieronder
    const cv = document.getElementById('achter'), cx = cv.getContext('2d');
    // zijn kanaal-emotes zweven mee: in bubbels (speels) of gloeiend door de lucht (neon)
    const EMOTES = [];
    fetch(API + '/emotes').then(r => r.json()).then(d => (d.emotes || []).forEach(e => { const i = new Image(); i.src = e.url; EMOTES.push(i); })).catch(() => { });
    const emoteVan = n => { const k = EMOTES.filter(i => i.complete && i.naturalWidth); return k.length ? k[n % k.length] : null; };
    const zwevers = Array.from({ length: 14 }, (_, n) => ({ n, x: Math.random() * W, y: Math.random() * H, v: 0.3 + Math.random() * 0.6, f: Math.random() * 6.28, b: 80 + Math.random() * 50 }));
    const bubbels = Array.from({ length: 46 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 10 + Math.random() * 46, v: 0.4 + Math.random() * 1.4, f: Math.random() * 6.28 }));
    let vorige = 0;
    function teken(nu) {
        requestAnimationFrame(teken);
        if (nu - vorige < 30) return;
        vorige = nu;
        const t = nu / 1000;
        cx.clearRect(0, 0, W, H);
        if (STIJL === 'speels') {
            for (const b of bubbels) {
                b.y -= b.v; if (b.y < -60) { b.y = H + 60; b.x = Math.random() * W; }
                const x = b.x + Math.sin(t + b.f) * 20;
                cx.globalAlpha = 0.28; cx.fillStyle = '#ffffff';
                cx.beginPath(); cx.arc(x, b.y, b.r, 0, 6.28); cx.fill();
                cx.globalAlpha = 0.6; cx.beginPath(); cx.arc(x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.22, 0, 6.28); cx.fill();
            }
            // grote bubbels met een emote erin
            for (const z of zwevers) {
                const img = emoteVan(z.n); if (!img) break;
                z.y -= z.v * 1.4; if (z.y < -120) { z.y = H + 120; z.x = Math.random() * W; z.n += 14; }
                const x = z.x + Math.sin(t * 0.8 + z.f) * 30, rr = z.b * 0.75;
                cx.globalAlpha = 0.22; cx.fillStyle = '#ffffff'; cx.beginPath(); cx.arc(x, z.y, rr, 0, 6.28); cx.fill();
                cx.globalAlpha = 0.95; cx.drawImage(img, x - z.b / 2, z.y - z.b / 2, z.b, z.b);
                cx.globalAlpha = 0.7; cx.lineWidth = 3; cx.strokeStyle = '#ffffff'; cx.beginPath(); cx.arc(x, z.y, rr, 0, 6.28); cx.stroke();
                cx.globalAlpha = 0.8; cx.beginPath(); cx.arc(x - rr * 0.4, z.y - rr * 0.4, rr * 0.14, 0, 6.28); cx.fillStyle = '#fff'; cx.fill();
            }
        } else if (STIJL === 'neon') {
            // horizon-gloed en een perspectief-grid dat naar je toe rijdt
            const hor = 640;
            const g = cx.createLinearGradient(0, hor - 160, 0, hor + 20);
            g.addColorStop(0, 'rgba(34,227,208,0)'); g.addColorStop(1, 'rgba(34,227,208,0.35)');
            cx.fillStyle = g; cx.fillRect(0, hor - 160, W, 180);
            cx.strokeStyle = '#5ff6ff'; cx.lineWidth = 2; cx.shadowColor = '#22e3d0'; cx.shadowBlur = 10;
            for (let i = -24; i <= 24; i++) { cx.globalAlpha = 0.5; cx.beginPath(); cx.moveTo(W / 2 + i * 30, hor); cx.lineTo(W / 2 + i * 260, H); cx.stroke(); }
            const fase = (t * 0.6) % 1;
            for (let k = 0; k < 14; k++) {
                const z = (k + fase) / 14, y = hor + Math.pow(z, 2.2) * (H - hor);
                cx.globalAlpha = 0.15 + z * 0.6; cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke();
            }
            cx.shadowBlur = 0; cx.globalAlpha = 1;
            // emotes die gloeiend boven de horizon zweven
            for (const z of zwevers) {
                const img = emoteVan(z.n); if (!img) break;
                const x = (z.x + t * 40 * z.v) % (W + 200) - 100, y = 90 + (z.y * 0.4) % 430 + Math.sin(t + z.f) * 18;
                cx.globalAlpha = 0.9; cx.shadowColor = '#22e3d0'; cx.shadowBlur = 26;
                cx.drawImage(img, x - z.b / 2, y - z.b / 2, z.b, z.b);
            }
            cx.shadowBlur = 0; cx.globalAlpha = 1;
        }
        cx.globalAlpha = 1;
    }
    if (STIJL !== 'drie') requestAnimationFrame(teken);
    document.fonts.ready.then(() => { document.body.dataset.klaar = '1'; });
})();
</script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
// 3d-scène in cartoon-3D: de titel als losse letters die in golfjes opspringen, met bolle wolkjes,
// sterren en zijn emotes die langzaam omhoog zweven. Matte kleuren met omlijning, geen glans.
if (document.body.classList.contains('drie')) {
    try {
        const THREE = await import('three');
        const { FontLoader } = await import('three/addons/loaders/FontLoader.js');
        const { TextGeometry } = await import('three/addons/geometries/TextGeometry.js');
        const font = await new FontLoader().loadAsync('lilita.typeface.json');
        // ---- cartoon-3D (cel-shading): matte kleurvlakken met harde overgangen en een donkere omlijning ----
        const { mergeVertices } = await import('three/addons/utils/BufferGeometryUtils.js');
        const verloop = new THREE.DataTexture(new Uint8Array([110, 190, 255]), 3, 1, THREE.RedFormat);
        verloop.minFilter = verloop.magFilter = THREE.NearestFilter; verloop.needsUpdate = true;
        const toon = c => new THREE.MeshToonMaterial({ color: c, gradientMap: verloop });
        // omlijning: dezelfde vorm iets opgeblazen langs gladde normalen, alleen de achterkant, donkerblauw
        const lijnMat = d => new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: { d: { value: d } },
            vertexShader: 'uniform float d; void main() { gl_Position = projectionMatrix * modelViewMatrix * vec4(position + normal * d, 1.0); }',
            fragmentShader: 'void main() { gl_FragColor = vec4(0.024, 0.137, 0.278, 1.0); }' });
        function metLijn(geo, mat, d) {
            const g = new THREE.Group();
            const glad = mergeVertices(geo.clone().deleteAttribute('normal').deleteAttribute('uv'), 0.5); glad.computeVertexNormals();
            g.add(new THREE.Mesh(glad, lijnMat(d)), new THREE.Mesh(geo, mat));
            return g;
        }
        // tekst als losse letters (elk met eigen draaipunt onderaan het midden), zodat ze kunnen springen en indeuken;
        // de tussenruimte wordt aan de letter zelf gemeten (de advance-breedtes in het lettertypebestand kloppen niet)
        function letters(tekst, size, voorKleur, zijKleur) {
            const groep = new THREE.Group(), mats = [toon(voorKleur), toon(zijKleur)];
            let x = 0; const lijst = [];
            for (const c of [...tekst]) {
                if (!c.trim()) { x += size * 0.3; continue; }
                {
                    const geo = new TextGeometry(c, { font, size, height: size * 0.32, depth: size * 0.32, curveSegments: 5, bevelEnabled: true, bevelThickness: size * 0.05, bevelSize: size * 0.03, bevelSegments: 2 });
                    geo.computeBoundingBox();
                    const { min, max } = geo.boundingBox, breed = max.x - min.x;
                    // letters met een haakje naar links (zoals de j) schuiven onder de vorige door; de afschuining telt niet mee
                    x += Math.min(0, min.x + size * 0.03);
                    geo.translate(-(min.x + max.x) / 2, 0, -max.z / 2);
                    const l = metLijn(geo, mats, size * 0.045);
                    l.position.x = x + breed / 2;
                    groep.add(l); lijst.push(l);
                    x += breed + size * 0.05;   // breedte van de letter zelf plus een kleine tussenruimte
                }
            }
            x -= size * 0.05;
            for (const l of lijst) l.position.x -= x / 2;
            groep.userData.letters = lijst; groep.userData.breedte = x;
            return groep;
        }
        // spring + indeuken: p loopt van 0 tot 1
        function hop(l, p, hoogte) {
            if (p <= 0 || p >= 1) { l.position.y = 0; l.scale.set(1, 1, 1); l.rotation.z = 0; return; }
            const sprong = Math.sin(p * Math.PI);
            l.position.y = sprong * hoogte;
            const deuk = p < 0.12 ? (0.12 - p) / 0.12 : p > 0.88 ? (p - 0.88) / 0.12 : 0;   // indeuken bij afzet en landing
            l.scale.set(1 + deuk * 0.22, 1 - deuk * 0.28 + sprong * 0.08, 1 + deuk * 0.22);
            l.rotation.z = Math.sin(p * Math.PI * 2) * 0.12;
        }

        const r = new THREE.WebGLRenderer({ canvas: document.getElementById('drie'), alpha: true, antialias: true });
        r.setPixelRatio(1); r.setSize(1920, 1080, false); r.outputColorSpace = THREE.SRGBColorSpace;
        const scene = new THREE.Scene();
        const cam = new THREE.PerspectiveCamera(35, 1920 / 1080, 10, 10000); cam.position.set(0, 120, 1700); cam.lookAt(0, 0, 0);
        scene.add(new THREE.AmbientLight(0xffffff, 1.1));
        const zon = new THREE.DirectionalLight(0xffffff, 2.2); zon.position.set(-0.6, 1, 0.9); scene.add(zon);

        const titel = letters(window.sceneTitel, 150, 0xffffff, 0x22e3d0);
        titel.scale.setScalar(Math.min(0.85, 1250 / titel.userData.breedte));
        titel.position.y = -115;
        scene.add(titel);

        // bolle wolkjes en sterren
        const zwevers = [];
        function wolk() {
            const g = new THREE.Group(), m = toon(0xffffff);
            for (const [x, y, rr] of [[0, 0, 60], [-62, -14, 44], [62, -12, 46], [-28, 30, 42], [30, 32, 40]]) {
                const b = metLijn(new THREE.SphereGeometry(rr, 24, 16), m, 5); b.position.set(x, y, 0); g.add(b);
            }
            return g;
        }
        function ster(kleur) {
            const s = new THREE.Shape();
            for (let i = 0; i < 10; i++) { const a = Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 24 : 56; s[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr); }
            const g = new THREE.ExtrudeGeometry(s, { depth: 22, bevelEnabled: true, bevelThickness: 6, bevelSize: 4, bevelSegments: 2 }); g.center();
            return metLijn(g, toon(kleur), 5);
        }
        const kleuren = [0xffd84a, 0xff4f8b, 0x22e3d0, 0xffffff];
        for (let i = 0; i < 14; i++) {
            const m = i % 3 === 0 ? wolk() : ster(kleuren[i % kleuren.length]);
            const hoek = ((i + 0.5) / 14) * Math.PI * 2, afstand = 620 + Math.random() * 380;
            m.position.set(Math.cos(hoek) * afstand * 1.45, Math.sin(hoek) * afstand * 0.75, -200 - Math.random() * 900);
            m.scale.setScalar(0.7 + Math.random() * 0.7);
            m.userData = { v: 0.3 + Math.random() * 0.5, d: (Math.random() - 0.5) * 0.02, f: Math.random() * 6 };
            scene.add(m); zwevers.push(m);
        }
        fetch('https://api.gwnlarss.nl/api/streamer-alerts/demitje01/emotes').then(r => r.json()).then(d => {
            const tl = new THREE.TextureLoader(); tl.setCrossOrigin('anonymous');
            (d.emotes || []).slice(0, 16).forEach((e, i) => tl.load(e.url, tex => {
                tex.colorSpace = THREE.SRGBColorSpace;
                const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
                const hoek = ((i + 0.25) / 16) * Math.PI * 2, afstand = 560 + Math.random() * 300, b = 150 + Math.random() * 60;
                sp.position.set(Math.cos(hoek) * afstand * 1.5, Math.sin(hoek) * afstand * 0.75, -100 - Math.random() * 600);
                sp.scale.set(b, b, 1);
                sp.userData = { v: 0.4 + Math.random() * 0.5, d: 0, f: Math.random() * 6 };
                scene.add(sp); zwevers.push(sp);
            }));
        }).catch(() => { });
        document.body.classList.add('drie-ok');
        let vorige = 0;
        r.setAnimationLoop(nu => {
            if (nu - vorige < 15) return;
            vorige = nu;
            const t = nu / 1000, golf = t % 4;
            titel.userData.letters.forEach((l, i) => hop(l, (golf - i * 0.07) / 0.55, 60));
            for (const z of zwevers) {
                z.position.y += z.userData.v; z.rotation.z = Math.sin(t + z.userData.f) * 0.2; z.rotation.y += z.userData.d;
                if (z.position.y > 900) z.position.y = -900;
            }
            r.render(scene, cam);
        });
    } catch (err) { console.warn('3D niet beschikbaar', err); document.body.classList.remove('drie-ok'); }
}
</script>
</body>
</html>
