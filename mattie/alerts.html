<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Alerts · MattieAM</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Rubik:wght@600;800;900&display=swap" rel="stylesheet">
<script src="geluid.js"></script>
<style>
    /* Alerts-overlay voor Mattie (MattieAM) als OBS-browserbron (1920x1080, transparant). In zijn eigen huisstijl:
       gele marker-letters, rood-naar-zwart verloop en de witte ring van zijn logo. Plat en strak (stickerstijl,
       geen gloed). Drie stijlen, gekozen op gwnlarss.nl/mattie (zelfde OBS-link):
       - logo: zijn ronde logo stuitert erin, een rood-zwart bord rolt uit met zijn naam en een gele tape erop
       - blokken: blokjes vallen naar beneden en stapelen zich tot een bord, emotes stapelen zich onderin op
       - veeg: volledig scherm, een rood-zwarte veeg schuift over het beeld, de ring tekent zich en de naam
         wordt er met gele marker op geschreven
       Gegevens komen live van api.gwnlarss.nl/api/streamer-alerts/mattieam/stream. */
    :root { --geel: #ffe600; --rood: #e00000; --donker: #5a0000; --zwart: #0a0000; --wit: #ffffff; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: 'Rubik', system-ui, sans-serif; }
    #podium { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; }
    /* in de instelpagina een neutrale "game"-achtergrond, zodat je ziet hoe het over zijn beeld valt */
    body.voorbeeld #podium { background: linear-gradient(180deg, #7fb6e8 0%, #a9d2f2 52%, #5d9a3c 52%, #4a7d2f 70%, #6b4a2b 70%, #553a22 100%); }

    #alles { position: absolute; inset: 0; transform: scale(var(--grootte, 1)); transform-origin: 50% 40px; }
    #emotes { position: absolute; inset: 0; pointer-events: none; }
    #emotes img { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
    canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }
    /* gele naam met dikke zwarte rand en harde schaduw, zoals zijn logo */
    .geelNaam { font-family: 'Chewy', system-ui, sans-serif; color: var(--geel); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        text-shadow: 4px 0 0 #000, -4px 0 0 #000, 0 4px 0 #000, 0 -4px 0 #000, 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 8px 8px 0 #000; }
    .tape { display: inline-block; background: var(--geel); color: #000; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 18px 3px; box-shadow: 5px 5px 0 #000; }

    /* ---------- logo ---------- */
    .logo { position: absolute; left: 50%; top: 70px; width: 1140px; height: 270px; margin-left: -570px; visibility: hidden; }
    .logo.aan, .logo.weg { visibility: visible; }
    .logo .rond { position: absolute; left: 0; top: 5px; width: 260px; height: 260px; border-radius: 50%; background: center / cover; z-index: 2;
        box-shadow: 0 0 0 10px #fff, 14px 14px 0 10px #000; transform: translateY(-520px) rotate(-40deg); }
    .logo.aan .rond { animation: stuiter 0.85s cubic-bezier(.3, 1.4, .5, 1) forwards; }
    @keyframes stuiter { 0% { transform: translateY(-520px) rotate(-40deg); } 55% { transform: translateY(0) rotate(4deg) scale(1.08, 0.9); } 75% { transform: translateY(-26px) rotate(-2deg); } 100% { transform: none; } }
    .logo.weg .rond { transform: none; animation: rolWeg 0.55s cubic-bezier(.5, -0.3, .8, .5) forwards; }
    @keyframes rolWeg { to { transform: translateY(-560px) rotate(200deg); } }
    .logo .bord { position: absolute; left: 130px; top: 45px; right: 0; height: 180px; border-radius: 0 30px 30px 0; transform: scaleX(0); transform-origin: left;
        background: linear-gradient(120deg, #000 0%, #3a0000 30%, var(--donker) 55%, var(--rood) 100%); box-shadow: 0 0 0 6px #000, 14px 14px 0 6px #000; }
    .logo.aan .bord { animation: rol 0.5s 0.45s cubic-bezier(.3, 1.2, .5, 1) forwards; }
    .logo.weg .bord { transform: scaleX(1); animation: rolIn 0.4s 0.1s ease-in forwards; }
    @keyframes rol { to { transform: scaleX(1); } }
    @keyframes rolIn { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    .logo .tekst { position: absolute; left: 300px; right: 40px; top: 18px; }
    .logo .tape { font-size: 30px; transform: rotate(-3deg) scaleX(0); transform-origin: left; }
    .logo.aan .tape { animation: plak 0.3s 0.8s ease-out forwards; }
    @keyframes plak { to { transform: rotate(-3deg) scaleX(1); } }
    .logo .naam { font-size: 104px; line-height: 1.1; margin-top: 10px; padding: 4px 20px 14px 6px; margin-left: -6px; opacity: 0; transform: translateX(-30px); }
    .logo .extra { font-weight: 800; font-size: 30px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -6px; opacity: 0; }
    .logo.aan .naam { animation: schuif 0.4s 0.85s cubic-bezier(.2, 1.4, .4, 1) forwards; }
    .logo.aan .extra { animation: schuif 0.4s 1s ease-out forwards; }
    @keyframes schuif { to { opacity: 1; transform: none; } }
    .logo.weg .tekst { animation: uit 0.2s ease-in forwards; }

    /* ---------- blokken ---------- */
    .blokken { position: absolute; left: 50%; top: 60px; width: 1080px; height: 300px; margin-left: -540px; visibility: hidden; }
    .blokken.aan, .blokken.weg { visibility: visible; }
    .blok { position: absolute; width: 60px; height: 60px; box-shadow: inset 4px 4px 0 rgba(255, 255, 255, 0.16), inset -4px -4px 0 rgba(0, 0, 0, 0.35); }
    .blok.voor { width: 240px; height: 240px; background: center / cover; box-shadow: 0 0 0 8px #fff, inset 0 0 0 1px #000; z-index: 2; }
    .blokken .tekst { position: absolute; left: 330px; right: 40px; top: 34px; z-index: 3; }
    .blokken .tape { font-size: 30px; opacity: 0; }
    .blokken .naam { font-size: 100px; line-height: 1.1; margin-top: 10px; padding: 4px 20px 14px 6px; margin-left: -6px; opacity: 0; }
    .blokken .extra { font-weight: 800; font-size: 30px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -4px; opacity: 0; }
    .blokken.aan .tape { animation: klik 0.25s 1.05s steps(2) forwards; }
    .blokken.aan .naam { animation: klik 0.3s 1.15s steps(3) forwards; }
    .blokken.aan .extra { animation: klik 0.25s 1.3s steps(2) forwards; }
    @keyframes klik { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: none; } }
    .blokken.weg .tekst { animation: uit 0.15s forwards; }

    /* ---------- veeg (volledig scherm) ---------- */
    #veeg { position: absolute; inset: 0; visibility: hidden; overflow: hidden; }
    #veeg.aan, #veeg.weg { visibility: visible; }
    .band { position: absolute; top: -300px; bottom: -300px; left: -500px; width: 2920px; transform: skewX(-16deg) translateX(-115%);
        background: linear-gradient(115deg, #000 0%, #250000 25%, var(--donker) 50%, #a00000 75%, var(--rood) 100%); }
    .band.b2 { background: var(--geel); }
    #veeg.aan .band.b2 { animation: veegIn 0.55s cubic-bezier(.6, 0, .3, 1) forwards, veegDoor 0.55s 0.12s cubic-bezier(.6, 0, .3, 1) forwards; }
    #veeg.aan .band.b1 { animation: veegIn 0.6s 0.12s cubic-bezier(.6, 0, .3, 1) forwards; }
    @keyframes veegIn { to { transform: skewX(-16deg) translateX(0); } }
    @keyframes veegDoor { from { transform: skewX(-16deg) translateX(0); } to { transform: skewX(-16deg) translateX(115%); } }
    #veeg.weg .band.b1 { transform: skewX(-16deg) translateX(0); animation: veegDoor 0.6s cubic-bezier(.6, 0, .4, 1) forwards; }
    #veeg.weg .band.b2 { transform: skewX(-16deg) translateX(-115%); animation: veegIn 0.5s cubic-bezier(.6, 0, .4, 1) forwards, veegDoor 0.45s 0.5s cubic-bezier(.6, 0, .4, 1) forwards; }
    .v-midden { position: absolute; left: 0; right: 0; top: 120px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .v-ring { position: relative; width: 320px; height: 320px; }
    .v-ring .foto { position: absolute; inset: 20px; border-radius: 50%; background: center / cover; transform: scale(0); }
    #veeg.aan .v-ring .foto { animation: plop 0.5s 0.75s cubic-bezier(.2, 1.5, .4, 1) forwards; }
    @keyframes plop { to { transform: scale(1); } }
    .v-ring svg { position: absolute; inset: 0; width: 320px; height: 320px; overflow: visible; transform: rotate(-90deg); }
    .v-ring circle { fill: none; stroke: #fff; stroke-width: 16; stroke-linecap: round; stroke-dasharray: 100 100; stroke-dashoffset: 100; }
    #veeg.aan .v-ring circle { animation: teken 0.7s 0.55s cubic-bezier(.6, 0, .3, 1) forwards; }
    @keyframes teken { to { stroke-dashoffset: 0; } }
    .v-soort { margin-top: 36px; font-weight: 900; font-size: 44px; letter-spacing: 0.14em; text-transform: uppercase; color: #fff; opacity: 0; text-shadow: 5px 5px 0 #000; }
    #veeg.aan .v-soort { animation: schuif 0.4s 1s ease-out forwards; }
    .v-naam { font-size: 200px; line-height: 1.05; max-width: 1760px; padding: 0 30px 20px; transform: rotate(-3deg); clip-path: inset(-20% 100% -20% 0);
        text-shadow: 6px 0 0 #000, -6px 0 0 #000, 0 6px 0 #000, 0 -6px 0 #000, 5px 5px 0 #000, -5px -5px 0 #000, 5px -5px 0 #000, -5px 5px 0 #000, 14px 14px 0 #000; }
    #veeg.aan .v-naam { animation: schrijf 0.9s 1.15s cubic-bezier(.4, 0, .6, 1) forwards; }
    @keyframes schrijf { to { clip-path: inset(-20% -5% -20% 0); } }
    .v-streep { width: 900px; height: 46px; margin-top: -26px; overflow: visible; }
    .v-streep path { fill: none; stroke: var(--geel); stroke-width: 18; stroke-linecap: round; stroke-dasharray: 100 100; stroke-dashoffset: 100; }
    #veeg.aan .v-streep path { animation: teken 0.45s 1.95s ease-out forwards; }
    .v-extra { font-weight: 800; font-size: 48px; color: #fff; margin-top: 10px; opacity: 0; max-width: 1600px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 20px 10px; text-shadow: 5px 5px 0 #000; }
    #veeg.aan .v-extra { animation: schuif 0.4s 2.1s ease-out forwards; }
    #veeg.weg .v-midden { animation: uit 0.25s ease-in forwards; }
    @keyframes uit { from { opacity: 1; } to { opacity: 0; } }

    /* bericht van de kijker (resub, bits, donatie): wit tekstwolkje met zwarte rand */
    .bericht { position: absolute; left: 50%; top: 385px; transform: translateX(-50%) rotate(-1deg); max-width: 860px; padding: 14px 28px; border-radius: 22px; background: #fff;
        color: #000; font-size: 30px; font-weight: 800; text-align: center; box-shadow: 0 0 0 5px #000, 9px 9px 0 5px #000; opacity: 0; transition: opacity 0.3s; }
    .bericht::after { content: ''; position: absolute; left: 60px; top: -26px; border: 14px solid transparent; border-bottom: 18px solid #000; }
    .bericht.aan { opacity: 1; }
    .bericht.veeg { top: 900px; }
    .bericht.veeg::after { display: none; }
</style>
</head>
<body>
<div id="podium">
<div id="veeg">
    <div class="band b2"></div><div class="band b1"></div>
    <div class="v-midden">
        <div class="v-ring"><div class="foto"></div><svg viewBox="0 0 320 320"><circle cx="160" cy="160" r="152" pathLength="100"/></svg></div>
        <div class="v-soort" id="v-soort"></div>
        <div class="v-naam geelNaam" id="v-naam"></div>
        <svg class="v-streep" viewBox="0 0 900 46"><path d="M30 30 C 250 8, 520 40, 870 14" pathLength="100"/></svg>
        <div class="v-extra" id="v-extra"></div>
    </div>
</div>
<div id="alles">
    <div class="logo" id="logo">
        <div class="bord"></div>
        <div class="rond foto"></div>
        <div class="tekst"><div class="tape" id="o-soort"></div><div class="naam geelNaam" id="o-naam"></div><div class="extra" id="o-extra"></div></div>
    </div>
    <div class="blokken" id="blokken">
        <div id="blokLaag"></div>
        <div class="tekst"><div class="tape" id="b-soort"></div><div class="naam geelNaam" id="b-naam"></div><div class="extra" id="b-extra"></div></div>
    </div>
    <div class="bericht" id="bericht"></div>
</div>
<div id="emotes"></div>
<canvas id="confetti" width="1920" height="1080"></canvas>
</div>

<script>
    const LOGIN = 'mattieam';
    const API = 'https://api.gwnlarss.nl/api/streamer-alerts/' + LOGIN;
    const AVATAR = 'https://static-cdn.jtvnw.net/jtv_user_pictures/467a9a6c-4c34-4ddd-b297-ea26fb71d04d-profile_image-300x300.png';
    const zoek = new URLSearchParams(location.search);
    const VOORBEELD = zoek.has('voorbeeld');   // in de instelpagina: met achtergrond, zonder eigen geluid
    if (VOORBEELD && !zoek.has('kaal')) document.body.classList.add('voorbeeld');   // ?kaal: zonder achtergrond (over het stats-voorbeeld heen)
    const ZUINIG = zoek.has('zuinig') && zoek.get('zuinig') !== '0';   // zuinige stand: de helft van de confetti en emotes
    const $ = id => document.getElementById(id);
    document.querySelectorAll('.foto').forEach(f => { f.style.backgroundImage = `url('${AVATAR}')`; });

    // podium passend in elk venster (in OBS op 1920x1080 precies 1 op 1)
    function pasPodiumAan() {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        $('podium').style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
    }
    addEventListener('resize', pasPodiumAan); pasPodiumAan();

    // Confetti (window.confetti(niveau, duur)): platte snippers in zijn kleuren uit twee kanonnen onderin.
    // Hoe groter de alert, hoe meer schoten. Eén canvas; de lus loopt alleen zolang er iets valt.
    window.confetti = (() => {
        const c = $('confetti').getContext('2d');
        const KLEUREN = ['#ffe600', '#ffe600', '#e00000', '#ffffff', '#111111'];
        const SCHOTEN = [1, 2, 3, 5, 7, 10];
        let snippers = [], loopt = false, vorige = 0;
        function schiet(links) {
            const n = Math.round(70 * (ZUINIG ? 0.5 : 1)), x = links ? -20 : 1940, y = 1100;
            for (let i = 0; i < n; i++) {
                const hoek = -Math.PI / 2 + (links ? 1 : -1) * (0.2 + Math.random() * 0.45), kracht = 1100 + Math.random() * 900;   // schuin omhoog naar het midden
                snippers.push({ x, y, vx: Math.cos(hoek) * kracht, vy: Math.sin(hoek) * kracht, b: 10 + Math.random() * 10, h: 6 + Math.random() * 8,
                    draai: Math.random() * 6, dsp: (Math.random() - 0.5) * 14, flap: Math.random() * 6, kleur: KLEUREN[Math.floor(Math.random() * KLEUREN.length)], leeft: 0 });
            }
            if (!loopt) { loopt = true; vorige = performance.now(); requestAnimationFrame(stap); }
        }
        function stap(nu) {
            const dt = Math.min(0.05, (nu - vorige) / 1000); vorige = nu;
            c.clearRect(0, 0, 1920, 1080);
            snippers = snippers.filter(s => {
                s.leeft += dt;
                s.vx *= 1 - 1.6 * dt; s.vy = s.vy * (1 - 1.6 * dt) + 1400 * dt; if (s.vy > 260) s.vy = 260;   // lucht remt af: dwarrelen
                s.x += s.vx * dt + Math.sin(s.leeft * 4 + s.flap) * 40 * dt; s.y += s.vy * dt; s.draai += s.dsp * dt;
                if (s.y > 1120 && s.vy > 0) return false;
                c.setTransform(Math.cos(s.draai), Math.sin(s.draai), -Math.sin(s.draai), Math.cos(s.draai), s.x, s.y);
                c.fillStyle = s.kleur; c.fillRect(-s.b / 2, -s.h / 2 * Math.abs(Math.cos(s.leeft * 9 + s.flap)), s.b, s.h * Math.abs(Math.cos(s.leeft * 9 + s.flap)) + 1);
                return true;
            });
            c.setTransform(1, 0, 0, 1, 0, 0);
            if (snippers.length) requestAnimationFrame(stap); else { c.clearRect(0, 0, 1920, 1080); loopt = false; }
        }
        return (niveau, duur) => {
            const aantal = SCHOTEN[Math.max(0, Math.min(5, niveau))], venster = Math.max(1200, duur * 0.55);
            for (let i = 0; i < aantal; i++) setTimeout(() => schiet(i % 2 === 0), 500 + (i / Math.max(1, aantal)) * venster);
        };
    })();
</script>

<script>
    // zijn eigen kanaal-emotes (via api.gwnlarss.nl, plaatjes rechtstreeks van Twitch); zonder emotes platte sterren en hartjes
    const ICOON = svg => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${svg}</svg>`);
    const RESERVE = [
        ICOON('<path d="M50 6 L62 36 L94 38 L69 58 L78 90 L50 72 L22 90 L31 58 L6 38 L38 36Z" fill="#ffe600" stroke="#000" stroke-width="6" stroke-linejoin="round"/>'),
        ICOON('<path d="M50 88 C10 60 4 36 18 22 C30 10 46 16 50 30 C54 16 70 10 82 22 C96 36 90 60 50 88Z" fill="#e00000" stroke="#000" stroke-width="6"/>'),
        ICOON('<circle cx="50" cy="50" r="40" fill="#e00000" stroke="#fff" stroke-width="8"/><text x="50" y="64" font-family="Arial Black,Arial" font-weight="900" font-size="38" text-anchor="middle" fill="#ffe600">AM</text>'),
    ];
    let EMOTES = [];
    fetch(API + '/emotes').then(r => r.json()).then(d => { EMOTES = (d.emotes || []).map(e => e.url); EMOTES.forEach(u => { new Image().src = u; }); }).catch(() => { });
    const emote = () => { const bron = EMOTES.length ? EMOTES : RESERVE; return bron[Math.floor(Math.random() * bron.length)]; };
    function emoteImg(maat) {
        const img = new Image(); img.src = emote(); img.style.width = img.style.height = maat + 'px';
        $('emotes').appendChild(img); return img;
    }

    const getal = n => Number(n).toLocaleString('nl-NL');
    const geld = (b, v) => { try { return Number(b).toLocaleString('nl-NL', { style: 'currency', currency: v || 'EUR' }); } catch { return `${b} ${v ?? ''}`; } };
    const trap = (waarde, grenzen) => grenzen.filter(g => waarde >= g).length;
    // niveau -1 t/m 5: hoe groter de alert, hoe meer emotes en confetti (volgers: geen confetti)
    function niveauVan(e) {
        const x = e.extra ?? {};
        switch (e.soort) {
            case 'follower': return -1;
            case 'subscriber': return Math.min(3, x.tier ?? 1);
            case 'resub': return 1 + trap(x.maanden ?? 1, [12, 24, 48]);
            case 'gift': return trap(x.aantal ?? 1, [5, 10, 20, 50, 100]);
            case 'cheer': return trap(x.bits ?? 0, [500, 1000, 5000, 10000, 25000]);
            case 'raid': return trap(x.kijkers ?? 0, [10, 25, 50, 100, 250]);
            case 'donatie': return trap(x.bedrag ?? 0, [5, 10, 25, 50, 100]);
            default: return 0;
        }
    }
    function opbouw(e) {
        const x = e.extra ?? {}, n = niveauVan(e);
        const o = (() => { switch (e.soort) {
            case 'follower': return { soort: 'Nieuwe volger', extra: 'Welkom in de stream!' };
            case 'subscriber': return { soort: x.tier > 1 ? `Nieuwe tier ${x.tier} sub` : 'Nieuwe sub', extra: 'Bedankt voor je steun!' };
            case 'resub': return { soort: 'Resub', extra: `${x.maanden ?? 1} maanden sub!`, bericht: x.bericht };
            case 'gift': return { soort: `${x.aantal ?? 1} gifted sub${(x.aantal ?? 1) === 1 ? '' : 's'}`, extra: 'Cadeautjes voor de chat!' };
            case 'cheer': return { soort: `${getal(x.bits ?? 0)} bits`, extra: 'Bedankt voor de bits!', bericht: x.bericht };
            case 'raid': return { soort: 'Raid!', extra: `komt binnen met ${getal(x.kijkers ?? 0)} kijkers` };
            case 'donatie': return { soort: `Donatie · ${geld(x.bedrag ?? 0, x.valuta)}`, extra: 'Bedankt voor je donatie!', bericht: x.bericht };
            default: return { soort: 'Alert', extra: '' };
        } })();
        return { ...o, niveau: n, aantal: Math.round(Math.min(56, 10 * (1 + 0.6 * Math.max(0, n))) * (ZUINIG ? 0.5 : 1)) };
    }
    // naam zo groot mogelijk zonder afkappen (anders met …)
    function pasNaam(el, maat, min) { el.style.fontSize = maat + 'px'; while (el.scrollWidth > el.clientWidth + 1 && maat > min) { maat -= 4; el.style.fontSize = maat + 'px'; } }
    const grootte = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--grootte')) || 1;
    const opPodium = (x, y) => { const s = grootte(); return [960 + (x - 960) * s, 40 + (y - 40) * s]; };   // punt in #alles naar het podium
    function speel(el, klasse = 'aan') {
        clearTimeout(el.verberg); el.classList.remove('aan', 'weg'); void el.offsetWidth; el.classList.add(klasse);
        if (klasse === 'weg') el.verberg = setTimeout(() => el.classList.remove('weg'), 1100);
    }
    const ruimOp = () => { for (const id of ['logo', 'blokken', 'veeg']) { clearTimeout($(id).verberg); $(id).classList.remove('aan', 'weg'); } $('blokLaag').innerHTML = ''; };

    // ---------- logo: emotes springen uit het ronde logo in een boog naar buiten en vallen ----------
    function toonLogo(e, o, duur) {
        const a = $('logo');
        $('o-soort').textContent = o.soort; $('o-naam').textContent = e.naam; $('o-extra').textContent = o.extra;
        speel(a); pasNaam($('o-naam'), 104, 52);
        for (let i = 0; i < o.aantal; i++) {
            setTimeout(() => {
                const [x, y] = opPodium(520, 205), maat = 70 + Math.random() * 50, kant = Math.random() < 0.5 ? -1 : 1;
                const img = emoteImg(maat), dx = kant * (200 + Math.random() * 700), top = -60 - Math.random() * 120, val = 1150 - y, draai = kant * (60 + Math.random() * 160);
                const x0 = x - maat / 2, y0 = y - maat / 2;
                img.animate([
                    { transform: `translate(${x0}px, ${y0}px) scale(0.2)`, opacity: 1 },
                    { transform: `translate(${x0 + dx * 0.45}px, ${y0 + top}px) scale(1) rotate(${draai * 0.3}deg)`, opacity: 1, offset: 0.35, easing: 'cubic-bezier(.4,0,.8,.6)' },
                    { transform: `translate(${x0 + dx}px, ${y0 + val}px) scale(1) rotate(${draai}deg)`, opacity: 1 },
                ], { duration: 1900 + Math.random() * 700, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'both' }).onfinish = () => img.remove();
            }, 900 + Math.random() * duur * 0.6);
        }
        setTimeout(() => speel(a, 'weg'), duur);
    }

    // ---------- blokken: bord van vallende blokjes, emotes stapelen zich onderin ----------
    const KOL = 18, RIJ = 5, MAAT = 60;
    function blokKleur(k, r) {   // rood-naar-zwart verloop zoals zijn logo, met een beetje verschil per blok
        const t = Math.min(1, Math.max(0, (k / (KOL - 1)) * 0.75 + (1 - r / (RIJ - 1)) * 0.25 + (Math.random() - 0.5) * 0.12));
        const rood = Math.round(10 + t * 214), extra = Math.round(Math.random() * 10);
        return `rgb(${rood + extra > 255 ? 255 : rood + extra}, ${extra}, ${extra})`;
    }
    function toonBlokken(e, o, duur) {
        const a = $('blokken'), laag = $('blokLaag');
        $('b-soort').textContent = o.soort; $('b-naam').textContent = e.naam; $('b-extra').textContent = o.extra;
        laag.innerHTML = '';
        const blokken = [];
        for (let r = 0; r < RIJ; r++) for (let k = 0; k < KOL; k++) {
            if (k >= 1 && k <= 4 && r >= 0 && r <= 3) continue;   // daar komt het grote blok met zijn logo
            const b = document.createElement('div'); b.className = 'blok';
            b.style.left = k * MAAT + 'px'; b.style.top = r * MAAT + 'px'; b.style.background = blokKleur(k, r);
            laag.appendChild(b); blokken.push({ b, vertraging: (RIJ - 1 - r) * 90 + k * 22 + Math.random() * 60 });
        }
        const voor = document.createElement('div'); voor.className = 'blok voor foto'; voor.style.left = MAAT * 1 + 'px'; voor.style.top = '30px';
        voor.style.backgroundImage = `url('${AVATAR}')`; laag.appendChild(voor); blokken.push({ b: voor, vertraging: 620 });
        speel(a); pasNaam($('b-naam'), 100, 50);
        for (const { b, vertraging } of blokken) b.animate([{ transform: 'translateY(-1300px)' }, { transform: 'translateY(0)', offset: 0.8 }, { transform: 'translateY(-8px)', offset: 0.9 }, { transform: 'translateY(0)' }],
            { duration: 520, delay: vertraging, easing: 'cubic-bezier(.5,0,.9,.6)', fill: 'backwards' });
        // emotes vallen als blokjes en stapelen zich onderin het beeld op
        const stapel = new Array(24).fill(0), ems = [];
        for (let i = 0; i < o.aantal; i++) {
            setTimeout(() => {
                const maat = 80 + Math.random() * 30, vak = Math.floor(Math.random() * 24), x = vak * 80 + (Math.random() - 0.5) * 10 - (maat - 80) / 2;
                const y = 1080 - maat - stapel[vak]; stapel[vak] += maat * 0.8;
                const img = emoteImg(maat), draai = (Math.random() - 0.5) * 24;
                img.style.transform = `translate(${x}px, ${y}px) rotate(${draai}deg)`;
                img.animate([{ transform: `translate(${x}px, -150px) rotate(${draai}deg)` }, { transform: `translate(${x}px, ${y}px) rotate(${draai}deg)`, offset: 0.8 }, { transform: `translate(${x}px, ${y - 14}px) rotate(${draai}deg)`, offset: 0.9 }, { transform: `translate(${x}px, ${y}px) rotate(${draai}deg)` }],
                    { duration: 650, easing: 'cubic-bezier(.5,0,.9,.6)', fill: 'backwards' });
                ems.push({ img, x, y, draai });
            }, 900 + (i / Math.max(1, o.aantal)) * duur * 0.6);
        }
        setTimeout(() => {
            speel(a, 'weg');
            for (const { b } of blokken) b.animate([{ transform: 'translateY(0)' }, { transform: `translateY(1300px) rotate(${(Math.random() - 0.5) * 90}deg)` }],
                { duration: 700, delay: Math.random() * 350, easing: 'cubic-bezier(.5,0,.9,.6)', fill: 'forwards' });
            ems.forEach(({ img, x, y, draai }) => img.animate([{ transform: `translate(${x}px, ${y}px) rotate(${draai}deg)` }, { transform: `translate(${x}px, ${y + 300}px) rotate(${draai * 3}deg)` }],
                { duration: 500, delay: Math.random() * 300, easing: 'ease-in', fill: 'forwards' }).onfinish = () => img.remove());
        }, duur);
    }

    // ---------- veeg (volledig scherm): emotes worden in rijen door het beeld meegesleurd ----------
    function toonVeeg(e, o, duur) {
        const a = $('veeg');
        $('v-soort').textContent = o.soort; $('v-naam').textContent = e.naam; $('v-extra').textContent = o.extra;
        speel(a); pasNaam($('v-naam'), 200, 80);
        for (let i = 0; i < o.aantal; i++) {
            setTimeout(() => {
                const maat = 70 + Math.random() * 60, y = [40, 150, 860, 960][i % 4] + (Math.random() - 0.5) * 50, img = emoteImg(maat), draai = (Math.random() - 0.5) * 30;
                img.animate([{ transform: `translate(-200px, ${y}px) rotate(${draai}deg)` }, { transform: `translate(2000px, ${y}px) rotate(${draai + 30}deg)` }],
                    { duration: 2600 + Math.random() * 1400, easing: 'linear', fill: 'both' }).onfinish = () => img.remove();
            }, 700 + Math.random() * duur * 0.65);
        }
        setTimeout(() => speel(a, 'weg'), duur);
    }

    let instellingen = { stijl: 'logo', volume: 0.7, duur: 7000 }, geluiden = {};   // geluiden: soort -> versie van zijn eigen geluid
    const pasGrootteToe = () => document.documentElement.style.setProperty('--grootte', instellingen.grootte ?? 1);
    const haalInstellingen = () => fetch(API, { cache: 'no-store' }).then(r => r.json()).then(d => { if (d?.instellingen) instellingen = d.instellingen; geluiden = d?.geluiden ?? {}; pasGrootteToe(); }).catch(() => { });
    function geluid(soort) {
        if (VOORBEELD) return;   // in de instelpagina speelt de pagina zelf het geluid af
        const volume = instellingen.volume ?? 0.7;
        if (!geluiden[soort]) return window.mattieGeluid(instellingen.stijl, soort, volume);
        const a = new Audio(`${API}/geluid/${soort}?v=${geluiden[soort]}`);
        a.volume = Math.min(1, Math.max(0, volume));
        a.play().catch(() => window.mattieGeluid(instellingen.stijl, soort, volume));
    }
    haalInstellingen(); setInterval(haalInstellingen, 30000);

    const wachtrij = []; let bezig = false;
    function volgende() {
        if (bezig || !wachtrij.length) return;
        bezig = true;
        const e = wachtrij.shift(), o = opbouw(e), duur = instellingen.duur ?? 7000, stijl = instellingen.stijl ?? 'logo';
        ruimOp();
        if (o.niveau >= 0) window.confetti(o.niveau, duur);
        geluid(e.soort);
        ({ logo: toonLogo, blokken: toonBlokken, veeg: toonVeeg }[stijl] ?? toonLogo)(e, o, duur);
        const b = $('bericht');
        b.textContent = o.bericht || ''; b.classList.toggle('veeg', stijl === 'veeg');
        setTimeout(() => b.classList.toggle('aan', Boolean(o.bericht)), 1400);
        setTimeout(() => b.classList.remove('aan'), duur);
        setTimeout(() => { bezig = false; volgende(); }, duur + 1100);
    }

    function verwerk(d) {
        if (d.soort === '_instellingen') { instellingen = { ...instellingen, ...d.instellingen }; if (d.geluiden) geluiden = d.geluiden; pasGrootteToe(); return; }
        wachtrij.push(d); volgende();
    }
    // in de instelpagina zonder koppeling: tests en stijlkeuze rechtstreeks van de pagina (alleen in het voorbeeld, niet in OBS)
    if (VOORBEELD) addEventListener('message', m => { if (m.origin === location.origin && m.data?.soort) verwerk(m.data); });
    function verbind() {
        const bron = new EventSource(API + '/stream?bron=' + (VOORBEELD ? 'voorbeeld' : 'alerts'));   // bron: voor de status op api.gwnlarss.nl
        bron.addEventListener('message', m => { if (m.data.includes('"_herlaad"')) location.reload(); });   // op afstand herladen vanaf api.gwnlarss.nl/status
        bron.onmessage = m => { try { verwerk(JSON.parse(m.data)); } catch { /* onleesbaar bericht */ } };
        bron.onerror = () => { bron.close(); setTimeout(verbind, 3000); };
    }
    // demo (?demo): alle soorten alerts achter elkaar, wisselend door de drie stijlen (of alleen ?stijl=...),
    // los van de server. Met een achtergrond in de browser; ?demo&kaal is doorzichtig (voor OBS).
    const DEMO = zoek.has('demo');
    if (DEMO) {
        if (!zoek.has('kaal')) document.body.classList.add('voorbeeld');
        const lijst = [
            { soort: 'follower', naam: 'BlokkenBouwer' }, { soort: 'subscriber', naam: 'CreeperKiller', extra: { tier: 1 } },
            { soort: 'cheer', naam: 'DiamondDave', extra: { bits: 1000, bericht: 'Een stack diamonds voor Mattie!' } }, { soort: 'gift', naam: 'GulleGamer', extra: { aantal: 10, tier: 1 } },
            { soort: 'resub', naam: 'TrouweKijker', extra: { maanden: 12, bericht: 'Al een jaar fan!' } }, { soort: 'raid', naam: 'GwnLarss', extra: { kijkers: 42 } },
            { soort: 'donatie', naam: 'Supporter', extra: { bedrag: 5, valuta: 'EUR', bericht: 'Voor de stream!' } },
        ];
        const STIJLEN = zoek.get('stijl') ? [zoek.get('stijl')] : ['logo', 'blokken', 'veeg'];
        let n = 0;
        const volgendeDemo = () => { instellingen.stijl = STIJLEN[n % STIJLEN.length]; wachtrij.push({ id: n, ...lijst[n % lijst.length], extra: { ...lijst[n % lijst.length].extra, test: true } }); n++; volgende(); };
        const lus = () => { if (!bezig && !wachtrij.length) volgendeDemo(); setTimeout(lus, 1500); };
        setTimeout(lus, 1200);
    } else verbind();
    // voor screenshots en lokaal testen: window.testAlert({ soort, naam, extra }, stijl)
    window.testAlert = (e, stijl) => { if (stijl) instellingen.stijl = stijl; wachtrij.push(e); volgende(); };
    document.fonts.ready.then(() => { document.body.dataset.klaar = '1'; });
</script>
</body>
